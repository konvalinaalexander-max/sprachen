<style>
/* ============================================================
   Sprachen - Lernoberfläche
   Dunkle "Study Lounge" mit warmem Papier-Panel fürs Lesen.
   Keine externen Fonts, keine externen Assets -> 100% offline.
   ============================================================ */

:root{
  --bg:#0b0d12;
  --bg-2:#11141c;
  --surface:rgba(255,255,255,.045);
  --surface-2:rgba(255,255,255,.075);
  --line:rgba(255,255,255,.10);
  --line-strong:rgba(255,255,255,.18);
  --ink:#eef1f7;
  --ink-2:#a9b2c5;
  --ink-3:#6f7891;
  --ok:#3ddc97;
  --ok-dim:rgba(61,220,151,.14);
  --no:#ff6b6b;
  --no-dim:rgba(255,107,107,.14);
  --warn:#ffc857;
  --paper:#f7f3ea;
  --paper-ink:#26231d;
  --paper-ink-2:#5d574c;

  --a1:#7c8cff; --a2:#c084fc;      /* wird pro Sprache überschrieben */
  --glow:rgba(124,140,255,.30);

  --r-s:10px; --r-m:16px; --r-l:24px; --r-xl:32px;
  --ease:cubic-bezier(.22,1,.36,1);
  --ease-back:cubic-bezier(.34,1.56,.64,1);

  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --serif:ui-serif,Georgia,"Iowan Old Style","Palatino Linotype",serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}

body[data-lang="es"]{ --a1:#ffa43d; --a2:#e5484d; --glow:rgba(255,164,61,.30); }
body[data-lang="fr"]{ --a1:#5b8cff; --a2:#f0637a; --glow:rgba(91,140,255,.30); }

*{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0;
  font-family:var(--sans);
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow-x:hidden;
}

/* Hintergrund: zwei weiche Farbwolken, die auf die Sprache reagieren */
.aura{ position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
.aura::before,.aura::after{
  content:""; position:absolute; width:70vmax; height:70vmax; border-radius:50%;
  filter:blur(90px); opacity:.28; transition:background 900ms var(--ease), opacity 900ms var(--ease);
}
.aura::before{ background:var(--a1); top:-32vmax; left:-18vmax; }
.aura::after { background:var(--a2); bottom:-38vmax; right:-20vmax; opacity:.20; }
body[data-view="home"] .aura::before{ opacity:.30; }
body[data-view="home"] .aura::after{ opacity:.14; }
body[data-view="home"] main{ display:flex; align-items:center; min-height:calc(100vh - 190px); }
body[data-view="home"] main > #view{ width:100%; }

.grain{
  position:fixed; inset:0; z-index:1; pointer-events:none; opacity:.35;
  background-image:radial-gradient(rgba(255,255,255,.045) 1px, transparent 1px);
  background-size:3px 3px;
}

.app{ position:relative; z-index:2; min-height:100%; display:flex; flex-direction:column; }

/* ---------- Kopfzeile ---------- */
.topbar{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; gap:14px;
  padding:12px clamp(14px,4vw,34px);
  backdrop-filter:blur(16px) saturate(140%);
  background:linear-gradient(to bottom,rgba(11,13,18,.92),rgba(11,13,18,.55));
  border-bottom:1px solid var(--line);
}
.brand{ display:flex; align-items:center; gap:10px; font-weight:650; letter-spacing:-.01em; cursor:pointer; background:none; border:0; color:var(--ink); font-size:15px; padding:4px; border-radius:10px; font-family:var(--sans); }
.brand:hover{ color:#fff; }
.brand .mark{
  width:26px; height:26px; border-radius:9px; flex:none;
  background:linear-gradient(135deg,var(--a1),var(--a2));
  box-shadow:0 4px 16px var(--glow);
  display:grid; place-items:center; font-size:13px; color:#0b0d12; font-weight:800;
}
.topbar .spacer{ flex:1; }

.pill{
  display:inline-flex; align-items:center; gap:7px;
  padding:6px 12px; border-radius:999px;
  background:var(--surface); border:1px solid var(--line);
  font-size:12.5px; color:var(--ink-2); font-variant-numeric:tabular-nums;
}
.pill b{ color:var(--ink); font-weight:650; }
.pill .flame{ filter:saturate(1.4); }

.icon-btn{
  width:36px; height:36px; display:grid; place-items:center;
  border-radius:11px; border:1px solid var(--line); background:var(--surface);
  color:var(--ink-2); cursor:pointer; transition:.2s var(--ease);
}
.icon-btn:hover{ background:var(--surface-2); color:var(--ink); border-color:var(--line-strong); transform:translateY(-1px); }

/* ---------- Stationsleiste ---------- */
.rail{ padding:0 clamp(14px,4vw,34px); }
.rail-inner{
  max-width:940px; margin:0 auto; padding:14px 0 4px;
  display:flex; align-items:center; gap:6px;
}
.rail-step{
  flex:1; display:flex; flex-direction:column; gap:7px; align-items:center;
  background:none; border:0; padding:4px 2px; cursor:pointer; font-family:var(--sans);
  color:var(--ink-3); font-size:11px; letter-spacing:.02em; transition:.25s var(--ease);
}
.rail-step .bar{ height:3px; width:100%; border-radius:3px; background:rgba(255,255,255,.10); overflow:hidden; }
.rail-step .bar i{ display:block; height:100%; width:0; border-radius:3px; background:linear-gradient(90deg,var(--a1),var(--a2)); transition:width .6s var(--ease); }
.rail-step[data-state="done"] .bar i{ width:100%; }
.rail-step[data-state="active"] .bar i{ width:100%; animation:pulseBar 2.4s ease-in-out infinite; }
.rail-step[data-state="active"]{ color:var(--ink); }
.rail-step[data-state="done"]{ color:var(--ink-2); }
.rail-step:hover:not(:disabled){ color:var(--ink); }
.rail-step:disabled{ cursor:default; opacity:.55; }
@keyframes pulseBar{ 0%,100%{ opacity:1 } 50%{ opacity:.55 } }

/* ---------- Layout ---------- */
main{ flex:1; padding:clamp(18px,4vw,40px) clamp(14px,4vw,34px) 120px; }
.wrap{ max-width:780px; margin:0 auto; }
.wrap.wide{ max-width:1020px; }

.view{ animation:rise .55s var(--ease) both; }
@keyframes rise{ from{ opacity:0; transform:translateY(14px) } to{ opacity:1; transform:none } }

h1,h2,h3{ margin:0; letter-spacing:-.022em; line-height:1.15; }
h1{ font-family:var(--serif); font-size:clamp(30px,5.2vw,46px); font-weight:600; }
h2{ font-family:var(--serif); font-size:clamp(22px,3.4vw,30px); font-weight:600; }
h3{ font-size:16px; font-weight:650; letter-spacing:-.01em; }
p{ line-height:1.65; color:var(--ink-2); margin:0; }

.eyebrow{
  display:inline-flex; align-items:center; gap:8px;
  font-size:11.5px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--a1); font-weight:700; margin-bottom:14px;
}
.eyebrow::before{ content:""; width:22px; height:1.5px; background:linear-gradient(90deg,var(--a1),transparent); }

.lead{ font-size:17px; line-height:1.62; color:var(--ink-2); }
.prose p{ margin:0 0 .85em; }
.prose p:last-child{ margin-bottom:0; }
.muted{ color:var(--ink-3); font-size:13.5px; }

.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r-l);
  padding:clamp(18px,3vw,26px);
}
.card + .card{ margin-top:14px; }
.stack{ display:flex; flex-direction:column; gap:14px; }
.stack-lg{ display:flex; flex-direction:column; gap:26px; }
.row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:9px;
  padding:13px 22px; border-radius:14px; border:1px solid transparent;
  font-family:var(--sans); font-size:14.5px; font-weight:600; letter-spacing:-.01em;
  cursor:pointer; transition:.22s var(--ease); white-space:nowrap;
  background:var(--surface); color:var(--ink); border-color:var(--line);
}
.btn:hover{ background:var(--surface-2); border-color:var(--line-strong); transform:translateY(-1px); }
.btn:active{ transform:translateY(0) scale(.985); }
.btn:disabled{ opacity:.4; cursor:not-allowed; transform:none; }
.btn-primary{
  background:linear-gradient(135deg,var(--a1),var(--a2)); color:#0b0d12; border-color:transparent;
  box-shadow:0 8px 26px -8px var(--glow);
}
.btn-primary:hover{ box-shadow:0 14px 34px -10px var(--glow); filter:brightness(1.06); }
.btn-ghost{ background:transparent; border-color:var(--line); color:var(--ink-2); }
.btn-sm{ padding:8px 14px; font-size:13px; border-radius:11px; }
.btn-block{ width:100%; }

/* ---------- Startseite: Sprachwahl ---------- */
.home-head{ text-align:center; margin-bottom:clamp(26px,5vw,44px); }
.home-head h1 .grad{ background:linear-gradient(120deg,var(--a1),var(--a2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
.picker{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
@media(max-width:680px){ .picker{ grid-template-columns:1fr; } }

.lang-card{
  position:relative; overflow:hidden; text-align:left; cursor:pointer;
  border:1px solid var(--line); border-radius:var(--r-xl);
  background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
  padding:26px 24px 22px; color:var(--ink); font-family:var(--sans);
  transition:.4s var(--ease); isolation:isolate;
}
.lang-card::after{
  content:""; position:absolute; inset:0; z-index:-1; opacity:0; transition:opacity .45s var(--ease);
  background:radial-gradient(120% 90% at 20% 0%, var(--c1), transparent 62%);
}
.lang-card:hover{ transform:translateY(-5px); border-color:var(--line-strong); box-shadow:0 24px 60px -30px var(--c1); }
.lang-card:hover::after{ opacity:.5; }
.lang-card[data-l="es"]{ --c1:rgba(255,164,61,.45); --a1:#ffa43d; --a2:#e5484d; --glow:rgba(255,164,61,.30); }
.lang-card[data-l="fr"]{ --c1:rgba(91,140,255,.45); --a1:#5b8cff; --a2:#f0637a; --glow:rgba(91,140,255,.30); }
.flag{ width:64px; height:44px; border-radius:9px; overflow:hidden; box-shadow:0 8px 22px -8px rgba(0,0,0,.7); display:block; }
.lang-card h2{ margin-top:18px; }
.lang-card .native{ font-family:var(--serif); font-style:italic; color:var(--ink-3); font-size:15px; margin-top:2px; }
.lang-card .meta{ display:flex; gap:8px; flex-wrap:wrap; margin-top:18px; }
.tag{
  font-size:11.5px; padding:5px 11px; border-radius:999px;
  background:rgba(255,255,255,.07); border:1px solid var(--line); color:var(--ink-2);
  letter-spacing:.01em; white-space:nowrap;
}
.tag.hot{ background:linear-gradient(135deg,var(--a1),var(--a2)); color:#0b0d12; border-color:transparent; font-weight:650; }
.tag.ghost{ background:transparent; border-style:dashed; color:var(--ink-3); }
.lang-card .cta{ margin-top:20px; display:flex; align-items:center; gap:8px; font-size:14px; font-weight:600; color:var(--ink); }
.lang-card .cta .arrow{ transition:transform .35s var(--ease-back); }
.lang-card:hover .cta .arrow{ transform:translateX(5px); }

/* ---------- Wortkarten ---------- */
.vocab-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:11px; }
.vcard{
  position:relative; border:1px solid var(--line); border-radius:var(--r-m);
  background:var(--surface); padding:15px 16px; cursor:pointer; text-align:left;
  font-family:var(--sans); color:var(--ink); transition:.28s var(--ease); overflow:hidden;
}
.vcard:hover{ background:var(--surface-2); transform:translateY(-2px); border-color:var(--line-strong); }
.vcard .term{ font-size:16px; font-weight:640; letter-spacing:-.01em; }
.vcard .pos{ font-size:10.5px; color:var(--a1); text-transform:uppercase; letter-spacing:.1em; font-weight:700; margin-top:3px; }
.vcard .de{
  font-size:13.5px; color:var(--ink-2); margin-top:9px;
  filter:blur(5px); opacity:.55; transition:.3s var(--ease); user-select:none;
}
.vcard.open .de{ filter:none; opacity:1; user-select:text; }
.vcard .ex{ font-size:12.5px; color:var(--ink-3); font-style:italic; margin-top:8px; line-height:1.5; display:none; }
.vcard.open .ex{ display:block; animation:rise .35s var(--ease) both; }
.vcard .hint{ position:absolute; top:13px; right:13px; font-size:10px; color:var(--ink-3); opacity:.7; }
.vcard.open .hint{ opacity:0; }

/* ---------- Grammatik ---------- */
.gbox{ border:1px solid var(--line); border-radius:var(--r-l); overflow:hidden; background:var(--surface); }
.gbox-head{ padding:18px 22px; background:linear-gradient(135deg,rgba(255,255,255,.05),transparent); border-bottom:1px solid var(--line); }
.gbox-head .why{ font-size:13px; color:var(--ink-3); margin-top:5px; }
.gbox-body{ padding:20px 22px; display:flex; flex-direction:column; gap:18px; }
.gtable{ width:100%; border-collapse:collapse; font-size:14px; }
.gtable th{ text-align:left; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); font-weight:700; padding:0 12px 9px 0; }
.gtable td{ padding:8px 12px 8px 0; border-top:1px solid var(--line); color:var(--ink-2); }
.gtable td:first-child{ color:var(--ink); font-weight:560; }
.gtable .hl{ color:var(--a1); font-weight:700; }
.scroll-x{ overflow-x:auto; }

.ex-line{ display:flex; flex-direction:column; gap:3px; padding:11px 14px; border-radius:var(--r-s); background:rgba(255,255,255,.035); border-left:2px solid var(--a1); }
.ex-line .src{ font-size:15px; color:var(--ink); line-height:1.5; }
.ex-line .trg{ font-size:13px; color:var(--ink-3); }
.ex-line .note{ font-size:12px; color:var(--a1); margin-top:3px; }
mark, .hl-word{ background:linear-gradient(transparent 58%, var(--glow) 58%); color:inherit; border-radius:2px; padding:0 1px; font-weight:600; }

.pitfall{ display:flex; gap:11px; padding:13px 15px; border-radius:var(--r-m); background:rgba(255,200,87,.07); border:1px solid rgba(255,200,87,.2); }
.pitfall .ic{ flex:none; font-size:15px; line-height:1.4; }
.pitfall div p{ font-size:13.5px; color:var(--ink-2); }
.pitfall b{ color:var(--warn); }

/* ---------- Lesetext: Papier ---------- */
.paper{
  background:var(--paper); color:var(--paper-ink); border-radius:var(--r-l);
  padding:clamp(24px,4.5vw,44px); box-shadow:0 30px 70px -34px rgba(0,0,0,.85);
  position:relative;
}
.paper h2{ color:var(--paper-ink); font-size:clamp(23px,3.6vw,31px); }
.paper .byline{ font-size:12.5px; color:var(--paper-ink-2); margin-top:9px; padding-bottom:18px; border-bottom:1px solid rgba(0,0,0,.10); }
.paper p{ color:var(--paper-ink); font-family:var(--serif); font-size:var(--read-size,18px); line-height:1.78; margin-top:17px; }
.paper p:first-of-type::first-letter{
  float:left; font-size:3.05em; line-height:.82; padding:.05em .10em 0 0; font-weight:600; color:var(--a2);
}
.gl{
  border-bottom:1.5px dotted rgba(0,0,0,.34); cursor:help; position:relative;
  transition:background .2s var(--ease);
}
.gl:hover, .gl.on{ background:rgba(255,200,87,.38); border-radius:3px; }
.gl .tip{
  position:absolute; left:50%; bottom:calc(100% + 9px); transform:translateX(-50%) translateY(5px);
  background:#15181f; color:#eef1f7; font-family:var(--sans); font-size:12.5px; font-style:normal; font-weight:500;
  padding:8px 12px; border-radius:9px; white-space:nowrap; max-width:74vw;
  opacity:0; pointer-events:none; transition:.22s var(--ease); z-index:20;
  box-shadow:0 10px 30px -10px rgba(0,0,0,.8); line-height:1.4;
}
.gl:hover .tip, .gl.on .tip{ opacity:1; transform:translateX(-50%) translateY(0); }
.paper-tools{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:16px; }
.chip{
  font-size:12px; padding:6px 12px; border-radius:999px; cursor:pointer;
  background:rgba(0,0,0,.05); border:1px solid rgba(0,0,0,.12); color:var(--paper-ink-2);
  font-family:var(--sans); transition:.2s var(--ease);
}
.chip:hover{ background:rgba(0,0,0,.09); color:var(--paper-ink); }
.chip[aria-pressed="true"]{ background:var(--paper-ink); color:var(--paper); border-color:var(--paper-ink); }
.trans{
  display:none; font-family:var(--sans); font-size:14px; color:var(--paper-ink-2);
  padding:10px 14px; margin-top:9px; border-left:2px solid rgba(0,0,0,.16); line-height:1.6;
}
.paper.show-trans .trans{ display:block; animation:rise .3s var(--ease) both; }

/* ---------- Aufgaben ---------- */
.task-shell{ display:flex; flex-direction:column; gap:18px; }
.task-head{ display:flex; align-items:flex-start; gap:14px; }
.task-num{
  flex:none; width:36px; height:36px; border-radius:12px; display:grid; place-items:center;
  background:linear-gradient(135deg,var(--a1),var(--a2)); color:#0b0d12; font-weight:800; font-size:14px;
  box-shadow:0 6px 18px -6px var(--glow);
}
.task-kind{ font-size:11px; letter-spacing:.13em; text-transform:uppercase; color:var(--a1); font-weight:700; }
.task-q{ font-size:17px; line-height:1.5; margin-top:4px; color:var(--ink); font-weight:500; }

.opts{ display:flex; flex-direction:column; gap:9px; }
.opt{
  display:flex; align-items:center; gap:13px; width:100%; text-align:left;
  padding:14px 17px; border-radius:var(--r-m); cursor:pointer;
  background:var(--surface); border:1px solid var(--line); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.45; transition:.2s var(--ease);
}
.opt:hover:not(:disabled){ background:var(--surface-2); border-color:var(--line-strong); transform:translateX(3px); }
.opt .key{
  flex:none; width:25px; height:25px; border-radius:8px; display:grid; place-items:center;
  border:1px solid var(--line-strong); font-size:11.5px; color:var(--ink-3); font-weight:700;
}
.opt:disabled{ cursor:default; }
.opt.right{ background:var(--ok-dim); border-color:rgba(61,220,151,.5); }
.opt.right .key{ background:var(--ok); color:#08120d; border-color:transparent; }
.opt.wrong{ background:var(--no-dim); border-color:rgba(255,107,107,.5); }
.opt.wrong .key{ background:var(--no); color:#1a0808; border-color:transparent; }
.opt.faded{ opacity:.4; }

.verdict{
  display:flex; gap:12px; padding:15px 17px; border-radius:var(--r-m);
  border:1px solid var(--line); background:var(--surface);
  animation:rise .35s var(--ease) both;
}
.verdict.good{ background:var(--ok-dim); border-color:rgba(61,220,151,.35); }
.verdict.bad{ background:var(--no-dim); border-color:rgba(255,107,107,.35); }
.verdict .ic{ flex:none; font-size:17px; }
.verdict .t{ font-weight:650; font-size:14.5px; margin-bottom:4px; }
.verdict.good .t{ color:var(--ok); }
.verdict.bad .t{ color:var(--no); }
.verdict p{ font-size:13.5px; line-height:1.6; }
.verdict code{ font-family:var(--mono); font-size:12.5px; background:rgba(255,255,255,.08); padding:2px 6px; border-radius:5px; color:var(--ink); }

/* Beweis-Klick im Text (Textdetektiv) */
.evidence{ background:var(--paper); color:var(--paper-ink); border-radius:var(--r-m); padding:18px 20px; }
.evidence .sent{
  cursor:pointer; padding:3px 4px; margin:0 -2px; border-radius:5px; font-family:var(--serif);
  font-size:16px; line-height:1.75; transition:.18s var(--ease); display:inline;
}
.evidence .sent:hover{ background:rgba(0,0,0,.07); }
.evidence .sent.picked-right{ background:rgba(61,180,120,.32); box-shadow:inset 0 0 0 1px rgba(30,120,80,.5); }
.evidence .sent.picked-wrong{ background:rgba(229,72,77,.26); }

/* Satzschmiede */
.forge{ display:flex; flex-direction:column; gap:14px; }
.slot{
  min-height:60px; display:flex; flex-wrap:wrap; gap:8px; align-content:flex-start;
  padding:13px; border-radius:var(--r-m); border:1.5px dashed var(--line-strong);
  background:rgba(255,255,255,.025); transition:.25s var(--ease);
}
.slot.filled{ border-style:solid; background:rgba(255,255,255,.05); }
.slot.ok{ border-color:rgba(61,220,151,.6); background:var(--ok-dim); }
.slot.no{ border-color:rgba(255,107,107,.55); background:var(--no-dim); }
.bank{ display:flex; flex-wrap:wrap; gap:8px; }
.word{
  padding:9px 15px; border-radius:11px; cursor:pointer; font-size:15px; font-family:var(--sans);
  background:var(--surface-2); border:1px solid var(--line-strong); color:var(--ink);
  transition:.18s var(--ease-back); user-select:none;
}
.word:hover{ background:rgba(255,255,255,.13); transform:translateY(-2px); }
.word:active{ transform:scale(.94); }
.word.used{
  color:transparent; background:rgba(255,255,255,.02);
  border-color:rgba(255,255,255,.07); border-style:dashed;
  pointer-events:none; transform:none;
}
.word.in-slot{ background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.07)); }

/* Verwandler (Texteingabe) */
.type-row{ display:flex; gap:10px; align-items:stretch; flex-wrap:wrap; }
.field{
  flex:1; min-width:220px; padding:14px 17px; border-radius:var(--r-m);
  background:rgba(255,255,255,.05); border:1px solid var(--line-strong); color:var(--ink);
  font-family:var(--sans); font-size:16px; outline:none; transition:.2s var(--ease);
}
.field:focus{ border-color:var(--a1); box-shadow:0 0 0 3px var(--glow); background:rgba(255,255,255,.07); }
.field::placeholder{ color:var(--ink-3); }
textarea.field{ width:100%; resize:vertical; min-height:120px; line-height:1.6; font-size:15px; }
.accents{ display:flex; gap:5px; flex-wrap:wrap; margin-top:9px; }
.acc{
  width:34px; height:34px; border-radius:9px; cursor:pointer; font-size:15px;
  background:var(--surface); border:1px solid var(--line); color:var(--ink-2); font-family:var(--serif);
  transition:.16s var(--ease-back);
}
.acc:hover{ background:var(--surface-2); color:var(--ink); transform:translateY(-2px); }
.diff{ font-family:var(--mono); font-size:15px; letter-spacing:.01em; }
.diff .keep{ color:var(--ink-2); }
.diff .add{ background:var(--ok-dim); color:var(--ok); border-radius:3px; padding:1px 2px; }
.diff .del{ background:var(--no-dim); color:var(--no); border-radius:3px; padding:1px 2px; text-decoration:line-through; }

/* Paarjagd */
.pairs{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
@media(max-width:560px){ .pairs{ gap:7px; } }
.pcol{ display:flex; flex-direction:column; gap:9px; }
.pitem{
  padding:13px 15px; border-radius:var(--r-m); cursor:pointer; text-align:left;
  background:var(--surface); border:1px solid var(--line); color:var(--ink);
  font-family:var(--sans); font-size:14.5px; transition:.22s var(--ease); line-height:1.35;
}
.pitem:hover:not(:disabled){ background:var(--surface-2); transform:translateY(-1px); }
.pitem.sel{ border-color:var(--a1); background:rgba(255,255,255,.10); box-shadow:0 0 0 2px var(--glow); }
.pitem.matched{ opacity:.34; pointer-events:none; border-style:dashed; }
.pitem.shake{ animation:shake .4s; }
@keyframes shake{ 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }

/* Fortschritt innerhalb der Aufgaben */
.task-progress{ display:flex; gap:5px; margin-bottom:4px; }
.task-progress i{ flex:1; height:4px; border-radius:3px; background:rgba(255,255,255,.10); transition:.4s var(--ease); }
.task-progress i.done{ background:linear-gradient(90deg,var(--a1),var(--a2)); }
.task-progress i.miss{ background:var(--no); opacity:.7; }
.task-progress i.now{ background:rgba(255,255,255,.32); }

/* Streak-Feedback */
.combo{
  position:fixed; left:50%; top:22%; transform:translate(-50%,-10px) scale(.9);
  font-family:var(--serif); font-size:44px; font-weight:700; pointer-events:none; z-index:90;
  background:linear-gradient(120deg,var(--a1),var(--a2)); -webkit-background-clip:text; background-clip:text; color:transparent;
  opacity:0;
}
.combo.go{ animation:combo 1.15s var(--ease) both; }
@keyframes combo{
  0%{ opacity:0; transform:translate(-50%,10px) scale(.7) }
  22%{ opacity:1; transform:translate(-50%,-8px) scale(1.1) }
  72%{ opacity:1; transform:translate(-50%,-14px) scale(1) }
  100%{ opacity:0; transform:translate(-50%,-42px) scale(.95) }
}
.spark{ position:fixed; width:7px; height:7px; border-radius:50%; pointer-events:none; z-index:89; }

/* ---------- Hörstation ---------- */
.source-card{
  border:1px solid var(--line); border-radius:var(--r-l); overflow:hidden;
  background:linear-gradient(150deg,rgba(255,255,255,.075),rgba(255,255,255,.02));
}
.source-card .sc-head{ padding:20px 22px 18px; display:flex; gap:16px; align-items:flex-start; }
.sc-icon{
  flex:none; width:50px; height:50px; border-radius:15px; display:grid; place-items:center; font-size:21px;
  background:linear-gradient(135deg,var(--a1),var(--a2)); box-shadow:0 10px 26px -10px var(--glow);
}
.sc-meta{ display:flex; gap:7px; flex-wrap:wrap; margin-top:10px; }
.sc-actions{ padding:0 22px 20px; display:flex; gap:9px; flex-wrap:wrap; }
.alts{ padding:15px 22px; border-top:1px solid var(--line); background:rgba(0,0,0,.18); }
.alt-link{
  display:flex; align-items:center; gap:10px; padding:9px 0; color:var(--ink-2);
  font-size:13.5px; text-decoration:none; transition:.2s var(--ease); border-bottom:1px solid transparent;
}
.alt-link:hover{ color:var(--ink); }
.alt-link .why{ color:var(--ink-3); font-size:12.5px; }
.alt-link .go{ margin-left:auto; color:var(--a1); font-size:12px; }

.pass{
  border:1px solid var(--line); border-radius:var(--r-m); background:var(--surface);
  overflow:hidden; transition:.3s var(--ease);
}
.pass.active{ border-color:var(--line-strong); background:var(--surface-2); }
.pass-head{
  display:flex; align-items:center; gap:13px; padding:15px 18px; cursor:pointer;
  background:none; border:0; width:100%; text-align:left; font-family:var(--sans); color:var(--ink);
}
.pass-n{
  flex:none; width:29px; height:29px; border-radius:10px; display:grid; place-items:center;
  border:1px solid var(--line-strong); font-size:12.5px; font-weight:700; color:var(--ink-3);
}
.pass.done .pass-n{ background:var(--ok); color:#08120d; border-color:transparent; }
.pass-head .t{ font-size:15px; font-weight:600; }
.pass-head .s{ font-size:12.5px; color:var(--ink-3); margin-top:2px; }
.pass-body{ padding:0 18px 18px; display:none; flex-direction:column; gap:12px; }
.pass.active .pass-body{ display:flex; animation:rise .3s var(--ease) both; }

/* ---------- Umfrage ---------- */
.q-block{ border-top:1px solid var(--line); padding-top:20px; margin-top:20px; }
.q-block:first-child{ border-top:0; padding-top:0; margin-top:0; }
.q-title{ font-size:15.5px; font-weight:600; margin-bottom:12px; line-height:1.45; }
.scale{ display:flex; gap:7px; }
.scale button{
  flex:1; padding:13px 4px; border-radius:12px; cursor:pointer; font-family:var(--sans);
  background:var(--surface); border:1px solid var(--line); color:var(--ink-2);
  font-size:19px; transition:.22s var(--ease-back);
}
.scale button:hover{ transform:translateY(-3px); background:var(--surface-2); }
.scale button[aria-pressed="true"]{ background:linear-gradient(135deg,var(--a1),var(--a2)); border-color:transparent; transform:translateY(-3px) scale(1.04); box-shadow:0 10px 24px -8px var(--glow); }
.scale-legend{ display:flex; justify-content:space-between; font-size:11.5px; color:var(--ink-3); margin-top:7px; }
.choices{ display:flex; gap:8px; flex-wrap:wrap; }
.choice{
  padding:10px 16px; border-radius:12px; cursor:pointer; font-family:var(--sans); font-size:14px;
  background:var(--surface); border:1px solid var(--line); color:var(--ink-2); transition:.2s var(--ease);
}
.choice:hover{ background:var(--surface-2); color:var(--ink); }
.choice[aria-pressed="true"]{ background:linear-gradient(135deg,var(--a1),var(--a2)); color:#0b0d12; border-color:transparent; font-weight:620; }

/* ---------- Abschluss / Report ---------- */
.score-ring{ display:grid; place-items:center; margin:0 auto 6px; position:relative; width:138px; height:138px; }
.score-ring svg{ transform:rotate(-90deg); }
.score-ring .val{ position:absolute; font-family:var(--serif); font-size:38px; font-weight:600; }
.score-ring .val small{ font-size:15px; color:var(--ink-3); }

.stat-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(115px,1fr)); gap:10px; }
.stat{ padding:15px; border-radius:var(--r-m); background:var(--surface); border:1px solid var(--line); text-align:center; }
.stat .n{ font-family:var(--serif); font-size:25px; font-weight:600; }
.stat .l{ font-size:11.5px; color:var(--ink-3); margin-top:3px; letter-spacing:.02em; }

.mistake{
  padding:15px 17px; border-radius:var(--r-m); background:rgba(255,107,107,.06);
  border:1px solid rgba(255,107,107,.2); display:flex; flex-direction:column; gap:7px;
}
.mistake .q{ font-size:14px; color:var(--ink); font-weight:560; line-height:1.45; }
.mistake .line{ font-size:13.5px; display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; }
.mistake .lbl{ font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); min-width:52px; }
.mistake .yours{ color:var(--no); text-decoration:line-through; text-decoration-color:rgba(255,107,107,.5); }
.mistake .right{ color:var(--ok); font-weight:600; }
.mistake .exp{ font-size:13px; color:var(--ink-2); line-height:1.6; border-top:1px solid rgba(255,255,255,.07); padding-top:9px; }

.report-box{
  font-family:var(--mono); font-size:11.5px; line-height:1.55; color:var(--ink-2);
  background:#080a0e; border:1px solid var(--line); border-radius:var(--r-m);
  padding:15px; max-height:200px; overflow:auto; white-space:pre-wrap; word-break:break-all;
}

/* ---------- Menü / Dialog ---------- */
.sheet{
  position:fixed; inset:0; z-index:100; display:none;
  background:rgba(5,6,9,.72); backdrop-filter:blur(7px);
  align-items:center; justify-content:center; padding:20px;
}
.sheet.open{ display:flex; animation:fade .25s var(--ease) both; }
@keyframes fade{ from{opacity:0} to{opacity:1} }
.sheet-inner{
  width:100%; max-width:420px; background:var(--bg-2); border:1px solid var(--line-strong);
  border-radius:var(--r-l); padding:24px; animation:pop .35s var(--ease-back) both;
  box-shadow:0 40px 90px -30px rgba(0,0,0,.9);
}
@keyframes pop{ from{ opacity:0; transform:translateY(18px) scale(.96) } to{ opacity:1; transform:none } }
.menu-item{
  display:flex; align-items:center; gap:13px; width:100%; padding:13px 15px; border-radius:13px;
  background:none; border:1px solid transparent; color:var(--ink-2); cursor:pointer;
  font-family:var(--sans); font-size:14.5px; text-align:left; transition:.18s var(--ease);
}
.menu-item:hover{ background:var(--surface); color:var(--ink); border-color:var(--line); }
.menu-item .ic{ width:20px; text-align:center; font-size:15px; }
.menu-item.danger:hover{ background:var(--no-dim); color:var(--no); border-color:rgba(255,107,107,.3); }
.menu-sep{ height:1px; background:var(--line); margin:9px 0; }

/* ---------- Fußleiste ---------- */
.footbar{
  position:fixed; left:0; right:0; bottom:0; z-index:50;
  padding:13px clamp(14px,4vw,34px) calc(13px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,rgba(11,13,18,.97) 62%,rgba(11,13,18,0));
  display:flex; justify-content:center;
}
.footbar-inner{ width:100%; max-width:780px; display:flex; gap:11px; align-items:center; }
.footbar .hint{ font-size:12.5px; color:var(--ink-3); flex:1; line-height:1.4; }

.toast{
  position:fixed; bottom:88px; left:50%; transform:translateX(-50%) translateY(14px);
  background:var(--bg-2); border:1px solid var(--line-strong); color:var(--ink);
  padding:11px 19px; border-radius:13px; font-size:13.5px; z-index:120;
  opacity:0; pointer-events:none; transition:.3s var(--ease); box-shadow:0 16px 40px -14px rgba(0,0,0,.9);
}
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

.empty{ text-align:center; padding:60px 20px; }
.empty .big{ font-size:44px; margin-bottom:14px; opacity:.5; }

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
}
@media print{ .topbar,.footbar,.rail{ display:none } body{ background:#fff } }

/* ---------- Folgen-Spieler ---------- */
.player{ padding:0 22px 20px; display:flex; flex-direction:column; gap:12px; }
.player-status{ display:flex; align-items:center; gap:10px; color:var(--ink-3); font-size:13.5px; padding:14px 0; }
.spinner{
  width:15px; height:15px; border-radius:50%; flex:none;
  border:2px solid rgba(255,255,255,.15); border-top-color:var(--a1);
  animation:spin .8s linear infinite;
}
@keyframes spin{ to{ transform:rotate(360deg) } }

.ep-head{ display:flex; flex-direction:column; gap:7px; }
.ep-live{
  font-size:10.5px; letter-spacing:.13em; text-transform:uppercase; font-weight:700;
  color:var(--ok); display:flex; align-items:center; gap:7px;
}
.ep-live::before{
  content:""; width:7px; height:7px; border-radius:50%; background:var(--ok);
  box-shadow:0 0 0 0 rgba(61,220,151,.55); animation:ping 2s ease-out infinite;
}
@keyframes ping{ 70%{ box-shadow:0 0 0 8px rgba(61,220,151,0) } 100%{ box-shadow:0 0 0 0 rgba(61,220,151,0) } }
.ep-title{ font-size:16.5px; font-weight:620; line-height:1.4; color:var(--ink); letter-spacing:-.01em; }
.ep-meta{ display:flex; gap:7px; flex-wrap:wrap; align-items:center; }
.tag.link{ text-decoration:none; color:var(--a1); border-color:rgba(255,255,255,.16); }
.tag.link:hover{ background:rgba(255,255,255,.11); }

.player-audio{
  width:100%; height:42px; border-radius:12px;
  background:rgba(255,255,255,.06); border:1px solid var(--line);
  color-scheme:dark;                 /* sonst rendert der Browser weisse Regler */
}
.player-audio::-webkit-media-controls-panel{ background:rgba(255,255,255,.04); }

.ep-more{ border-top:1px solid var(--line); padding-top:12px; }
.ep-more summary{
  cursor:pointer; font-size:13px; color:var(--ink-2); list-style:none;
  display:flex; align-items:center; gap:7px; padding:4px 0;
}
.ep-more summary::-webkit-details-marker{ display:none; }
.ep-more summary::before{ content:"▸"; color:var(--a1); transition:transform .2s var(--ease); display:inline-block; }
.ep-more[open] summary::before{ transform:rotate(90deg); }
.ep-more summary:hover{ color:var(--ink); }
.ep-list{ display:flex; flex-direction:column; gap:4px; margin-top:10px; max-height:260px; overflow-y:auto; }
.ep-item{
  display:flex; flex-direction:column; gap:3px; text-align:left; width:100%;
  padding:10px 13px; border-radius:11px; cursor:pointer;
  background:transparent; border:1px solid transparent; color:var(--ink-2);
  font-family:var(--sans); transition:.18s var(--ease);
}
.ep-item:hover{ background:var(--surface); border-color:var(--line); color:var(--ink); }
.ep-item.on{ background:var(--surface-2); border-color:var(--line-strong); color:var(--ink); }
.ep-item-t{ font-size:13.5px; line-height:1.4; font-weight:550; }
.ep-item-m{ font-size:11.5px; color:var(--ink-3); }

.player-fail{ padding:16px 0; }
.pf-head{ display:flex; gap:9px; align-items:center; font-size:14.5px; font-weight:600; color:var(--warn); margin-bottom:6px; }
.player-fail p{ font-size:13.5px; }

/* ---------- Quellen-Umschalter ---------- */
.src-switch{ display:flex; gap:8px; flex-wrap:wrap; }
.src-chip{
  display:flex; align-items:center; gap:9px; padding:9px 14px 9px 11px;
  border-radius:13px; cursor:pointer; text-align:left;
  background:var(--surface); border:1px solid var(--line); color:var(--ink-2);
  font-family:var(--sans); transition:.2s var(--ease);
}
.src-chip:hover{ background:var(--surface-2); color:var(--ink); border-color:var(--line-strong); }
.src-chip[aria-pressed="true"]{
  background:linear-gradient(135deg,var(--a1),var(--a2)); color:#0b0d12;
  border-color:transparent; box-shadow:0 8px 22px -10px var(--glow);
}
.src-chip .sc-n{ font-size:13px; font-weight:620; line-height:1.25; }
.src-chip .sc-l{ font-size:11px; opacity:.72; }

/* ---------- Niveau-Diagnose ---------- */
.diag-rows{ display:flex; flex-direction:column; gap:11px; margin-top:16px; }
.diag-row{ display:grid; grid-template-columns:minmax(96px,1.1fr) 2.4fr auto; gap:12px; align-items:center; }
@media(max-width:520px){ .diag-row{ grid-template-columns:1fr auto; } .diag-row .dr-bar{ grid-column:1/-1; order:3; } }
.dr-name{ font-size:13.5px; color:var(--ink-2); }
.dr-bar{ height:7px; border-radius:5px; background:rgba(255,255,255,.07); overflow:hidden; }
.dr-bar i{ display:block; height:100%; border-radius:5px; transition:width .8s var(--ease); }
.diag-row.ok  .dr-bar i{ background:linear-gradient(90deg,#2fbf80,var(--ok)); }
.diag-row.mid .dr-bar i{ background:linear-gradient(90deg,#d9a13a,var(--warn)); }
.diag-row.no  .dr-bar i{ background:linear-gradient(90deg,#c4494e,var(--no)); }
.diag-row.na  .dr-bar i{ background:rgba(255,255,255,.12); }
.dr-v{ font-size:12.5px; font-variant-numeric:tabular-nums; white-space:nowrap; }
.diag-row.ok  .dr-v{ color:var(--ok); }
.diag-row.mid .dr-v{ color:var(--warn); }
.diag-row.no  .dr-v{ color:var(--no); }
.diag-row.na  .dr-v{ color:var(--ink-3); }

.diag-item{
  display:flex; align-items:center; gap:10px; padding:11px 14px; border-radius:var(--r-m);
  background:rgba(255,255,255,.035); border-left:2px solid var(--line-strong); font-size:13.5px;
}
.diag-item.ok{ border-left-color:var(--ok); }
.diag-item.mid{ border-left-color:var(--warn); }
.diag-item.no{ border-left-color:var(--no); }
.diag-item .di-n{ flex:1; color:var(--ink); font-weight:550; }
.diag-item .di-v{ font-size:12.5px; }
.diag-item.ok .di-v{ color:var(--ok); }
.diag-item.mid .di-v{ color:var(--warn); }
.diag-item.no .di-v{ color:var(--no); }
.diag-item .di-q{ font-size:12px; color:var(--ink-3); font-variant-numeric:tabular-nums; }

/* Bühnen übernehmen den ganzen Schirm – Kopfleiste bleibt für das Menü sichtbar */
body[data-view="stage"] main{ padding:0; }
body[data-view="stage"] .topbar{
  background:linear-gradient(to bottom, rgba(6,6,10,.45), transparent);
  border-bottom:0; backdrop-filter:blur(3px);
}
body[data-view="stage"] .topbar .brand span:last-child,
body[data-view="stage"] #xp-badge{ opacity:.55; }
body[data-view="stage"] .aura, body[data-view="stage"] .grain{ display:none; }

/* ---------- Spickzettel in den Bühnen ---------- */
.hud-d, .bd-d{ display:flex; flex-direction:column; align-items:flex-end; gap:10px; }
.chuleta-btn{
  display:inline-flex; align-items:center; gap:6px; padding:7px 14px; border-radius:999px;
  background:rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.22); color:#fff;
  font-family:var(--sans); font-size:11.5px; letter-spacing:.09em; text-transform:uppercase;
  cursor:pointer; backdrop-filter:blur(8px); transition:.2s var(--ease);
}
.chuleta-btn:hover{ background:rgba(255,255,255,.2); transform:translateY(-1px); }
.chuleta-fond{
  position:fixed; inset:0; z-index:40; display:none; align-items:center; justify-content:center;
  padding:18px; background:rgba(5,6,10,.78); backdrop-filter:blur(10px);
}
.chuleta-fond.ouvert{ display:flex; animation:fade .25s ease both; }
.chuleta{
  position:relative; width:100%; max-width:600px; max-height:86vh; overflow-y:auto;
  background:linear-gradient(160deg,#181420,#0e0b14); border:1px solid rgba(255,255,255,.15);
  border-radius:20px; padding:clamp(22px,4vw,30px);
  box-shadow:0 40px 90px -28px rgba(0,0,0,.95);
  animation:pop .35s var(--ease-back) both;
}
.ch-x{
  position:absolute; top:14px; right:14px; width:30px; height:30px; border-radius:50%;
  background:rgba(255,255,255,.08); border:0; color:rgba(255,255,255,.7); cursor:pointer;
}
.ch-x:hover{ background:rgba(255,255,255,.16); color:#fff; }
.ch-k{ font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--a1); font-weight:700; margin-bottom:10px; }
.ch-x2 p{ color:rgba(255,255,255,.78); }
.chuleta .gtable{ margin:14px 0; }
.chuleta .gtable th{ color:rgba(255,255,255,.42); }
.chuleta .gtable td{ color:rgba(255,255,255,.8); border-top-color:rgba(255,255,255,.09); }
.ch-ex{ padding:11px 14px; border-radius:10px; background:rgba(255,255,255,.04); border-left:2px solid var(--a1); margin-top:9px; }
.ch-s{ font-size:15.5px; color:#fff; line-height:1.5; }
.ch-n{ font-size:12.5px; color:rgba(255,255,255,.55); margin-top:4px; line-height:1.5; }
.ch-p{ font-size:13px; line-height:1.6; color:rgba(255,200,87,.9); background:rgba(255,200,87,.07);
  border:1px solid rgba(255,200,87,.2); border-radius:10px; padding:11px 14px; margin-top:10px; }
.ch-voc{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:8px; }
.ch-v{ padding:10px 12px; border-radius:9px; background:rgba(255,255,255,.04); font-size:13px; line-height:1.5; }
.ch-v b{ color:#fff; display:block; margin-bottom:2px; }
.ch-v span{ color:rgba(255,255,255,.6); }

/* ============================================================
   Bühne "La noche" – Madrid zwischen Sonnenuntergang und Morgen
   ============================================================ */
.noche{
  position:fixed; inset:0; overflow:hidden; z-index:5;
  --glow:#ff8a5c;
  font-family:var(--sans);
}
.noche-sky{
  position:absolute; inset:0;
  --sky-top:#4a5fa8; --sky-mid:#e8814a; --sky-low:#ffc46b;
  background:linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-mid) 52%, var(--sky-low) 78%);
  transition:background 1600ms cubic-bezier(.4,0,.2,1);
}
.stars{ position:absolute; inset:0; transition:opacity 1600ms ease; }
.stars i{
  position:absolute; width:2px; height:2px; border-radius:50%; background:#fff;
  transform:scale(var(--s,1)); animation:tw 4.5s ease-in-out infinite;
}
@keyframes tw{ 0%,100%{opacity:.25} 50%{opacity:.95} }

.astro{
  position:absolute; left:50%; border-radius:50%;
  transition:opacity 1600ms ease, transform 1600ms cubic-bezier(.4,0,.2,1);
}
.sol{
  top:44%; width:112px; height:112px;
  background:radial-gradient(circle at 50% 50%, #fff3c4, #ffb347 58%, #ff7a3d);
  box-shadow:0 0 120px 50px rgba(255,150,80,.42);
}
.luna{
  top:12%; width:58px; height:58px; margin-left:180px;
  background:radial-gradient(circle at 36% 34%, #fdfbf2, #cfd4e0 70%);
  box-shadow:0 0 60px 14px rgba(220,230,255,.20);
}

.noche .layer{ position:absolute; left:0; right:0; bottom:0; pointer-events:none; }
.noche .layer svg{ display:block; width:100%; }
.layer.far{ height:42%; opacity:.62; }
.layer.far path{ fill:#1a1524; }
.layer.near{ height:34%; }
.layer.near path{ fill:#100c18; }
.layer.near .antennas path{ stroke:#100c18; stroke-width:3; fill:none; }
.layer.near .dish{ fill:none; stroke:#100c18; stroke-width:3; }
.layer.near .tendedero path{ stroke:#100c18; stroke-width:2; fill:none; }
.layer.near .tendedero rect{ fill:#1c1626; }
.layer.near .win{ fill:#2a2135; transition:fill .9s ease, filter .9s ease; }
.layer.near .win.lit{ fill:#ffcf82; filter:drop-shadow(0 0 6px rgba(255,190,110,.55)); }
.layer.bal{ height:15%; z-index:3; }
.layer.bal .rail path{ stroke:#0a0710; stroke-width:5; fill:none; }
.layer.bal .maceta path{ fill:#0a0710; }
.noche-vig{
  position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(120% 78% at 50% 24%, transparent 40%, rgba(4,3,8,.62) 100%);
}

/* Kopfleiste */
.noche .hud{
  position:absolute; top:0; left:0; right:0; z-index:6;
  display:flex; align-items:flex-start; justify-content:space-between;
  padding:74px clamp(16px,4vw,34px) 18px; transition:opacity .6s ease; pointer-events:none;
  text-shadow:0 2px 20px rgba(0,0,0,.6);
}
.noche .hud button{ pointer-events:auto; }
.hud-hora{ font-family:var(--serif); font-size:30px; font-weight:600; color:#fff; letter-spacing:-.02em; line-height:1; }
.hud-lugar{ font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:rgba(255,255,255,.68); margin-top:6px; }
.onda{ display:flex; align-items:center; gap:6px; }
.onda-l{ font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.6); margin-right:4px; }
.onda i{
  width:9px; height:9px; border-radius:50%; background:rgba(255,255,255,.22);
  transition:.45s var(--ease-back);
}
.onda i.on{ background:var(--glow); box-shadow:0 0 12px var(--glow); transform:scale(1.25); }
.onda.big{ justify-content:center; margin-top:20px; }
.onda.big i{ width:13px; height:13px; }

/* Panel */
.noche-panel{
  position:absolute; left:0; right:0; bottom:0; z-index:7;
  display:flex; justify-content:center; padding:0 clamp(12px,3vw,28px) clamp(16px,3vw,30px);
  max-height:80vh; overflow-y:auto; overscroll-behavior:contain;
}
.noche-panel::-webkit-scrollbar{ width:5px; }
.noche-panel::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.18); border-radius:3px; }

.portada, .escena{
  width:100%; max-width:620px; border-radius:26px;
  background:linear-gradient(165deg, rgba(28,20,34,.90), rgba(14,10,20,.94));
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 30px 80px -30px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.07);
  backdrop-filter:blur(18px) saturate(130%);
  padding:clamp(22px,4vw,32px);
  animation:subir .6s var(--ease) both;
}
@keyframes subir{ from{opacity:0; transform:translateY(26px)} to{opacity:1; transform:none} }

/* Azulejo als feine Textur auf dem Panel */
.portada::before, .escena::before{
  content:""; position:absolute; inset:0; border-radius:26px; pointer-events:none; opacity:.055;
  background-image:
    radial-gradient(circle at 0 0, var(--glow) 2px, transparent 2.5px),
    radial-gradient(circle at 14px 14px, var(--glow) 2px, transparent 2.5px);
  background-size:28px 28px;
}
.portada, .escena{ position:relative; }

.portada{ text-align:center; }
.p-kicker{ font-size:11px; letter-spacing:.24em; text-transform:uppercase; color:var(--glow); font-weight:700; }
.p-title{ font-family:var(--serif); font-size:clamp(34px,7vw,58px); font-weight:600; color:#fff; margin-top:12px; line-height:1.02; letter-spacing:-.03em; }
.p-sub{ font-size:15.5px; line-height:1.62; color:rgba(255,255,255,.76); margin-top:14px; max-width:46ch; margin-inline:auto; }
.p-meta{ display:flex; gap:7px; justify-content:center; flex-wrap:wrap; margin-top:18px; }
.p-note{ font-size:12.5px; color:rgba(255,255,255,.46); margin-top:14px; line-height:1.6; }

.btn-noche{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  margin-top:20px; padding:15px 34px; border-radius:999px; border:0; cursor:pointer;
  font-family:var(--sans); font-size:15px; font-weight:650; letter-spacing:.01em; color:#1a0f06;
  background:linear-gradient(135deg,#ffc46b,#ff8a5c 55%,#e5574d);
  box-shadow:0 14px 34px -12px rgba(255,140,90,.75);
  transition:.25s var(--ease);
}
.btn-noche:hover{ transform:translateY(-2px); box-shadow:0 20px 44px -14px rgba(255,140,90,.85); filter:brightness(1.05); }
.btn-noche:active{ transform:translateY(0) scale(.98); }
.btn-noche.mini{ margin-top:0; padding:13px 24px; font-size:14px; }
.escena .btn-noche{ width:100%; }

.esc-n{ font-size:11px; letter-spacing:.2em; color:rgba(255,255,255,.32); margin-bottom:12px; }
.esc-narr{ font-family:var(--serif); font-size:17.5px; line-height:1.62; color:rgba(255,255,255,.9); min-height:1.6em; }
.esc-cuerpo{ display:flex; flex-direction:column; gap:14px; margin-top:18px; }

.burbuja{
  padding:15px 18px; border-radius:18px 18px 18px 5px;
  background:linear-gradient(140deg, rgba(255,196,107,.16), rgba(229,87,77,.10));
  border:1px solid rgba(255,196,107,.24);
}
.b-quien{ font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--glow); font-weight:700; }
.b-dice{ font-size:17px; line-height:1.5; color:#fff; margin-top:7px; font-family:var(--serif); font-style:italic; }
.esc-reto{ font-size:14.5px; line-height:1.55; color:rgba(255,255,255,.74); }
/* Hervorhebung darf auf dunklem Grund nicht wie durchgestrichen wirken */
.escena .hl-word, .portada .hl-word{
  background:none; color:var(--glow); font-weight:650;
  border-bottom:1px solid rgba(255,160,100,.45); border-radius:0; padding:0;
}
.escena b, .portada b{ color:#fff !important; }

.opciones{ display:flex; flex-direction:column; gap:9px; }
.opcion{
  text-align:left; padding:14px 18px; border-radius:15px; cursor:pointer;
  background:rgba(255,255,255,.055); border:1px solid rgba(255,255,255,.12);
  color:#fff; font-family:var(--sans); font-size:15.5px; line-height:1.45; transition:.2s var(--ease);
}
.opcion:hover:not(:disabled){ background:rgba(255,255,255,.11); transform:translateX(4px); border-color:rgba(255,255,255,.24); }
.opcion:disabled{ cursor:default; }
.opcion.bien{ background:rgba(61,220,151,.16); border-color:rgba(61,220,151,.5); }
.opcion.mal{ background:rgba(255,107,107,.15); border-color:rgba(255,107,107,.5); }
.opcion.gris{ opacity:.34; }

.frase{
  font-family:var(--serif); font-size:19px; line-height:1.6; color:#fff;
  padding:16px 18px; border-radius:15px; background:rgba(0,0,0,.26); border:1px solid rgba(255,255,255,.09);
}
.hueco{
  display:inline-block; min-width:96px; text-align:center; padding:1px 10px; margin:0 3px;
  border-bottom:2px dashed rgba(255,255,255,.4); color:var(--glow); font-style:normal; font-weight:600;
  transition:.3s var(--ease);
}
.hueco.bien{ color:var(--ok); border-bottom-color:var(--ok); border-bottom-style:solid; }
.hueco.mal{ color:var(--no); border-bottom-color:var(--no); border-bottom-style:solid; }
.chips{ display:flex; flex-wrap:wrap; gap:8px; }
.chip-f{
  padding:11px 18px; border-radius:12px; cursor:pointer; font-size:15.5px;
  background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.16); color:#fff;
  font-family:var(--serif); transition:.18s var(--ease-back);
}
.chip-f:hover:not(:disabled){ background:rgba(255,255,255,.14); transform:translateY(-3px); }
.chip-f:disabled{ opacity:.4; cursor:default; }

.fila{ display:flex; gap:9px; flex-wrap:wrap; }
.campo{
  flex:1; min-width:200px; padding:14px 17px; border-radius:14px;
  background:rgba(0,0,0,.3); border:1px solid rgba(255,255,255,.17); color:#fff;
  font-family:var(--sans); font-size:16px; outline:none; transition:.2s var(--ease);
}
.campo:focus{ border-color:var(--glow); box-shadow:0 0 0 3px rgba(255,140,90,.22); }
.campo::placeholder{ color:rgba(255,255,255,.34); }
.pista{
  align-self:flex-start; background:none; border:0; cursor:pointer;
  color:rgba(255,255,255,.5); font-size:13px; font-family:var(--sans); text-decoration:underline dotted; padding:0;
}
.pista:hover{ color:#fff; }
.porque{ font-size:13.5px; line-height:1.6; color:rgba(255,255,255,.62); }

.reaccion{ padding:15px 17px; border-radius:15px; animation:subir .4s var(--ease) both; }
.reaccion.si{ background:rgba(61,220,151,.11); border:1px solid rgba(61,220,151,.28); }
.reaccion.no{ background:rgba(255,107,107,.10); border:1px solid rgba(255,107,107,.26); }
.r-t{ font-family:var(--serif); font-size:19px; color:#fff; }
.r-c{ font-size:15px; color:var(--ok); margin-top:6px; }
.r-x{ font-size:13.5px; line-height:1.62; color:rgba(255,255,255,.7); margin-top:8px; }

.radio{ padding:16px; border-radius:16px; background:rgba(0,0,0,.3); border:1px solid rgba(255,255,255,.12); }
.radio-n{ font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--glow); font-weight:700; margin-bottom:6px; }
.radio .player{ padding:0; }
.onda-scale{ display:flex; gap:7px; }
.onda-scale button{
  flex:1; padding:13px 4px; border-radius:13px; cursor:pointer; font-size:21px;
  background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); transition:.22s var(--ease-back);
}
.onda-scale button:hover{ transform:translateY(-3px); background:rgba(255,255,255,.12); }
.onda-scale button.on{
  background:linear-gradient(135deg,#ffc46b,#e5574d); border-color:transparent;
  transform:translateY(-3px) scale(1.06);
}

@media(max-width:640px){
  .layer.far{ height:36%; } .layer.near{ height:30%; } .layer.bal{ height:11%; }
  .noche-panel{ max-height:86vh; }
  .hud-hora{ font-size:24px; }
  .sol{ width:84px; height:84px; }
}
.escena.tecleando{ cursor:pointer; }
.escena.tecleando .esc-narr::after{
  content:"▌"; color:var(--glow); animation:cursorBlink .75s steps(2) infinite; margin-left:2px;
}
@keyframes cursorBlink{ 50%{ opacity:0 } }
/* Titel- und Schlussbild stehen mittig, damit die Sonne frei bleibt */
.noche-panel.centro{
  top:0; align-items:center; padding-bottom:clamp(16px,3vw,30px);
  max-height:none; pointer-events:none;
}
.noche-panel.centro > *{ pointer-events:auto; }
.noche-panel.centro .portada{ margin-top:6vh; }

/* ============================================================
   Bühne "L'enquête" – Haussmann-Wohnung, Regen, Messing
   ============================================================ */
.enquete{
  position:fixed; inset:0; overflow:hidden; z-index:5;
  --laiton:#c9a227; --laiton-clair:#e6c766; --papier:#efe9dc;
  --mur-h:#2b3546; --mur-b:#161c27;
  font-family:var(--sans);
  background:#0d1016;
}
.piece{ position:absolute; inset:0; }

/* Wand mit Stuck */
.mur{
  position:absolute; inset:0 0 22% 0;
  background:linear-gradient(175deg, var(--mur-h), var(--mur-b));
}
.mur::after{
  content:""; position:absolute; inset:0;
  background:
    radial-gradient(120% 80% at 78% 30%, rgba(150,180,220,.17), transparent 62%),
    linear-gradient(to bottom, transparent 55%, rgba(0,0,0,.30));
}
.moulure{
  position:absolute; border-radius:3px;
  border:2px solid rgba(255,255,255,.055);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 1px 0 rgba(0,0,0,.32);
}
.moulure.m1{ left:6%; top:18%; width:26%; height:52%; }
.moulure.m2{ left:36%; top:18%; width:22%; height:52%; }
.corniche{
  position:absolute; left:0; right:0; top:0; height:26px;
  background:linear-gradient(to bottom, rgba(255,255,255,.09), transparent);
  border-bottom:1px solid rgba(255,255,255,.07);
}
.plinthe{
  position:absolute; left:0; right:0; bottom:0; height:22px;
  background:linear-gradient(to top, rgba(0,0,0,.45), transparent);
  border-top:1px solid rgba(255,255,255,.05);
}

/* Fenster */
.fenetre{
  position:absolute; right:6%; top:9%; width:clamp(170px,20vw,255px); height:62%;
  border-radius:150px 150px 6px 6px; overflow:hidden;
  box-shadow:0 0 0 9px #1b222d, 0 0 0 12px rgba(255,255,255,.07), 0 30px 70px -20px rgba(0,0,0,.85);
}
.fenetre .vitre{ width:100%; height:100%; display:block; }
.fenetre .toits path{ fill:#2f3a4a; }
.fenetre .toits path:nth-child(2){ fill:none; stroke:#2f3a4a; stroke-width:5; }
.fenetre .lucarne{ fill:#e0c27a; opacity:.85; }
.croisillon{ position:absolute; background:#1b222d; }
.croisillon.v{ left:50%; top:0; bottom:0; width:7px; margin-left:-3.5px; }
.croisillon.hh{ left:0; right:0; top:52%; height:7px; }
.reflet{
  position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(118deg, rgba(255,255,255,.16) 0 18%, transparent 30% 100%);
}
.pluie{
  position:absolute; inset:-20%; pointer-events:none; opacity:.30;
  background-image:
    repeating-linear-gradient(99deg, rgba(226,238,255,.30) 0 1px, transparent 1px 13px),
    repeating-linear-gradient(103deg, rgba(226,238,255,.16) 0 1px, transparent 1px 27px);
  background-size:100% 180%, 100% 240%;
  animation:pleut 1.05s linear infinite, pleut2 1.7s linear infinite;
}
@keyframes pleut{ to{ background-position:-34px 180%, 0 0; } }
@keyframes pleut2{ to{ background-position:0 0, -52px 240%; } }
.fenetre::after{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(60% 40% at 30% 20%, rgba(255,255,255,.10), transparent 70%);
}
.lumiere{
  position:absolute; right:0; top:0; width:62%; height:78%; pointer-events:none;
  background:linear-gradient(255deg, rgba(160,195,235,.17), transparent 58%);
}

/* Boden */
.parquet{ position:absolute; left:0; right:0; bottom:0; height:22%; overflow:hidden; }
.parquet-svg{ width:100%; height:100%; display:block; }

/* Tür */
.porte{
  position:absolute; left:4%; bottom:20%; width:clamp(96px,11vw,138px); height:52%;
  background:linear-gradient(100deg,#241c17,#2e241c 55%,#1f1813);
  border:3px solid #15100c; border-radius:3px;
  box-shadow:inset 0 0 40px rgba(0,0,0,.6), 0 20px 50px -18px rgba(0,0,0,.9);
  transition:.9s cubic-bezier(.4,0,.2,1); transform-origin:left center;
}
.porte-p{
  position:absolute; left:14%; right:14%; top:8%; height:38%;
  border:2px solid rgba(255,255,255,.07); border-radius:2px;
  box-shadow:inset 0 2px 6px rgba(0,0,0,.5);
}
.porte-p.bas{ top:52%; height:38%; }
.poignee{
  position:absolute; right:9%; top:50%; width:12px; height:12px; margin-top:-6px;
  border-radius:50%; background:var(--laiton); box-shadow:0 0 10px rgba(201,162,39,.5);
}
.porte.prete{ box-shadow:inset 0 0 40px rgba(0,0,0,.6), 0 0 0 2px var(--laiton), 0 0 44px rgba(201,162,39,.42); }
.porte.prete .poignee{ animation:pulseP 1.8s ease-in-out infinite; }
@keyframes pulseP{ 50%{ box-shadow:0 0 22px rgba(230,199,102,.95); } }
.porte.ouverte{ transform:perspective(900px) rotateY(-72deg); }
.enquete.sortie .piece::after{
  content:""; position:absolute; left:0; bottom:20%; width:30%; height:52%;
  background:linear-gradient(90deg, rgba(255,238,190,.55), transparent 70%);
  animation:jour 1.4s ease forwards; pointer-events:none;
}
@keyframes jour{ from{opacity:0} to{opacity:1} }

/* Gegenstände */
.objet{
  position:absolute; transform:translate(-50%,-50%);
  background:none; border:0; cursor:pointer; padding:0;
  display:flex; flex-direction:column; align-items:center; gap:7px;
  font-family:var(--sans); transition:.28s var(--ease);
}
.objet:hover{ transform:translate(-50%,-50%) scale(1.07); }
.ob-cercle{
  width:58px; height:58px; border-radius:50%; display:grid; place-items:center;
  background:radial-gradient(circle at 34% 30%, #3a4557, #1d2531);
  border:1.5px solid var(--laiton); box-shadow:0 0 0 5px rgba(201,162,39,.10), 0 10px 26px -10px rgba(0,0,0,.85);
  animation:respire 3.4s ease-in-out infinite;
}
@keyframes respire{ 50%{ box-shadow:0 0 0 10px rgba(201,162,39,.05), 0 0 26px rgba(201,162,39,.36); } }
.ob-cercle svg{ width:28px; height:28px; fill:none; stroke:var(--laiton-clair); stroke-width:2.1; stroke-linecap:round; stroke-linejoin:round; }
.ob-nom{
  font-size:11px; letter-spacing:.07em; color:rgba(255,255,255,.72);
  background:rgba(10,14,20,.72); padding:3px 9px; border-radius:999px; white-space:nowrap;
  backdrop-filter:blur(6px);
}
.objet.fait .ob-cercle{ animation:none; border-color:rgba(255,255,255,.14); opacity:.42; }
.objet.fait .ob-cercle svg{ stroke:rgba(255,255,255,.4); }
.objet.fait{ cursor:default; }
.objet.fait:hover{ transform:translate(-50%,-50%); }

/* Kopfleiste */
.bandeau{
  position:absolute; top:0; left:0; right:0; z-index:6;
  display:flex; align-items:flex-start; justify-content:space-between;
  padding:70px clamp(14px,4vw,30px) 16px;
  pointer-events:none;              /* sonst fängt die Leiste Klicks auf Gegenstände ab */
}

<script>/* assets/js/core.js */
/* Sprachen - Kern: Registry, Zustand, Klang, Kleinkram.

      s.src = entry.file;

  var KEY = 'sprachen.v1';
  var blank = {
    xp: 0,
    streakDays: 0,
    lastDay: null,
    done: {},        // lessonId -> {at, score, total, minutes}
    progress: {},    // lessonId -> laufender Zwischenstand
    settings: { readSize: 18, sound: true }

  function read() {
    try {
      var raw = global.localStorage && localStorage.getItem(KEY);
      if (!raw) return JSON.parse(JSON.stringify(blank));

      for (var s in blank.settings) if (!(s in d.settings)) d.settings[s] = blank.settings[s];
