<script>/* assets/js/audio.js */
/* Sprachen - Folgen finden und abspielen.
   Statt auf eine Website zu verlinken, holt die App über die öffentliche
   iTunes-Lookup-Schnittstelle die Folgenliste eines Podcasts und spielt die
   Audiodatei direkt ab. Kein Abo, kein Login, keine Suche nach der Folge.

   Zwei Wege, weil einer immer klemmt:
     1. fetch()  - itunes.apple.com liefert CORS-Freigabe
     2. JSONP    - <script>-Tag, funktioniert auch über file:// ohne CORS
   Klappt beides nicht, gibt es einen ehrlichen Hinweis plus Direktlink. */
(function (L) {
  'use strict';
  var h = L.h;

  var cache = {};

  function endpoint(id, country) {
    return 'https://itunes.apple.com/lookup?id=' + encodeURIComponent(id) +
      '&country=' + encodeURIComponent(country || 'us') +
      '&media=podcast&entity=podcastEpisode&limit=40';
  }

  function viaFetch(url) {
    if (typeof fetch !== 'function') return Promise.reject(new Error('kein fetch'));
    return fetch(url, { mode: 'cors', credentials: 'omit' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  }

  function viaJsonp(url) {
    return new Promise(function (resolve, reject) {
      var name = '__lek_cb_' + Math.random().toString(36).slice(2);
      var s = document.createElement('script');
      var timer = setTimeout(function () { cleanup(); reject(new Error('Zeitüberschreitung')); }, 12000);
      function cleanup() {
        clearTimeout(timer);
        try { delete window[name]; } catch (e) { window[name] = undefined; }
        if (s.parentNode) s.parentNode.removeChild(s);
      }
      window[name] = function (data) { cleanup(); resolve(data); };
      s.onerror = function () { cleanup(); reject(new Error('Skript blockiert')); };
      s.src = url + '&callback=' + name;
      document.head.appendChild(s);
    });
  }

  /* Liefert { show, episodes:[{title, date, ms, url, page, desc}] } */
  L.podcast = function (id, country) {
    var key = id + '|' + (country || 'us');
    if (cache[key]) return cache[key];
    var url = endpoint(id, country);
    var pr = viaFetch(url)
      .catch(function () { return viaJsonp(url); })
      .then(function (data) {
        var res = (data && data.results) || [];
        var show = res.filter(function (r) { return r.wrapperType !== 'podcastEpisode'; })[0] || {};
        var eps = res.filter(function (r) { return r.wrapperType === 'podcastEpisode' && r.episodeUrl; })
          .map(function (r) {
            return {
              title: r.trackName || '',
              date: (r.releaseDate || '').slice(0, 10),
              ms: r.trackTimeMillis || 0,
              url: r.episodeUrl,
              page: r.trackViewUrl || '',
              desc: (r.shortDescription || r.description || '').replace(/<[^>]*>/g, '').trim()
            };
          })
          .sort(function (a, b) { return a.date < b.date ? 1 : -1; });
        if (!eps.length) throw new Error('keine Folgen gefunden');
        return { show: { name: show.collectionName || '', art: show.artworkUrl100 || '', page: show.collectionViewUrl || '' }, episodes: eps };
      });
    cache[key] = pr;
    pr.catch(function () { delete cache[key]; });
    return pr;
  };

  L.fmtLen = function (ms) {
    if (!ms) return '';
    var m = Math.round(ms / 60000);
    return m + ' min';
  };
  L.fmtDay = function (iso, lang) {
    if (!iso) return '';
    var loc = { es: 'es-ES', fr: 'fr-FR' }[lang] || 'de-CH';
    try {
      return new Date(iso + 'T12:00:00').toLocaleDateString(loc, { day: 'numeric', month: 'long' });
    } catch (e) { return iso; }
  };

  /* ---------------------------------------------------------------
     Spieler: sucht die passende Folge, zeigt Titel und Datum an,
     spielt direkt ab. Mit Umschalter auf ältere Folgen.
     --------------------------------------------------------------- */
  L.player = function (src, lang, onEpisode) {
    var box = h('div', { class: 'player' });
    var status = h('div', { class: 'player-status' }, [
      h('span', { class: 'spinner', 'aria-hidden': 'true' }),
      h('span', { text: L.t('a.searching') })
    ]);
    box.appendChild(status);

    var minM = src.minMinutes || 0;
    var maxM = src.maxMinutes || 9999;

    L.podcast(src.itunesId, src.country).then(function (data) {
      var fit = data.episodes.filter(function (e) {
        var m = e.ms / 60000;
        return !e.ms || (m >= minM && m <= maxM);
      });
      var list = (fit.length ? fit : data.episodes).slice(0, 12);
      render(list, data);
    }).catch(function (err) {
      status.remove();
      box.appendChild(fallback(src, err));
    });

    function render(list, data) {
      status.remove();
      var idx = 0;
      var audio = h('audio', { controls: 'controls', preload: 'none', class: 'player-audio' });
      var title = h('div', { class: 'ep-title' });
      var meta = h('div', { class: 'ep-meta' });

      function pick(i) {
        idx = i;
        var e = list[i];
        audio.src = e.url;
        title.textContent = e.title;
        meta.innerHTML = '';
        meta.appendChild(h('span', { class: 'tag', text: L.fmtDay(e.date, lang) }));
        if (e.ms) meta.appendChild(h('span', { class: 'tag', text: L.fmtLen(e.ms) }));
        meta.appendChild(h('a', { class: 'tag link', href: e.url, target: '_blank', rel: 'noopener',
          text: L.t('a.file') }));
        if (onEpisode) onEpisode(e);
      }

      box.appendChild(h('div', { class: 'ep-head' }, [
        h('div', { class: 'ep-live', text: L.t('a.found') }),
        title, meta
      ]));
      box.appendChild(audio);

      if (list.length > 1) {
        var more = h('details', { class: 'ep-more' });
        more.appendChild(h('summary', { text: L.t('a.other', { n: list.length - 1 }) }));
        var ul = h('div', { class: 'ep-list' });
        list.forEach(function (e, i) {
          var b = h('button', { class: 'ep-item', type: 'button' }, [
            h('span', { class: 'ep-item-t', text: e.title }),
            h('span', { class: 'ep-item-m', text: L.fmtDay(e.date, lang) + (e.ms ? ' · ' + L.fmtLen(e.ms) : '') })
          ]);
          b.addEventListener('click', function () {
            ul.querySelectorAll('.ep-item').forEach(function (o) { o.classList.remove('on'); });
            b.classList.add('on');
            pick(i);
            audio.play().catch(function () {});
            L.fx.tap();
          });
          ul.appendChild(b);
        });
        more.appendChild(ul);
        box.appendChild(more);
        ul.querySelectorAll('.ep-item')[0].classList.add('on');
      }
      pick(0);
    }

    function fallback(src, err) {
      var wrap = h('div', { class: 'player-fail' });
      wrap.appendChild(h('div', { class: 'pf-head' }, [
        h('span', { text: '⚠' }),
        h('span', { text: L.t('a.failTitle') })
      ]));
      wrap.appendChild(h('p', { class: 'muted', text: L.t('a.failText') }));
      var row = h('div', { class: 'row', style: 'margin-top:10px' });
      if (src.homepage) {
        row.appendChild(h('a', { class: 'btn btn-sm', href: src.homepage, target: '_blank', rel: 'noopener',
          text: L.t('a.website') + ' ↗' }));
      }
      row.appendChild(h('a', {
        class: 'btn btn-sm', target: '_blank', rel: 'noopener',
        href: 'https://podcasts.apple.com/podcast/id' + src.itunesId,
        text: 'Apple Podcasts ↗'
      }));
      wrap.appendChild(row);
      wrap.appendChild(h('p', { class: 'muted', style: 'margin-top:8px;font-size:11.5px',
        text: '(' + (err && err.message ? err.message : 'unbekannter Fehler') + ')' }));
      return wrap;
    }

    return box;
  };

})(window.LEKTION);
</script>
<script>/* assets/js/tasks.js */
/* Sprachen - Aufgabentypen.
   Jede Engine bekommt (task, ctx) und liefert ein Element.
   ctx.answered({correct, yours, right, explain, skipped}) meldet das Ergebnis zurück. */
(function (L) {
  'use strict';
  var h = L.h, esc = L.esc;
  var markup = function (s) { return L.markup(s); };
  var T = function (k, v) { return L.t(k, v); };
  L.engines = {};

  function verdict(good, title, bodyHtml) {
    return h('div', { class: 'verdict ' + (good ? 'good' : 'bad') }, [
      h('div', { class: 'ic', text: good ? '✓' : '✕' }),
      h('div', {}, [
        h('div', { class: 't', text: title }),
        h('p', { html: bodyHtml || '' })
      ])
    ]);
  }
  L.verdictBox = verdict;

  function lockButtons(root) {
    root.querySelectorAll('button').forEach(function (b) { b.disabled = true; });
  }

  /* Akzent-Schnelltasten unter Eingabefeldern */
  function accentBar(lang, field) {
    var sets = {
      es: ['á', 'é', 'í', 'ó', 'ú', 'ñ', 'ü', '¿', '¡'],
      fr: ['é', 'è', 'ê', 'à', 'â', 'ç', 'î', 'ô', 'û', 'ë']
    };
    var bar = h('div', { class: 'accents' });
    (sets[lang] || []).forEach(function (ch) {
      bar.appendChild(h('button', {
        class: 'acc', type: 'button', text: ch, tabindex: '-1',
        onclick: function (e) {
          e.preventDefault();
          var s = field.selectionStart, en = field.selectionEnd;
          field.value = field.value.slice(0, s) + ch + field.value.slice(en);
          field.focus();
          field.selectionStart = field.selectionEnd = s + ch.length;
          L.fx.tap();
        }
      }));
    });
    return bar;
  }

  /* =============== 1. Blitz: Auswahl mit Begründung =============== */
  L.engines.choice = function (task, ctx) {
    var root = h('div', { class: 'stack' });
    var opts = h('div', { class: 'opts' });
    var keys = 'ABCD';
    var order = task.keepOrder ? task.options.map(function (_, i) { return i; })
                               : L.shuffle(task.options.map(function (_, i) { return i; }));

    order.forEach(function (idx, pos) {
      var o = task.options[idx];
      var label = typeof o === 'string' ? o : o.text;
      var btn = h('button', { class: 'opt', type: 'button' }, [
        h('span', { class: 'key', text: keys[pos] || '·' }),
        h('span', { html: esc(label) })
      ]);
      btn.addEventListener('click', function () {
        var right = (idx === task.answer);
        lockButtons(root);
        opts.querySelectorAll('.opt').forEach(function (b, i) {
          var oi = order[i];
          if (oi === task.answer) b.classList.add('right');
          else if (b === btn) b.classList.add('wrong');
          else b.classList.add('faded');
        });
        var chosen = task.options[idx];
        var why = (typeof chosen === 'object' && chosen.why) ? chosen.why : '';
        var body = (right ? '' : '<b>' + T('v.shouldBe') + '</b> ' + esc(labelOf(task.options[task.answer])) + '<br>')
          + markup(why || task.explain || '');
        if (why && task.explain) body += '<br><span class="muted">' + markup(task.explain) + '</span>';
        root.appendChild(verdict(right, right ? (task.praise || T('v.hit')) : T('v.miss'), body));
        ctx.answered({
          correct: right,
          yours: labelOf(chosen),
          right: labelOf(task.options[task.answer]),
          explain: why || task.explain || ''
        });
      });
      opts.appendChild(btn);
    });
    function labelOf(o) { return typeof o === 'string' ? o : o.text; }
    root.appendChild(opts);
    return root;
  };

  /* =============== 2. Textdetektiv: Aussage prüfen + Beleg klicken =============== */
  L.engines.evidence = function (task, ctx) {
    var root = h('div', { class: 'stack' });
    var choices = [
      { id: 'richtig', label: T('v.yes') },
      { id: 'falsch', label: T('v.no') },
      { id: 'unklar', label: T('v.unclear') }
    ];
    var opts = h('div', { class: 'opts' });
    choices.forEach(function (c, i) {
      var b = h('button', { class: 'opt', type: 'button' }, [
        h('span', { class: 'key', text: ['✓', '✕', '?'][i] }),
        h('span', { text: c.label })
      ]);
      b.addEventListener('click', function () { pick(c.id, b); });
      opts.appendChild(b);
    });
    root.appendChild(opts);

    function pick(id, btn) {
      var right = (id === task.verdict);
      lockButtons(root);
      opts.querySelectorAll('.opt').forEach(function (b, i) {
        if (choices[i].id === task.verdict) b.classList.add('right');
        else if (b === btn) b.classList.add('wrong');
        else b.classList.add('faded');
      });
      if (task.verdict !== 'unklar' && task.evidence && ctx.sentences) {
        root.appendChild(evidenceStep(right));
      } else {
        root.appendChild(verdict(right, right ? T('v.sharpEye') : T('v.notQuite'), markup(task.explain || '')));
        ctx.answered({ correct: right, yours: labelFor(id), right: labelFor(task.verdict), explain: task.explain || '' });
      }
    }
    function labelFor(id) {
      for (var i = 0; i < choices.length; i++) if (choices[i].id === id) return choices[i].label;
      return id;
    }

    function evidenceStep(verdictWasRight) {
      var box = h('div', { class: 'stack' });
      box.appendChild(h('p', { class: 'muted', text: T('v.proveIt') }));
      var ev = h('div', { class: 'evidence' });
      var found = false;
      ctx.sentences.forEach(function (s) {
        var isIt = !found && task.evidence && s.text.indexOf(task.evidence) !== -1;
        if (isIt) found = true;
        var span = h('span', { class: 'sent', text: s.text + ' ' });
        span.addEventListener('click', function () {
          if (ev.dataset.locked) return;
          ev.dataset.locked = '1';
          span.classList.add(isIt ? 'picked-right' : 'picked-wrong');
          if (!isIt) {
            ev.querySelectorAll('.sent').forEach(function (o, i) {
              if (ctx.sentences[i].text.indexOf(task.evidence) !== -1) o.classList.add('picked-right');
            });
          }
          isIt ? L.fx.right(0) : L.fx.wrong();
          var all = verdictWasRight && isIt;
          box.appendChild(verdict(all,
            all ? T('v.bothRight') : (verdictWasRight ? T('v.halfRight') : T('v.notQuite')),
            markup(task.explain || '')));
          ctx.answered({
            correct: all,
            yours: labelFor(task.verdict === 'unklar' ? 'unklar' : (verdictWasRight ? task.verdict : 'x')) + (isIt ? ' + richtiger Beleg' : ' + falscher Beleg'),
            right: labelFor(task.verdict) + ' (Beleg: "' + task.evidence + '")',
            explain: task.explain || ''
          });
        });
        ev.appendChild(span);
      });
      box.appendChild(ev);
      return box;
    }
    return root;
  };

  /* =============== 3. Satzschmiede: Wortfolge bauen =============== */
  L.engines.forge = function (task, ctx) {
    var root = h('div', { class: 'forge' });
    var target = task.solution.split(/\s+/);
    var bankWords = L.shuffle(target.concat(task.distractors || []));
    var slot = h('div', { class: 'slot' });
    var bank = h('div', { class: 'bank' });
    var picked = [];

    function refresh() {
      slot.innerHTML = '';
      slot.classList.toggle('filled', picked.length > 0);
      picked.forEach(function (p, i) {
        var w = h('button', { class: 'word in-slot', type: 'button', text: p.word });
        w.addEventListener('click', function () {
          if (root.dataset.locked) return;
          picked.splice(i, 1);
          p.el.classList.remove('used');
          L.fx.tap(); refresh();
        });
        slot.appendChild(w);
      });
      check.disabled = picked.length === 0 || !!root.dataset.locked;
    }

    bankWords.forEach(function (w) {
      var el = h('button', { class: 'word', type: 'button', text: w });
      el.addEventListener('click', function () {
        if (root.dataset.locked || el.classList.contains('used')) return;
        el.classList.add('used');
        picked.push({ word: w, el: el });
        L.fx.tap(); refresh();
      });
      bank.appendChild(el);
    });

    var check = h('button', { class: 'btn btn-primary', type: 'button', text: T('f.check'), disabled: true });
    check.addEventListener('click', function () {
      var mine = picked.map(function (p) { return p.word; }).join(' ');
      var res = L.matches(mine, [task.solution].concat(task.alsoAccept || []));
      root.dataset.locked = '1';
      slot.classList.add(res.ok ? 'ok' : 'no');
      bank.querySelectorAll('.word').forEach(function (b) { b.disabled = true; });
      check.remove();
      var body = res.ok
        ? markup(task.explain || '')
        : '<b>' + T('f.correct') + '</b> ' + esc(task.solution) + '<br>' + markup(task.explain || '');
      root.appendChild(verdict(res.ok, res.ok ? T('f.built') : T('f.order'), body));
      ctx.answered({ correct: res.ok, yours: mine, right: task.solution, explain: task.explain || '' });
    });

    root.appendChild(h('p', { class: 'muted', text: T('f.hint') }));
    root.appendChild(slot);
    root.appendChild(bank);
    root.appendChild(h('div', { class: 'row' }, [check]));
    refresh();
    return root;
  };

  /* =============== 4. Verwandler: umformen und tippen =============== */
  L.engines.transform = function (task, ctx) {
    var root = h('div', { class: 'stack' });
    if (task.source) {
      root.appendChild(h('div', { class: 'ex-line' }, [h('div', { class: 'src', html: esc(task.source) })]));
    }
    var field = h('input', { class: 'field', type: 'text', placeholder: task.placeholder || T('t.placeholder'), autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false' });
    var check = h('button', { class: 'btn btn-primary', type: 'button', text: T('f.check') });
    var row = h('div', { class: 'type-row' }, [field, check]);
    root.appendChild(row);
    root.appendChild(accentBar(ctx.lang, field));

    var hintBtn = null;
    if (task.hint) {
      hintBtn = h('button', { class: 'btn btn-ghost btn-sm', type: 'button', text: T('t.nudge') });
      hintBtn.addEventListener('click', function () {
        hintBtn.replaceWith(h('p', { class: 'muted', html: '💡 ' + esc(task.hint) }));
      });
      root.appendChild(h('div', { class: 'row' }, [hintBtn]));
    }

    function submit() {
      var mine = field.value.trim();
      if (!mine) { field.focus(); return; }
      var accepted = [].concat(task.answer);
      var res = L.matches(mine, accepted);
      field.disabled = true; check.disabled = true;
      if (hintBtn && hintBtn.parentNode) hintBtn.disabled = true;

      var body = '';
      if (res.ok && !res.exact) {
        body = T('t.accents') + ' <b>' + esc(res.target) + '</b><br>';
      } else if (!res.ok) {
        var d = L.diff(mine, accepted[0]);
        var html = d.map(function (p) {
          return '<span class="' + p[0] + '">' + esc(p[1]) + '</span>';
        }).join('');
        body = '<div class="diff" style="margin-bottom:8px">' + html + '</div>';
      }
      body += markup(task.explain || '');
      if (accepted.length > 1 && res.ok) {
        body += '<br><span class="muted">' + T('t.also') + ' ' + esc(accepted.slice(1).join(' · ')) + '</span>';
      }
      root.appendChild(verdict(res.ok, res.ok ? (res.exact ? T('t.exact') : T('t.almost')) : T('t.look'), body));
      ctx.answered({
        correct: res.ok,
        exact: res.exact,
        yours: mine,
        right: accepted[0],
        explain: task.explain || ''
      });
    }
    check.addEventListener('click', submit);
    field.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
    setTimeout(function () { field.focus(); }, 120);
    return root;
  };

  /* =============== 5. Paarjagd: zusammenbringen =============== */
  L.engines.pairs = function (task, ctx) {
    var root = h('div', { class: 'stack' });
    var left = L.shuffle(task.pairs.map(function (p, i) { return { i: i, t: p[0] }; }));
    var right = L.shuffle(task.pairs.map(function (p, i) { return { i: i, t: p[1] }; }));
    var sel = null, hits = 0, misses = 0;
    var colA = h('div', { class: 'pcol' }), colB = h('div', { class: 'pcol' });

    function make(item, side, col) {
      var b = h('button', { class: 'pitem', type: 'button', text: item.t });
      b.addEventListener('click', function () {
        if (b.classList.contains('matched')) return;
        if (!sel) {
          sel = { item: item, side: side, el: b };
          b.classList.add('sel'); L.fx.tap();
          return;
        }
        if (sel.el === b) { b.classList.remove('sel'); sel = null; return; }
        if (sel.side === side) { sel.el.classList.remove('sel'); sel = { item: item, side: side, el: b }; b.classList.add('sel'); return; }
        if (sel.item.i === item.i) {
          sel.el.classList.remove('sel');
          sel.el.classList.add('matched'); b.classList.add('matched');
          hits++; L.fx.right(hits); L.sparks(b, 8);
          sel = null;
          if (hits === task.pairs.length) finish();
        } else {
          var a = sel.el;
          a.classList.remove('sel'); a.classList.add('shake'); b.classList.add('shake');
          misses++; L.fx.wrong();
          setTimeout(function () { a.classList.remove('shake'); b.classList.remove('shake'); }, 420);
          sel = null;
        }
      });
      col.appendChild(b);
    }
    left.forEach(function (it) { make(it, 'a', colA); });
    right.forEach(function (it) { make(it, 'b', colB); });

    function finish() {
      var clean = misses === 0;
      var body = clean ? markup(task.explain || '')
        : T('p.tries', { n: misses }) + ' ' + markup(task.explain || '');
      root.appendChild(verdict(clean, clean ? T('p.clean') : T('p.done'), body));
      ctx.answered({
        correct: clean,
        partial: Math.max(0, 1 - misses / (task.pairs.length * 1.5)),
        yours: misses + ' Fehlversuche',
        right: task.pairs.length + ' Paare',
        explain: task.explain || ''
      });
    }

    root.appendChild(h('p', { class: 'muted', text: T('p.hint') }));
    root.appendChild(h('div', { class: 'pairs' }, [colA, colB]));
    return root;
  };

  /* =============== 6. Freischreiben: produzieren, dann vergleichen =============== */
  L.engines.write = function (task, ctx) {
    var root = h('div', { class: 'stack' });
    var field = h('textarea', { class: 'field', placeholder: task.placeholder || T('w.placeholder') });
    root.appendChild(field);
    root.appendChild(accentBar(ctx.lang, field));

    if (task.mustUse && task.mustUse.length) {
      var chips = h('div', { class: 'row', style: 'margin-top:4px' });
      chips.appendChild(h('span', { class: 'muted', text: T('w.use') }));
      task.mustUse.forEach(function (w) { chips.appendChild(h('span', { class: 'tag ghost', text: w, 'data-w': w })); });
      root.appendChild(chips);
      field.addEventListener('input', function () {
        var v = L.norm(field.value);
        chips.querySelectorAll('.tag').forEach(function (t) {
          var got = v.indexOf(L.norm(t.getAttribute('data-w'))) !== -1;
          t.classList.toggle('ghost', !got);
          t.classList.toggle('hot', got);
        });
      });
    }

    var go = h('button', { class: 'btn btn-primary', type: 'button', text: T('w.go') });
    root.appendChild(h('div', { class: 'row' }, [go]));

    go.addEventListener('click', function () {
      var mine = field.value.trim();
      var words = mine ? mine.split(/\s+/).length : 0;
      field.disabled = true; go.remove();
      var used = (task.mustUse || []).filter(function (w) { return L.norm(mine).indexOf(L.norm(w)) !== -1; });
      var enough = words >= (task.minWords || 15);

      var panel = h('div', { class: 'stack' });
      panel.appendChild(h('div', { class: 'card' }, [
        h('div', { class: 'task-kind', text: T('w.model') }),
        h('p', { style: 'margin-top:8px;color:var(--ink);font-size:15.5px;line-height:1.7', html: markup(task.model).replace(/\n/g, '<br>') })
      ]));

      if (task.checklist && task.checklist.length) {
        var list = h('div', { class: 'stack', style: 'gap:8px' });
        list.appendChild(h('h3', { text: T('w.compare') }));
        var ticked = 0;
        task.checklist.forEach(function (c) {
          var b = h('button', { class: 'opt', type: 'button' }, [
            h('span', { class: 'key', text: '○' }),
            h('span', { text: c })
          ]);
          b.addEventListener('click', function () {
            var on = b.classList.toggle('right');
            b.querySelector('.key').textContent = on ? '✓' : '○';
            ticked += on ? 1 : -1;
            L.fx.tap();
          });
          list.appendChild(b);
        });
        panel.appendChild(h('div', { class: 'card' }, [list]));
      }
      root.appendChild(panel);

      var note = [];
      note.push(T('w.words', { n: words }));
      if ((task.mustUse || []).length) note.push(T('w.hit', { a: used.length, b: task.mustUse.length }));
      L.fx.done();
      ctx.answered({
        correct: enough && used.length >= Math.ceil(((task.mustUse || []).length) * 0.6),
        freeform: true,
        yours: mine,
        right: task.model,
        explain: note.join(' · ')
      });
    });
    return root;
  };

})(window.LEKTION);
</script>
<script>/* assets/js/stage.js */
/* Sprachen - Bühne.
   Manche Einheiten sind keine sechs Stationen, sondern ein eigenes Stück:
   ein Simulator, ein Escape Room. Sie bringen ihre eigene Darstellung mit,
   liefern aber dieselben Daten zurück wie eine normale Einheit, damit
   Diagnose, Bericht und Lernstand unverändert weiterlaufen. */
(function (L) {
  'use strict';
  var h = L.h;

  L.stages = {};

  /* Ein Ergebnis in die laufende Sitzung schreiben – gleiche Form wie bei
     den normalen Aufgaben, damit L.skillScores und der Bericht es verstehen. */
  L.stageAnswer = function (res) {
    var S = L.session;
    S.results = S.results || [];
    S.results.push({
      type: res.type || 'stage',
      prompt: res.prompt || '',
      correct: !!res.correct,
      yours: res.yours || '',
      right: res.right || '',
      explain: res.explain || '',
      skill: res.skill || 'erkennen',
      grammar: res.grammar || null,
      freeform: !!res.freeform
    });
    if (res.correct) {
      S.streak = (S.streak || 0) + 1;
      L.addXp(12 + Math.min(S.streak, 6) * 3);
    } else {
      S.streak = 0;
    }
    L.persistProgress();
  };

  L.stageDone = function (lesson) {
    L.persistProgress();
    L.go('#/lektion/' + lesson.id + '/wrap');
  };

  /* Farbverlauf zwischen Stützstellen – für Himmel, Licht, Stimmung. */
  L.mixHex = function (a, b, t) {
    var pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
    var r = Math.round((pa >> 16) + ((pb >> 16) - (pa >> 16)) * t);
    var g = Math.round(((pa >> 8) & 255) + (((pb >> 8) & 255) - ((pa >> 8) & 255)) * t);
    var bl = Math.round((pa & 255) + ((pb & 255) - (pa & 255)) * t);
    return '#' + ((1 << 24) + (r << 16) + (g << 8) + bl).toString(16).slice(1);
  };
  L.ramp = function (stops, t) {
    t = Math.max(0, Math.min(1, t));
    var n = stops.length - 1;
    var i = Math.min(Math.floor(t * n), n - 1);
    return L.mixHex(stops[i], stops[i + 1], t * n - i);
  };

  /* ---------------- Klang für die Bühnen ----------------
     Alles synthetisiert: keine Dateien, funktioniert offline. */
  /* Klang ist Beiwerk: ein Audiofehler darf niemals eine Aufgabe blockieren. */
  function safe(fn) {
    return function () {
      try { return fn.apply(null, arguments); }
      catch (e) { if (window.console) console.warn('Klang aus:', e.message); }
    };
  }

  function ac() {
    if (!L.state.settings.sound) return null;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    if (!L._ac) L._ac = new AC();
    if (L._ac.state === 'suspended') L._ac.resume();
    return L._ac;
  }

  /* Karplus-Strong: eine gezupfte Nylonsaite aus Rauschen und Verzögerung. */
  L.pluck = safe(function (freq, dur, vol) {
    var c = ac(); if (!c) return;
    var sr = c.sampleRate, n = Math.floor(sr * (dur || 1.1));
    var N = Math.round(sr / freq);
    var buf = c.createBuffer(1, n, sr), d = buf.getChannelData(0);
    var ring = new Float32Array(N);
    for (var i = 0; i < N; i++) ring[i] = Math.random() * 2 - 1;
    var p = 0, last = 0;
    for (var j = 0; j < n; j++) {
      var cur = ring[p];
      var out = (cur + last) * 0.498;      // leichte Dämpfung = weicher Nylonklang
      ring[p] = out; last = cur;
      p = (p + 1) % N;
      d[j] = out * Math.exp(-2.2 * j / n);
    }
    var s = c.createBufferSource(); s.buffer = buf;
    var g = c.createGain(); g.gain.value = vol || 0.22;
    var f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 3200;
    s.connect(f); f.connect(g); g.connect(c.destination);
    s.start();
  });

  /* Palmas: trockenes Händeklatschen aus gefiltertem Rauschen. */
  L.clap = safe(function (times, vol) {
    var c = ac(); if (!c) return;
    (times || [0]).forEach(function (t) {
      var n = Math.floor(c.sampleRate * 0.06);
      var buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
      for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
      var s = c.createBufferSource(); s.buffer = buf;
      var f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1600; f.Q.value = 1.1;
      var g = c.createGain(); g.gain.value = vol || 0.16;
      s.connect(f); f.connect(g); g.connect(c.destination);
      s.start(c.currentTime + t);
    });
  });

  /* Akkordeon: zwei leicht verstimmte Sägezähne mit Vibrato. */
  L.accordion = safe(function (freqs, dur, vol) {
    var c = ac(); if (!c) return;
    var t0 = c.currentTime, d = dur || 1.4;
    var master = c.createGain();
    master.gain.setValueAtTime(0, t0);
    master.gain.linearRampToValueAtTime(vol || 0.07, t0 + 0.12);
    master.gain.setValueAtTime(vol || 0.07, t0 + d - 0.25);
    master.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    var lfo = c.createOscillator(), lg = c.createGain();
    lfo.frequency.value = 5.2; lg.gain.value = 3.4;
    lfo.connect(lg); lfo.start(t0); lfo.stop(t0 + d);
    (freqs || [220]).forEach(function (f) {
      [-3.5, 3.5].forEach(function (det) {
        var o = c.createOscillator();
        o.type = 'sawtooth';
        o.frequency.value = f;
        o.detune.value = det;
        lg.connect(o.detune);
        var fil = c.createBiquadFilter();
        fil.type = 'lowpass'; fil.frequency.value = 2000;
        o.connect(fil); fil.connect(master);
        o.start(t0); o.stop(t0 + d);
      });
    });
    master.connect(c.destination);
  });

  /* Schloss, Klicken, Ticken. */
  L.thunk = safe(function (kind) {
    var c = ac(); if (!c) return;
    var t0 = c.currentTime;
    var n = Math.floor(c.sampleRate * 0.09);
    var buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 6);
    var s = c.createBufferSource(); s.buffer = buf;
    var f = c.createBiquadFilter();
    f.type = 'bandpass';
    f.frequency.value = kind === 'tick' ? 4200 : kind === 'open' ? 900 : 300;
    f.Q.value = 2.4;
    var g = c.createGain(); g.gain.value = kind === 'tick' ? 0.05 : 0.2;
    s.connect(f); f.connect(g); g.connect(c.destination);
    s.start(t0);
    if (kind !== 'tick') {
      var o = c.createOscillator(), og = c.createGain();
      o.frequency.setValueAtTime(kind === 'open' ? 180 : 90, t0);
      o.frequency.exponentialRampToValueAtTime(kind === 'open' ? 90 : 45, t0 + 0.2);
      og.gain.setValueAtTime(0.14, t0);
      og.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.25);
      o.connect(og); og.connect(c.destination);
      o.start(t0); o.stop(t0 + 0.26);
    }
  });

  /* Spickzettel: die Grammatik der Einheit, jederzeit aufklappbar.
     Ohne das müsste man raten – eine Bühne ersetzt die Erklärung nicht. */
  L.chuleta = function (lesson, label) {
    var fond = h('div', { class: 'chuleta-fond' });
    var btn = h('button', { class: 'chuleta-btn', type: 'button' }, [
      h('span', { text: '✦' }), h('span', { text: label || 'la regla' })
    ]);
    btn.addEventListener('click', function () {
      if (!fond.childNodes.length) {
        var card = h('div', { class: 'chuleta' });
        card.appendChild(h('button', { class: 'ch-x', type: 'button', text: '✕',
          onclick: function () { fond.classList.remove('ouvert'); } }));
        (lesson.intro.grammar || []).forEach(function (g) {
          card.appendChild(h('div', { class: 'ch-k', text: g.name }));
          if (g.explain) card.appendChild(h('div', { class: 'prose ch-x2', html: L.rich(g.explain, 14.5) }));
          if (g.table && g.table.rows) {
            var t = h('table', { class: 'gtable' });
            if (g.table.head) {
              var tr = h('tr');
              g.table.head.forEach(function (c) { tr.appendChild(h('th', { text: c })); });
              t.appendChild(h('thead', {}, [tr]));
            }
            var tb = h('tbody');
            g.table.rows.forEach(function (r) {
              var tr2 = h('tr');
              r.forEach(function (c) { tr2.appendChild(h('td', { html: L.markup(c) })); });
              tb.appendChild(tr2);
            });
            t.appendChild(tb);
            card.appendChild(h('div', { class: 'scroll-x' }, [t]));
          }
          (g.examples || []).forEach(function (ex) {
            card.appendChild(h('div', { class: 'ch-ex' }, [
              h('div', { class: 'ch-s', html: L.markup(ex.src) }),
              ex.note ? h('div', { class: 'ch-n', html: L.markup(ex.note) }) : null
            ]));
          });
          (g.pitfalls || []).forEach(function (pf) {
            card.appendChild(h('div', { class: 'ch-p', html: '⚠ ' + L.markup(pf) }));
          });
        });
        if ((lesson.intro.vocab || []).length) {
          card.appendChild(h('div', { class: 'ch-k', style: 'margin-top:18px', text: lesson.vocabTitle || '·' }));
          var vg = h('div', { class: 'ch-voc' });
          lesson.intro.vocab.forEach(function (v) {
            vg.appendChild(h('div', { class: 'ch-v' }, [
              h('b', { text: v.term }),
              h('span', { html: L.markup(v.def) })
            ]));
          });
          card.appendChild(vg);
        }
        fond.appendChild(card);
        fond.addEventListener('click', function (ev) {
          if (ev.target === fond) fond.classList.remove('ouvert');
        });
      }
      fond.classList.add('ouvert');
    });
    return { btn: btn, fond: fond };
  };

  /* Kleine Helfer, die beide Bühnen brauchen */
  L.typeOut = function (el, text, speed, done) {
    el.textContent = '';
    var fertig = false;
    function ende() { if (fertig) return; fertig = true; el.textContent = text; if (done) done(); }
    if (window.matchMedia('(prefers-reduced-motion:reduce)').matches) {
      ende(); return { stop: ende };
    }
    var i = 0, stopped = false;
    (function step() {
      if (stopped || fertig) return;
      el.textContent = text.slice(0, ++i);
      if (i < text.length) setTimeout(step, speed || 18);
      else ende();
    })();
    return { stop: function () { stopped = true; ende(); } };
  };

  L.accentRow = function (lang, field) {
    var sets = { es: ['á', 'é', 'í', 'ó', 'ú', 'ñ'], fr: ['é', 'è', 'ê', 'à', 'ç', 'û'] };
    var bar = h('div', { class: 'accents' });
    (sets[lang] || []).forEach(function (ch) {
      bar.appendChild(h('button', { class: 'acc', type: 'button', text: ch, tabindex: '-1',
        onclick: function (e) {
          e.preventDefault();
          var s = field.selectionStart, en = field.selectionEnd;
          field.value = field.value.slice(0, s) + ch + field.value.slice(en);
          field.focus(); field.selectionStart = field.selectionEnd = s + ch.length;
        } }));
    });
    return bar;
  };

})(window.LEKTION);
</script>
<script>/* assets/js/stage-noche.js */
/* Bühne "La noche" – ein Abend in Madrid, Stunde für Stunde.
   Der Himmel wandert mit der Uhrzeit, die Fenster gehen an, und man muss
   den Leuten das Richtige sagen. Alles CSS und SVG, kein einziges Bild. */
(function (L) {
  'use strict';
  var h = L.h, esc = L.esc;

  var SKY = {
    top: ['#4a5fa8', '#2a2a5c', '#141a3a', '#080a16'],
    mid: ['#e8814a', '#7a4a72', '#2a2450', '#0e1228'],
    low: ['#ffc46b', '#d9694f', '#4a3355', '#171a32']
  };

  function skylineFar() {
    return '<svg class="sky-far" viewBox="0 0 1200 240" preserveAspectRatio="none" aria-hidden="true">' +
      '<path d="M0,240 L0,168 L48,168 L48,150 L74,150 L74,168 L128,168 L128,120 L142,120 L142,104 ' +
      'L156,104 L156,120 L170,120 L170,168 L232,168 L232,140 L300,140 L300,158 L352,158 L352,112 ' +
      'L366,112 L366,92 L380,92 L380,112 L394,112 L394,158 L452,158 L452,176 L520,176 L520,132 ' +
      'L548,132 Q562,96 576,132 L604,132 L604,176 L668,176 L668,146 L736,146 L736,164 L790,164 ' +
      'L790,118 L804,118 L804,98 L818,98 L818,118 L832,118 L832,164 L900,164 L900,180 L968,180 ' +
      'L968,138 L1036,138 L1036,160 L1104,160 L1104,150 L1140,150 L1140,168 L1200,168 L1200,240 Z"/>' +
      '</svg>';
  }

  function skylineNear() {
    var win = '';
    for (var r = 0; r < 3; r++) {
      for (var c = 0; c < 26; c++) {
        var x = 40 + c * 44, y = 96 + r * 40;
        win += '<rect class="win" data-i="' + (r * 26 + c) + '" x="' + x + '" y="' + y + '" width="17" height="23" rx="2"/>';
      }
    }
    return '<svg class="sky-near" viewBox="0 0 1200 260" preserveAspectRatio="none" aria-hidden="true">' +
      '<path d="M0,260 L0,84 L200,84 L200,64 L214,64 L214,84 L470,84 L470,58 L484,58 L484,84 ' +
      'L760,84 L760,70 L774,70 L774,84 L1010,84 L1010,62 L1024,62 L1024,84 L1200,84 L1200,260 Z"/>' +
      '<g class="antennas">' +
      '<path d="M300,84 L300,44 M292,54 L308,54 M294,64 L306,64"/>' +
      '<path d="M880,84 L880,38 M872,48 L888,48"/>' +
      '<circle cx="600" cy="66" r="13" class="dish"/><path d="M600,79 L600,84"/>' +
      '</g>' +
      '<g class="tendedero"><path d="M120,92 Q300,116 480,92"/>' +
      '<rect x="196" y="104" width="20" height="26" rx="2"/>' +
      '<rect x="248" y="108" width="26" height="20" rx="2"/>' +
      '<rect x="320" y="110" width="18" height="28" rx="2"/>' +
      '<rect x="388" y="106" width="24" height="22" rx="2"/></g>' +
      '<g class="wins">' + win + '</g>' +
      '</svg>';
  }

  function balcony() {
    var bars = '';
    for (var i = 0; i < 44; i++) bars += '<path d="M' + (18 + i * 27) + ',0 L' + (18 + i * 27) + ',96"/>';
    return '<svg class="balcon" viewBox="0 0 1200 120" preserveAspectRatio="none" aria-hidden="true">' +
      '<g class="rail">' + bars +
      '<path d="M0,8 L1200,8"/><path d="M0,52 L1200,52"/><path d="M0,96 L1200,96"/></g>' +
      '<g class="maceta"><path d="M980,96 L980,58 L1052,58 L1046,96 Z"/>' +
      '<path d="M990,58 q6,-34 26,-30 q-4,20 -26,30 Z"/>' +
      '<path d="M1020,58 q-2,-30 22,-26 q0,20 -22,26 Z"/></g>' +
      '</svg>';
  }

  L.stages.noche = function (lesson) {
    var S = L.session;
    S.stage = S.stage || { i: 0, onda: 3 };
    var escenas = lesson.escenas || [];

    var root = h('div', { class: 'noche' });
    var sky = h('div', { class: 'noche-sky' });
    var sun = h('div', { class: 'astro sol' });
    var moon = h('div', { class: 'astro luna' });
    var stars = h('div', { class: 'stars' });
    for (var s = 0; s < 60; s++) {
      stars.appendChild(h('i', {
        style: 'left:' + (Math.random() * 100).toFixed(2) + '%;top:' + (Math.random() * 62).toFixed(2) +
          '%;animation-delay:' + (Math.random() * 4).toFixed(2) + 's;--s:' + (Math.random() * 0.6 + 0.5).toFixed(2)
      }));
    }
    var far = h('div', { class: 'layer far', html: skylineFar() });
    var near = h('div', { class: 'layer near', html: skylineNear() });
    var bal = h('div', { class: 'layer bal', html: balcony() });
    sky.appendChild(stars); sky.appendChild(sun); sky.appendChild(moon);
    root.appendChild(sky); root.appendChild(far); root.appendChild(near); root.appendChild(bal);
    root.appendChild(h('div', { class: 'noche-vig' }));

    /* Kopfleiste: Uhrzeit, Ort, Stimmung */
    var hud = h('div', { class: 'hud' });
    var hHora = h('div', { class: 'hud-hora' });
    var hLugar = h('div', { class: 'hud-lugar' });
    var hOnda = h('div', { class: 'onda' });
    hud.appendChild(h('div', {}, [hHora, hLugar]));
    var ch = L.chuleta(lesson, lesson.chuletaLabel || 'la regla');
    hud.appendChild(h('div', { class: 'hud-d' }, [hOnda, ch.btn]));
    root.appendChild(hud);
    root.appendChild(ch.fond);

    var panel = h('div', { class: 'noche-panel' });
    root.appendChild(panel);

    function pintarOnda() {
      hOnda.innerHTML = '';
      hOnda.appendChild(h('span', { class: 'onda-l', text: 'buena onda' }));
      for (var i = 0; i < 5; i++) {
        hOnda.appendChild(h('i', { class: i < S.stage.onda ? 'on' : '' }));
      }
    }

    function ambiente(t) {
      sky.style.setProperty('--sky-top', L.ramp(SKY.top, t));
      sky.style.setProperty('--sky-mid', L.ramp(SKY.mid, t));
      sky.style.setProperty('--sky-low', L.ramp(SKY.low, t));
      stars.style.opacity = Math.max(0, Math.min(1, (t - 0.22) / 0.45));
      sun.style.opacity = t < 0.42 ? String(1 - t / 0.42) : '0';
      sun.style.transform = 'translate(-50%,0) translateY(' + (t * 190).toFixed(0) + 'px)';
      moon.style.opacity = t > 0.5 ? String(Math.min(1, (t - 0.5) / 0.3)) : '0';
      moon.style.transform = 'translate(-50%,0) translateY(' + (60 - t * 46).toFixed(0) + 'px)';
      var lit = Math.round(t * 62);
      near.querySelectorAll('.win').forEach(function (w, i) {
        w.classList.toggle('lit', (i * 7 + 3) % 78 < lit);
      });
      root.style.setProperty('--glow', L.ramp(['#ffb066', '#ff8a5c', '#b06a8a', '#5b6ba8'], t));
    }

    /* ---------------- Titelbild ---------------- */
    function portada() {
      ambiente(0);
      hud.style.opacity = '0';
      panel.classList.add('centro');
      panel.innerHTML = '';
      var card = h('div', { class: 'portada' }, [
        h('div', { class: 'p-kicker', text: lesson.stageKicker || 'Simulador' }),
        h('h1', { class: 'p-title', text: lesson.title }),
        h('p', { class: 'p-sub', text: lesson.subtitle || '' }),
        h('div', { class: 'p-meta' }, [
          h('span', { class: 'tag', text: lesson.level }),
          h('span', { class: 'tag', text: escenas.length + ' escenas' }),
          h('span', { class: 'tag', text: '~' + (lesson.minutes || 40) + ' min' })
        ])
      ]);
      var go = h('button', { class: 'btn-noche', type: 'button', text: lesson.stageStart || 'Salir de casa' });
      go.addEventListener('click', function () {
        L.pluck(196, 1.4); L.pluck(293.66, 1.4, 0.16);
        hud.style.opacity = '1';
        S.stage.i = 0; pintar();
      });
      card.appendChild(go);
      if (lesson.stageIntro) card.appendChild(h('p', { class: 'p-note', text: lesson.stageIntro }));
      panel.appendChild(card);
    }

    /* ---------------- Eine Szene ---------------- */
    function pintar() {
      var i = S.stage.i;
      if (i >= escenas.length) return final();
      panel.classList.remove('centro');
      var e = escenas[i];
      var t = escenas.length > 1 ? i / (escenas.length - 1) : 0;
      ambiente(t);
      pintarOnda();
      hHora.textContent = e.hora || '';
      hLugar.textContent = e.lugar || '';
      L.persistProgress();

      panel.innerHTML = '';
      var card = h('div', { class: 'escena' });
      card.appendChild(h('div', { class: 'esc-n', text: (i + 1) + '/' + escenas.length }));

      var narr = h('p', { class: 'esc-narr' });
      card.appendChild(narr);
      var cuerpo = h('div', { class: 'esc-cuerpo' });
      card.appendChild(cuerpo);
      panel.appendChild(card);

      /* Tippen lässt sich überspringen – wer schnell liest, wartet nicht. */
      var tecleo = L.typeOut(narr, e.narracion || '', 11, function () {
        card.classList.remove('tecleando');
        if (e.escucha) return escucha(e, cuerpo);
        if (e.quien) {
          cuerpo.appendChild(h('div', { class: 'burbuja' }, [
            h('div', { class: 'b-quien', text: e.quien }),
            h('div', { class: 'b-dice', html: L.markup(e.dice || '') })
          ]));
        }
        if (e.reto) cuerpo.appendChild(h('div', { class: 'esc-reto', html: L.markup(e.reto) }));
        (e.tipo === 'escribir' ? escribir : e.tipo === 'formas' ? formas : elegir)(e, cuerpo);
      });
      card.classList.add('tecleando');
      card.addEventListener('click', function (ev) {
        if (card.classList.contains('tecleando') && !ev.target.closest('button, input, textarea')) tecleo.stop();
      });
    }

    function marcar(e, ok, mio, correcto) {
      S.stage.onda = Math.max(0, Math.min(5, S.stage.onda + (ok ? 1 : -1)));
      pintarOnda();
      if (ok) { L.pluck(329.63, 1.2); L.clap([0, 0.13, 0.24], 0.1); }
      else { L.pluck(146.83, 0.9, 0.18); }
      L.stageAnswer({
        type: e.tipo || 'elegir', prompt: e.reto || e.narracion, correct: ok,
        yours: mio, right: correcto, explain: e.explica || '',
        skill: e.skill || 'produzieren', grammar: e.grammar || null
      });
    }

    function reaccion(cuerpo, ok, e, mio, correcto) {
      var box = h('div', { class: 'reaccion ' + (ok ? 'si' : 'no') });
      box.appendChild(h('div', { class: 'r-t', text: ok ? (e.gana || '¡Eso!') : (e.pierde || 'Uf.') }));
      if (!ok && correcto) box.appendChild(h('div', { class: 'r-c', html: '→ <b>' + esc(correcto) + '</b>' }));
      if (e.explica) box.appendChild(h('p', { class: 'r-x', html: L.markup(e.explica) }));
      cuerpo.appendChild(box);
      var sig = h('button', { class: 'btn-noche', type: 'button',
        text: S.stage.i + 1 < escenas.length ? (e.siguiente || 'Seguir') : 'Volver a casa' });
      sig.addEventListener('click', function () {
        S.stage.i++; L.persistProgress(); pintar();
      });
      cuerpo.appendChild(sig);
      setTimeout(function () { sig.focus(); }, 40);
    }

    function elegir(e, cuerpo) {
      var caja = h('div', { class: 'opciones' });
      L.shuffle(e.opciones.map(function (_, k) { return k; })).forEach(function (k) {
        var o = e.opciones[k];
        var b = h('button', { class: 'opcion', type: 'button', html: L.markup(o.t) });
        b.addEventListener('click', function () {
          caja.querySelectorAll('.opcion').forEach(function (x) { x.disabled = true; });
          var correcta = e.opciones.filter(function (z) { return z.ok; })[0];
          [].slice.call(caja.children).forEach(function (x) {
            if (x.__ok) x.classList.add('bien');
            else if (x === b) x.classList.add('mal');
            else x.classList.add('gris');
          });
          if (o.why) cuerpo.appendChild(h('p', { class: 'porque', html: L.markup(o.why) }));
          marcar(e, !!o.ok, o.t, correcta ? correcta.t : '');
          reaccion(cuerpo, !!o.ok, e, o.t, o.ok ? '' : (correcta ? correcta.t : ''));
        });
        b.__ok = !!o.ok;
        caja.appendChild(b);
      });
      cuerpo.appendChild(caja);
    }

    function formas(e, cuerpo) {
      var hueco = h('span', { class: 'hueco', text: '·····' });
      var frase = h('div', { class: 'frase' });
      var partes = (e.frase || '').split('___');
      frase.appendChild(document.createTextNode(partes[0] || ''));
      frase.appendChild(hueco);
      frase.appendChild(document.createTextNode(partes[1] || ''));
      cuerpo.appendChild(frase);

      var caja = h('div', { class: 'chips' });
      L.shuffle(e.formas.slice()).forEach(function (f) {
        var b = h('button', { class: 'chip-f', type: 'button', text: f.t });
        b.addEventListener('click', function () {
          caja.querySelectorAll('.chip-f').forEach(function (x) { x.disabled = true; });
          hueco.textContent = f.t;
          hueco.classList.add(f.ok ? 'bien' : 'mal');
          var correcta = e.formas.filter(function (z) { return z.ok; })[0];
          if (!f.ok && correcta) {
            setTimeout(function () { hueco.textContent = correcta.t; hueco.classList.remove('mal'); hueco.classList.add('bien'); }, 900);
          }
          if (f.why) cuerpo.appendChild(h('p', { class: 'porque', html: L.markup(f.why) }));
          marcar(e, !!f.ok, f.t, correcta ? correcta.t : '');
          reaccion(cuerpo, !!f.ok, e, f.t, f.ok ? '' : (correcta ? correcta.t : ''));
        });
        caja.appendChild(b);
      });
      cuerpo.appendChild(caja);
    }

    function escribir(e, cuerpo) {
      var campo = h('input', { class: 'campo', type: 'text', placeholder: e.placeholder || 'Escríbelo …',
        autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false' });
      var ok = h('button', { class: 'btn-noche mini', type: 'button', text: 'Decirlo' });
      cuerpo.appendChild(h('div', { class: 'fila' }, [campo, ok]));
      cuerpo.appendChild(L.accentRow('es', campo));
      if (e.pista) {
        var p = h('button', { class: 'pista', type: 'button', text: '¿Una pista?' });
        p.addEventListener('click', function () { p.replaceWith(h('p', { class: 'porque', html: '💡 ' + L.markup(e.pista) })); });
        cuerpo.appendChild(p);
      }
      function enviar() {
        var mio = campo.value.trim();
        if (!mio) { campo.focus(); return; }
        var r = L.matches(mio, [].concat(e.respuesta));
        campo.disabled = true; ok.disabled = true;
        if (!r.ok) {
          var d = L.diff(mio, [].concat(e.respuesta)[0]);
          cuerpo.appendChild(h('div', { class: 'diff porque', html: d.map(function (x) {
            return '<span class="' + x[0] + '">' + esc(x[1]) + '</span>';
          }).join('') }));
        } else if (!r.exact) {
          cuerpo.appendChild(h('p', { class: 'porque', html: 'Bien, pero faltan las tildes: <b>' + esc(r.target) + '</b>' }));
        }
        marcar(e, r.ok, mio, [].concat(e.respuesta)[0]);
        reaccion(cuerpo, r.ok, e, mio, r.ok ? '' : [].concat(e.respuesta)[0]);
      }
      ok.addEventListener('click', enviar);
      campo.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') enviar(); });
      setTimeout(function () { campo.focus(); }, 120);
    }

    /* Hörszene: der echte Podcast, in die Nacht eingebaut */
    function escucha(e, cuerpo) {
      S.listening = S.listening || { notes: {}, passes: {}, selfRating: null };
      var src = (lesson.listening && lesson.listening.source) || null;
      if (src) {
        cuerpo.appendChild(h('div', { class: 'radio' }, [
          h('div', { class: 'radio-n', text: src.name }),
          L.player(src, 'es', function (ep) {
            S.listening.episode = { titel: ep.title, datum: ep.date, quelle: src.name, url: ep.url };
            L.persistProgress();
          })
        ]));
      }
      var ta = h('textarea', { class: 'campo', placeholder: e.placeholder || 'Dos frases: ¿de qué va?', style: 'min-height:84px' });
      ta.value = S.listening.notes[0] || '';
      ta.addEventListener('input', function () { S.listening.notes[0] = ta.value; L.persistProgress(); });
      cuerpo.appendChild(ta);

      cuerpo.appendChild(h('p', { class: 'esc-reto', html: L.markup(e.auto || '¿Cuánto has pillado?') }));
      var sc = h('div', { class: 'onda-scale' });
      ['😵', '🙁', '🙂', '😄', '🤩'].forEach(function (em, k) {
        var b = h('button', { type: 'button', text: em });
        b.addEventListener('click', function () {
          sc.querySelectorAll('button').forEach(function (x) { x.classList.remove('on'); });
          b.classList.add('on');
          S.listening.selfRating = k + 1;
          S.listening.passes[0] = true;
          L.addXp(20); L.persistProgress(); L.clap([0, 0.12], 0.12);
        });
        sc.appendChild(b);
      });
      cuerpo.appendChild(sc);
      var sig = h('button', { class: 'btn-noche', type: 'button', text: e.siguiente || 'Seguir' });
      sig.addEventListener('click', function () { S.stage.i++; L.persistProgress(); pintar(); });
      cuerpo.appendChild(sig);
    }

    /* ---------------- Amanecer ---------------- */
    function final() {
      ambiente(1);
      hud.style.opacity = '0';
      panel.classList.add('centro');
      panel.innerHTML = '';
      var onda = S.stage.onda;
      var txt = (lesson.finales && (lesson.finales[onda] || lesson.finales[Math.min(5, Math.max(0, onda))])) || '';
      var card = h('div', { class: 'portada final' }, [
        h('div', { class: 'p-kicker', text: '05:40' }),
        h('h1', { class: 'p-title', text: lesson.stageEnd || 'Amanece' }),
        h('p', { class: 'p-sub', text: txt }),
        h('div', { class: 'onda big' })
      ]);
      var o = card.querySelector('.onda');
      for (var i = 0; i < 5; i++) o.appendChild(h('i', { class: i < onda ? 'on' : '' }));
      var go = h('button', { class: 'btn-noche', type: 'button', text: 'Ver cómo ha ido' });
      go.addEventListener('click', function () { L.pluck(261.63, 1.6); L.stageDone(lesson); });
      card.appendChild(go);
      panel.appendChild(card);
      L.clap([0, 0.14, 0.26, 0.46], 0.13);
    }

    (S.stage.i > 0 ? pintar : portada)();
    return root;
  };

})(window.LEKTION);
</script>
<script>/* assets/js/stage-enquete.js */
/* Bühne "L'enquête" – Escape Room in einer Pariser Wohnung.
   Fünf Gegenstände, fünf Rätsel, fünf Zeitfragmente. Wer die Bewegungen
   in die richtige Reihenfolge bringt, kommt durch die Tür.
   Alles CSS und SVG: Zinkdächer, Regen, Fischgrätparkett, Stuck. */
(function (L) {
  'use strict';
  var h = L.h, esc = L.esc;

  var ICONES = {
    pendule: '<circle cx="24" cy="24" r="16"/><path d="M24,14 L24,24 L31,28"/>',
    bureau: '<path d="M8,20 L40,20 L40,38 L8,38 Z"/><path d="M8,20 L24,10 L40,20"/><circle cx="24" cy="29" r="2.2"/>',
    telephone: '<path d="M14,12 h20 a3,3 0 0 1 3,3 v18 a3,3 0 0 1 -3,3 h-20 a3,3 0 0 1 -3,-3 v-18 a3,3 0 0 1 3,-3 z"/><path d="M17,19 h14 M17,25 h14 M17,31 h8"/>',
    valise: '<path d="M9,17 h30 v20 h-30 z"/><path d="M18,17 v-4 h12 v4"/><path d="M9,26 h30"/>',
    tableau: '<path d="M11,10 h26 v28 h-26 z"/><path d="M15,31 l7,-10 l5,7 l4,-5 l6,8 z"/><circle cx="19" cy="17" r="2.4"/>'
  };

  function fenetre() {
    return '<svg class="vitre" viewBox="0 0 300 460" preserveAspectRatio="none" aria-hidden="true">' +
      '<defs><linearGradient id="cielP" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="#4b5f7d"/><stop offset="58%" stop-color="#6d82a0"/>' +
      '<stop offset="100%" stop-color="#93a4bb"/></linearGradient></defs>' +
      '<rect width="300" height="460" fill="url(#cielP)"/>' +
      '<g class="toits">' +
      '<path d="M0,460 L0,352 L46,352 L46,330 L58,330 L58,352 L96,352 L96,300 L150,272 L204,300 L204,352 ' +
      'L236,352 L236,336 L248,336 L248,352 L300,352 L300,460 Z"/>' +
      '<path d="M120,272 L120,246 L132,246 L132,272 M170,268 L170,240 L182,240 L182,268"/>' +
      '<rect x="128" y="312" width="18" height="24" rx="2" class="lucarne"/>' +
      '<rect x="158" y="312" width="18" height="24" rx="2" class="lucarne"/>' +
      '<path d="M262,352 L262,286 M256,294 L268,294 M258,304 L266,304"/>' +
      '</g></svg>';
  }

  function parquet() {
    return '<svg class="parquet-svg" viewBox="0 0 1200 260" preserveAspectRatio="none" aria-hidden="true">' +
      '<defs><pattern id="fish" width="60" height="60" patternUnits="userSpaceOnUse">' +
      '<rect width="60" height="60" fill="#3b2a20"/>' +
      '<path d="M0,0 L30,30 L30,60 L0,30 Z" fill="#4a3527"/>' +
      '<path d="M30,0 L60,30 L60,60 L30,30 Z" fill="#43301f"/>' +
      '<path d="M0,0 L30,30 M30,0 L60,30 M0,30 L30,60 M30,30 L60,60" stroke="#2b1e16" stroke-width="1.2"/>' +
      '</pattern></defs>' +
      '<rect width="1200" height="260" fill="url(#fish)"/>' +
      '<rect width="1200" height="260" fill="url(#solOmbre)"/>' +
      '<defs><linearGradient id="solOmbre" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="#0d1016" stop-opacity=".60"/>' +
      '<stop offset="100%" stop-color="#0d1016" stop-opacity=".08"/></linearGradient></defs>' +
      '</svg>';
  }

  L.stages.enquete = function (lesson) {
    var S = L.session;
    S.stage = S.stage || { resolus: {}, fragments: [], phase: 'intro' };
    var objets = lesson.objets || [];

    var root = h('div', { class: 'enquete' });
    var piece = h('div', { class: 'piece' });
    root.appendChild(piece);

    /* Wand mit Stuck */
    var mur = h('div', { class: 'mur' });
    mur.appendChild(h('div', { class: 'moulure m1' }));
    mur.appendChild(h('div', { class: 'moulure m2' }));
    mur.appendChild(h('div', { class: 'corniche' }));
    mur.appendChild(h('div', { class: 'plinthe' }));
    piece.appendChild(mur);

    /* Fenster mit Regen */
    var fen = h('div', { class: 'fenetre', html: fenetre() });
    fen.appendChild(h('div', { class: 'pluie' }));
    fen.appendChild(h('div', { class: 'croisillon v' }));
    fen.appendChild(h('div', { class: 'croisillon hh' }));
    fen.appendChild(h('div', { class: 'reflet' }));
    piece.appendChild(fen);
    piece.appendChild(h('div', { class: 'lumiere' }));

    /* Boden */
    piece.appendChild(h('div', { class: 'parquet', html: parquet() }));

    /* Tür */
    var porte = h('div', { class: 'porte' }, [
      h('div', { class: 'porte-p' }),
      h('div', { class: 'porte-p bas' }),
      h('div', { class: 'poignee' })
    ]);
    piece.appendChild(porte);

    /* Gegenstände */
    var objDom = {};
    objets.forEach(function (o) {
      var b = h('button', {
        class: 'objet', type: 'button', 'aria-label': o.nom,
        style: 'left:' + o.x + '%; top:' + o.y + '%'
      }, [
        h('span', { class: 'ob-cercle', html: '<svg viewBox="0 0 48 48">' + (ICONES[o.icone] || ICONES.valise) + '</svg>' }),
        h('span', { class: 'ob-nom', text: o.nom })
      ]);
      b.addEventListener('click', function () { if (!S.stage.resolus[o.id]) ouvrir(o); });
      objDom[o.id] = b;
      piece.appendChild(b);
    });

    /* Kopf und Zeitleiste */
    var bandeau = h('div', { class: 'bandeau' });
    root.appendChild(bandeau);
    var frise = h('div', { class: 'frise' });
    root.appendChild(frise);

    var dossier = h('div', { class: 'dossier-fond' });
    root.appendChild(dossier);
    var chuleta = L.chuleta(lesson, lesson.chuletaLabel || 'aide-mémoire');
    root.appendChild(chuleta.fond);

    function majBandeau() {
      bandeau.innerHTML = '';
      bandeau.appendChild(h('div', {}, [
        h('div', { class: 'bd-t', text: lesson.stageKicker || 'Enquête' }),
        h('div', { class: 'bd-l', text: lesson.lieu || '' })
      ]));
      var n = Object.keys(S.stage.resolus).length;
      bandeau.appendChild(h('div', { class: 'bd-d' }, [
        h('div', { class: 'bd-c' }, [
          h('span', { text: n + '/' + objets.length }),
          h('span', { class: 'bd-x', text: lesson.compteur || 'indices' })
        ]),
        chuleta.btn
      ]));
    }

    function majFrise() {
      frise.innerHTML = '';
      objets.forEach(function (o) {
        var f = S.stage.resolus[o.id] ? o.fragment : null;
        frise.appendChild(h('div', { class: 'fr-case' + (f ? ' plein' : '') }, [
          h('div', { class: 'fr-h', text: f ? f.heure : '??:??' }),
          h('div', { class: 'fr-t', text: f ? f.texte : '—' })
        ]));
      });
    }

    function majObjets() {
      objets.forEach(function (o) {
        objDom[o.id].classList.toggle('fait', !!S.stage.resolus[o.id]);
      });
      if (Object.keys(S.stage.resolus).length === objets.length) porte.classList.add('prete');
    }

    /* ---------------- Dossier ---------------- */
    function fermer() {
      dossier.classList.remove('ouvert');
      setTimeout(function () { dossier.innerHTML = ''; }, 320);
    }

    function ouvrir(o) {
      L.thunk('open');
      dossier.innerHTML = '';
      var card = h('div', { class: 'dossier' });
      card.appendChild(h('button', { class: 'ds-x', type: 'button', text: '✕', 'aria-label': 'fermer', onclick: fermer }));
      card.appendChild(h('div', { class: 'ds-k', text: o.nom }));
      card.appendChild(h('p', { class: 'ds-i', html: L.markup(o.indice) }));

      var zone = h('div', { class: 'ds-zone' });
      card.appendChild(zone);
      dossier.appendChild(card);
      dossier.classList.add('ouvert');

      var e = o.enigme;
      zone.appendChild(h('div', { class: 'ds-q', html: L.markup(e.question) }));
      (e.type === 'ecrire' ? ecrire : e.type === 'formes' ? formes : choisir)(o, e, zone);
    }

    function resoudre(o, e, zone, ok, mien, bon) {
      L.stageAnswer({
        type: e.type || 'choisir', prompt: e.question, correct: ok,
        yours: mien, right: bon, explain: e.explication || '',
        skill: e.skill || 'produzieren', grammar: e.grammar || lesson.grammarId || null
      });
      if (ok) { L.accordion([261.63, 329.63, 392], 1.2); }
      else { L.thunk('lock'); }

      var box = h('div', { class: 'ds-r ' + (ok ? 'oui' : 'non') });
      box.appendChild(h('div', { class: 'ds-rt', text: ok ? (e.reussite || 'Ça colle.') : (e.echec || 'Non.') }));
      if (!ok && bon) box.appendChild(h('div', { class: 'ds-rc', html: '→ <b>' + esc(bon) + '</b>' }));
      if (e.explication) box.appendChild(h('p', { class: 'ds-rx', html: L.markup(e.explication) }));
      zone.appendChild(box);

      /* Der Hinweis wird immer freigeschaltet – sonst steckt man fest. */
      S.stage.resolus[o.id] = { ok: ok };
      L.persistProgress();
      majBandeau(); majFrise(); majObjets();

      var frag = h('div', { class: 'ds-frag' }, [
        h('div', { class: 'ds-fh', text: o.fragment.heure }),
        h('div', { class: 'ds-ft', html: L.markup(o.fragment.texte) })
      ]);
      zone.appendChild(frag);

      var suite = h('button', { class: 'btn-enq', type: 'button',
        text: Object.keys(S.stage.resolus).length === objets.length ? (lesson.versPorte || 'Aller à la porte') : (e.suite || 'Noter et continuer') });
      suite.addEventListener('click', function () {
        fermer();
        if (Object.keys(S.stage.resolus).length === objets.length) setTimeout(finale, 380);
      });
      zone.appendChild(suite);
      setTimeout(function () { suite.focus(); }, 60);
    }

    function choisir(o, e, zone) {
      var caja = h('div', { class: 'ds-opts' });
      L.shuffle(e.options.map(function (_, k) { return k; })).forEach(function (k) {
        var op = e.options[k];
        var b = h('button', { class: 'ds-opt', type: 'button', html: L.markup(op.t) });
        b.__ok = !!op.ok;
        b.addEventListener('click', function () {
          caja.querySelectorAll('.ds-opt').forEach(function (x) {
            x.disabled = true;
            x.classList.add(x.__ok ? 'bon' : (x === b ? 'faux' : 'pale'));
          });
          var bonne = e.options.filter(function (z) { return z.ok; })[0];
          if (op.why) zone.appendChild(h('p', { class: 'ds-w', html: L.markup(op.why) }));
          resoudre(o, e, zone, !!op.ok, op.t, op.ok ? '' : (bonne ? bonne.t : ''));
        });
        caja.appendChild(b);
      });
      zone.appendChild(caja);
    }

    function formes(o, e, zone) {
      var trou = h('span', { class: 'trou', text: '·····' });
      var ph = h('div', { class: 'ds-phrase' });
      var parts = (e.phrase || '').split('___');
      ph.appendChild(document.createTextNode(parts[0] || ''));
      ph.appendChild(trou);
      ph.appendChild(document.createTextNode(parts[1] || ''));
      zone.appendChild(ph);
      var caja = h('div', { class: 'ds-chips' });
      L.shuffle(e.formes.slice()).forEach(function (f) {
        var b = h('button', { class: 'ds-chip', type: 'button', text: f.t });
        b.addEventListener('click', function () {
          caja.querySelectorAll('.ds-chip').forEach(function (x) { x.disabled = true; });
          trou.textContent = f.t;
          trou.classList.add(f.ok ? 'bon' : 'faux');
          var bonne = e.formes.filter(function (z) { return z.ok; })[0];
          if (f.why) zone.appendChild(h('p', { class: 'ds-w', html: L.markup(f.why) }));
          resoudre(o, e, zone, !!f.ok, f.t, f.ok ? '' : (bonne ? bonne.t : ''));
        });
        caja.appendChild(b);
      });
      zone.appendChild(caja);
    }

    function ecrire(o, e, zone) {
      var champ = h('input', { class: 'ds-champ', type: 'text', placeholder: e.placeholder || 'Écris la phrase …',
        autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false' });
      var ok = h('button', { class: 'btn-enq mini', type: 'button', text: 'Vérifier' });
      zone.appendChild(h('div', { class: 'ds-fila' }, [champ, ok]));
      zone.appendChild(L.accentRow('fr', champ));
      if (e.aide) {
        var a = h('button', { class: 'ds-aide', type: 'button', text: 'Un indice ?' });
        a.addEventListener('click', function () { a.replaceWith(h('p', { class: 'ds-w', html: '💡 ' + L.markup(e.aide) })); });
        zone.appendChild(a);
      }
      function go() {
        var mien = champ.value.trim();
        if (!mien) { champ.focus(); return; }
        var r = L.matches(mien, [].concat(e.reponse));
        champ.disabled = true; ok.disabled = true;
        if (!r.ok) {
          zone.appendChild(h('div', { class: 'diff ds-w', html: L.diff(mien, [].concat(e.reponse)[0]).map(function (x) {
            return '<span class="' + x[0] + '">' + esc(x[1]) + '</span>';
          }).join('') }));
        } else if (!r.exact) {
          zone.appendChild(h('p', { class: 'ds-w', html: 'Juste, mais il manque les accents : <b>' + esc(r.target) + '</b>' }));
        }
        resoudre(o, e, zone, r.ok, mien, r.ok ? '' : [].concat(e.reponse)[0]);
      }
      ok.addEventListener('click', go);
      champ.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') go(); });
      setTimeout(function () { champ.focus(); }, 140);
    }

    /* ---------------- Finale: die Zeitleiste ordnen ---------------- */
    function finale() {
      var f = lesson.finale || {};
      dossier.innerHTML = '';
      var card = h('div', { class: 'dossier large' });
      card.appendChild(h('div', { class: 'ds-k', text: f.titre || 'La porte' }));
      card.appendChild(h('p', { class: 'ds-i', html: L.markup(f.consigne || '') }));
      var zone = h('div', { class: 'ds-zone' });
      card.appendChild(zone);
      dossier.appendChild(card);
      dossier.classList.add('ouvert');

      /* Erst das Wort, das den ganzen Fall erklärt – dann die Chronologie. */
      if (f.mot && !S.stage.motFait) {
        zone.appendChild(h('div', { class: 'ds-q', html: L.markup(f.mot.question) }));
        var cm = h('div', { class: 'ds-opts' });
        L.shuffle(f.mot.options.map(function (_, k) { return k; })).forEach(function (k) {
          var op = f.mot.options[k];
          var b = h('button', { class: 'ds-opt', type: 'button', html: L.markup(op.t) });
          b.__ok = !!op.ok;
          b.addEventListener('click', function () {
            cm.querySelectorAll('.ds-opt').forEach(function (x) {
              x.disabled = true;
              x.classList.add(x.__ok ? 'bon' : (x === b ? 'faux' : 'pale'));
            });
            var bonne = f.mot.options.filter(function (z) { return z.ok; })[0];
            L.stageAnswer({
              type: 'mot', prompt: f.mot.question, correct: !!op.ok,
              yours: op.t, right: op.ok ? '' : (bonne ? bonne.t : ''),
              explain: f.mot.explication || '', skill: 'wortschatz', grammar: null
            });
            op.ok ? L.accordion([293.66, 369.99], 0.7, 0.06) : L.thunk('lock');
            if (op.why) zone.appendChild(h('p', { class: 'ds-w', html: L.markup(op.why) }));
            if (f.mot.explication) zone.appendChild(h('p', { class: 'ds-w', html: L.markup(f.mot.explication) }));
            S.stage.motFait = true; L.persistProgress();
            var puis = h('button', { class: 'btn-enq', type: 'button', text: f.mot.suite || 'Ouvrir la serrure' });
            puis.addEventListener('click', function () { finale(); });
            zone.appendChild(puis);
            setTimeout(function () { puis.focus(); }, 50);
          });
          cm.appendChild(b);
        });
        zone.appendChild(cm);
        return;
      }

      var ordre = f.ordre || objets.map(function (o) { return o.id; });
      var restants = L.shuffle(ordre.slice());
      var pos = 0, fautes = 0;
      var ligne = h('div', { class: 'timeline' });
      var stock = h('div', { class: 'stock' });
      zone.appendChild(ligne); zone.appendChild(stock);

      function carte(id) {
        var o = objets.filter(function (x) { return x.id === id; })[0];
        return h('button', { class: 'tl-carte', type: 'button', 'data-id': id }, [
          h('span', { class: 'tl-h', text: o.fragment.heure }),
          h('span', { class: 'tl-t', text: o.fragment.texte })
        ]);
      }

      restants.forEach(function (id) {
        var c = carte(id);
        c.addEventListener('click', function () {
          if (c.disabled) return;
          if (id === ordre[pos]) {
            c.disabled = true; c.classList.add('pris');
            var copie = carte(id); copie.disabled = true; copie.classList.add('place');
            ligne.appendChild(copie);
            pos++;
            L.thunk('tick'); L.accordion([392, 493.88], 0.5, 0.05);
            if (pos === ordre.length) fini(fautes);
          } else {
            fautes++;
            c.classList.add('secoue');
            L.thunk('lock');
            setTimeout(function () { c.classList.remove('secoue'); }, 420);
          }
        });
        stock.appendChild(c);
      });

      function fini(fautes) {
        L.stageAnswer({
          type: 'timeline', prompt: f.consigne || 'chronologie',
          correct: fautes === 0, yours: fautes + ' erreur(s)', right: '0',
          explain: f.explication || '', skill: 'verstehen', grammar: lesson.grammarId || null
        });
        porte.classList.add('ouverte');
        root.classList.add('sortie');
        L.accordion([261.63, 329.63, 392, 523.25], 2.2, 0.08);
        var res = h('div', { class: 'ds-r oui' }, [
          h('div', { class: 'ds-rt', text: fautes === 0 ? (f.parfait || 'Sans une seule erreur.') : (f.reussite || 'La porte s\'ouvre.') }),
          f.explication ? h('p', { class: 'ds-rx', html: L.markup(f.explication) }) : null
        ]);
        zone.appendChild(res);
        if (lesson.listening && lesson.listening.source) zone.appendChild(ecoute());
        var sortir = h('button', { class: 'btn-enq', type: 'button', text: f.sortir || 'Sortir' });
        sortir.addEventListener('click', function () { L.stageDone(lesson); });
        zone.appendChild(sortir);
      }
    }

    function ecoute() {
      S.listening = S.listening || { notes: {}, passes: {}, selfRating: null };
      var src = lesson.listening.source;
      var box = h('div', { class: 'ds-radio' });
      box.appendChild(h('div', { class: 'ds-k', style: 'margin-bottom:8px', text: lesson.listening.headline || src.name }));
      if (lesson.listening.intro) box.appendChild(h('p', { class: 'ds-i', text: lesson.listening.intro }));
      box.appendChild(L.player(src, 'fr', function (ep) {
        S.listening.episode = { titel: ep.title, datum: ep.date, quelle: src.name, url: ep.url };
        L.persistProgress();
      }));
      var sc = h('div', { class: 'onda-scale', style: 'margin-top:12px' });
      ['😵', '🙁', '🙂', '😄', '🤩'].forEach(function (em, k) {
        var b = h('button', { type: 'button', text: em });
        b.addEventListener('click', function () {
          sc.querySelectorAll('button').forEach(function (x) { x.classList.remove('on'); });
          b.classList.add('on');
          S.listening.selfRating = k + 1; S.listening.passes[0] = true;
          L.addXp(20); L.persistProgress();
        });
        sc.appendChild(b);
      });
      box.appendChild(h('p', { class: 'ds-w', style: 'margin-top:10px', text: lesson.listening.auto || 'Tu en as compris combien ?' }));
      box.appendChild(sc);
      return box;
    }

    /* ---------------- Vorspann ---------------- */
    function intro() {
      dossier.innerHTML = '';
      var card = h('div', { class: 'dossier centre' }, [
        h('div', { class: 'ds-k', text: lesson.stageKicker || 'Enquête' }),
        h('h1', { class: 'ds-titre', text: lesson.title }),
        h('p', { class: 'ds-i', text: lesson.subtitle || '' }),
        h('p', { class: 'ds-brief', html: L.markup(lesson.brief || '') })
      ]);
      var go = h('button', { class: 'btn-enq', type: 'button', text: lesson.stageStart || 'Commencer' });
      go.addEventListener('click', function () {
        S.stage.phase = 'jeu'; L.persistProgress();
        fermer(); L.accordion([220, 277.18, 329.63], 1.6);
      });
      card.appendChild(go);
      dossier.appendChild(card);
      dossier.classList.add('ouvert');
    }

    majBandeau(); majFrise(); majObjets();
    if (S.stage.phase === 'intro') intro();
    else if (Object.keys(S.stage.resolus).length === objets.length) finale();
    return root;
  };

})(window.LEKTION);
</script>
<script>/* assets/js/stations.js */
/* Sprachen - die sechs Stationen einer Lerneinheit.
   Sobald eine Lektion offen ist, steht hier alles in der Zielsprache. */
(function (L) {
  'use strict';
  var h = L.h, esc = L.esc;
  var markup = function (s) { return L.markup(s); };
  var rich = function (s, n) { return L.rich(s, n); };
  var T = function (k, v) { return L.t(k, v); };

  L.STATIONS = [
    { id: 'intro' }, { id: 'vocab' }, { id: 'read' },
    { id: 'train' }, { id: 'listen' }, { id: 'wrap' }
  ];
  L.stationLabel = function (id) { return T('st.' + id); };

  L.views = {};

  /* Eigenständige Formate bringen ihre Darstellung selbst mit. */
  L.views.stage = function (lesson) {
    var render = L.stages && L.stages[lesson.stage];
    if (!render) {
      return h('div', { class: 'view wrap empty' }, [
        h('div', { class: 'big', text: '🎭' }),
        h('h2', { text: 'Unbekanntes Format: ' + lesson.stage })
      ]);
    }
    return render(lesson);
  };

  /* ---------------- Startseite (bleibt deutsch: hier wird erst gewählt) ---------------- */
  function flagSvg(code) {
    if (code === 'fr') {
      return '<svg class="flag" viewBox="0 0 90 60" aria-hidden="true">' +
        '<rect width="30" height="60" fill="#0d2c8c"/><rect x="30" width="30" height="60" fill="#fff"/>' +
        '<rect x="60" width="30" height="60" fill="#d8283c"/></svg>';
    }
    return '<svg class="flag" viewBox="0 0 90 60" aria-hidden="true">' +
      '<rect width="90" height="60" fill="#c60b1e"/>' +
      '<rect y="15" width="90" height="30" fill="#ffc400"/></svg>';
  }

  L.views.home = function () {
    var prof = L.profile || { languages: {} };
    var wrap = h('div', { class: 'view wrap' });

    wrap.appendChild(h('div', { class: 'home-head' }, [
      h('div', { class: 'eyebrow', text: 'Heute ' + new Date().toLocaleDateString('de-CH', { day: 'numeric', month: 'long' }) }),
      h('h1', { html: 'Womit willst du <span class="grad">Zeit verlieren</span>?' }),
      h('p', {
        class: 'lead', style: 'margin-top:14px;max-width:52ch;margin-left:auto;margin-right:auto',
        text: 'Ab hier gilt nur noch die andere Sprache. Erklärungen, Aufgaben, Knöpfe – alles. Kein deutsches Wort mehr.'
      })
    ]));

    var picker = h('div', { class: 'picker' });
    ['es', 'fr'].forEach(function (lang) {
      var meta = prof.languages[lang] || {};
      var mine = L.catalog.filter(function (e) { return e.lang === lang; })
        .sort(function (a, b) { return a.date < b.date ? 1 : -1; });
      var latest = mine[0];
      var doneCount = mine.filter(function (e) { return L.state.done[e.id]; }).length;
      var isFresh = latest && !L.state.done[latest.id];

      var card = h('button', { class: 'lang-card', 'data-l': lang, type: 'button' }, [
        h('span', { html: flagSvg(lang) }),
        h('h2', { text: meta.nativeName || (lang === 'es' ? 'Español' : 'Français') }),
        h('div', { class: 'native', text: meta.name || '' }),
        h('div', { class: 'meta' }, [
          h('span', { class: 'tag', text: (meta.level || '?') }),
          isFresh ? h('span', { class: 'tag hot', text: 'Neue Einheit' })
                  : h('span', { class: 'tag ghost', text: latest ? 'Nochmal machen' : 'Noch nichts da' }),
          doneCount ? h('span', { class: 'tag', text: doneCount + '× erledigt' }) : null
        ]),
        h('div', { class: 'cta' }, [
          h('span', { text: latest ? (latest.title || 'Loslegen') : 'Warten auf Claude' }),
          h('span', { class: 'arrow', text: '→' })
        ])
      ]);
      card.addEventListener('mouseenter', function () { document.body.dataset.lang = lang; });
      card.addEventListener('click', function () {
        if (!latest) { L.toast('Für diese Sprache liegt noch keine Einheit bereit.'); return; }
        L.fx.tap();
        L.go('#/lektion/' + latest.id);
      });
      picker.appendChild(card);
    });
    wrap.appendChild(picker);

    var older = L.catalog.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    if (older.length > 2) {
      wrap.appendChild(h('div', { class: 'card', style: 'margin-top:26px' }, [
        h('h3', { text: 'Frühere Einheiten' }),
        h('div', { class: 'stack', style: 'gap:2px;margin-top:10px' },
          older.slice(2).map(function (e) {
            return h('button', { class: 'menu-item', type: 'button', onclick: function () { L.go('#/lektion/' + e.id); } }, [
              h('span', { class: 'ic', text: e.lang === 'es' ? '🇪🇸' : '🇫🇷' }),
              h('span', {}, [
                h('div', { text: e.title }),
                h('div', { class: 'muted', style: 'font-size:12px', text: L.fmtDate(e.date, 'de') + (L.state.done[e.id] ? ' · erledigt' : '') })
              ])
            ]);
          }))
      ]));
    }

    var xp = L.state.xp;
    wrap.appendChild(h('p', {
      class: 'muted', style: 'text-align:center;margin-top:30px',
      text: xp ? ('Bisher ' + xp + ' XP' + (L.state.streakDays > 1 ? ' · ' + L.state.streakDays + ' Tage in Folge' : ''))
               : 'Noch keine XP. Das ändern wir gleich.'
    }));
    return wrap;
  };

  /* ---------------- Station 1: Einstieg ---------------- */
  L.views.intro = function (lesson) {
    var v = h('div', { class: 'view wrap stack-lg' });
    v.appendChild(h('div', {}, [
      h('div', { class: 'eyebrow', text: lesson.level + ' · ' + L.fmtDate(lesson.date, lesson.lang) }),
      h('h1', { text: lesson.title }),
      h('p', { class: 'lead', style: 'margin-top:14px', text: lesson.subtitle || '' })
    ]));

    if (lesson.intro && lesson.intro.hook) {
      v.appendChild(h('div', { class: 'card' }, [
        h('div', { class: 'task-kind', text: T('intro.hook') }),

  function splitSentences(text) {
    var parts = text.match(/[^.!?…]+[.!?…]+["»]?|[^.!?…]+$/g) || [text];

      if (idx === -1) return;
      var found = html.substr(idx, term.length);
      html = html.slice(0, idx) +
        '<span class="gl">' + found + '<span class="tip">' + esc(g.def) + '</span></span>' +
        html.slice(idx + term.length);

    return html;

    var paper = h('div', { class: 'paper' });

    if (hasSimple) {
