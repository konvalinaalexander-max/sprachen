<style>
/* ============================================================
   Sprachen - Lernoberfläche
   Dunkle "Study Lounge" mit warmem Papier-Panel fürs Lesen.
   Keine externen Fonts, keine externen Assets -> 100% offline.
   ============================================================ */

:root{
  --bg:#0b0d12;
  --bg-2:#11141c;
  --surface:rgba(255,255,255,.045);
  --surface-2:rgba(255,255,255,.075);
  --line:rgba(255,255,255,.10);
  --line-strong:rgba(255,255,255,.18);
  --ink:#eef1f7;
  --ink-2:#a9b2c5;
  --ink-3:#6f7891;
  --ok:#3ddc97;
  --ok-dim:rgba(61,220,151,.14);
  --no:#ff6b6b;
  --no-dim:rgba(255,107,107,.14);
  --warn:#ffc857;
  --paper:#f7f3ea;
  --paper-ink:#26231d;
  --paper-ink-2:#5d574c;

  --a1:#7c8cff; --a2:#c084fc;      /* wird pro Sprache überschrieben */
  --glow:rgba(124,140,255,.30);

  --r-s:10px; --r-m:16px; --r-l:24px; --r-xl:32px;
  --ease:cubic-bezier(.22,1,.36,1);
  --ease-back:cubic-bezier(.34,1.56,.64,1);

  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --serif:ui-serif,Georgia,"Iowan Old Style","Palatino Linotype",serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}

body[data-lang="es"]{ --a1:#ffa43d; --a2:#e5484d; --glow:rgba(255,164,61,.30); }
body[data-lang="fr"]{ --a1:#5b8cff; --a2:#f0637a; --glow:rgba(91,140,255,.30); }

*{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0;
  font-family:var(--sans);
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow-x:hidden;
}

/* Hintergrund: zwei weiche Farbwolken, die auf die Sprache reagieren */
.aura{ position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
.aura::before,.aura::after{
  content:""; position:absolute; width:70vmax; height:70vmax; border-radius:50%;
  filter:blur(90px); opacity:.28; transition:background 900ms var(--ease), opacity 900ms var(--ease);
}
.aura::before{ background:var(--a1); top:-32vmax; left:-18vmax; }
.aura::after { background:var(--a2); bottom:-38vmax; right:-20vmax; opacity:.20; }
body[data-view="home"] .aura::before{ opacity:.30; }
body[data-view="home"] .aura::after{ opacity:.14; }
body[data-view="home"] main{ display:flex; align-items:center; min-height:calc(100vh - 190px); }
body[data-view="home"] main > #view{ width:100%; }

.grain{
  position:fixed; inset:0; z-index:1; pointer-events:none; opacity:.35;
  background-image:radial-gradient(rgba(255,255,255,.045) 1px, transparent 1px);
  background-size:3px 3px;
}

.app{ position:relative; z-index:2; min-height:100%; display:flex; flex-direction:column; }

/* ---------- Kopfzeile ---------- */
.topbar{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; gap:14px;
  padding:12px clamp(14px,4vw,34px);
  backdrop-filter:blur(16px) saturate(140%);
  background:linear-gradient(to bottom,rgba(11,13,18,.92),rgba(11,13,18,.55));
  border-bottom:1px solid var(--line);
}
.brand{ display:flex; align-items:center; gap:10px; font-weight:650; letter-spacing:-.01em; cursor:pointer; background:none; border:0; color:var(--ink); font-size:15px; padding:4px; border-radius:10px; font-family:var(--sans); }
.brand:hover{ color:#fff; }
.brand .mark{
  width:26px; height:26px; border-radius:9px; flex:none;
  background:linear-gradient(135deg,var(--a1),var(--a2));
  box-shadow:0 4px 16px var(--glow);
  display:grid; place-items:center; font-size:13px; color:#0b0d12; font-weight:800;
}
.topbar .spacer{ flex:1; }

.pill{
  display:inline-flex; align-items:center; gap:7px;
  padding:6px 12px; border-radius:999px;
  background:var(--surface); border:1px solid var(--line);
  font-size:12.5px; color:var(--ink-2); font-variant-numeric:tabular-nums;
}
.pill b{ color:var(--ink); font-weight:650; }
.pill .flame{ filter:saturate(1.4); }

.icon-btn{
  width:36px; height:36px; display:grid; place-items:center;
  border-radius:11px; border:1px solid var(--line); background:var(--surface);
  color:var(--ink-2); cursor:pointer; transition:.2s var(--ease);
}
.icon-btn:hover{ background:var(--surface-2); color:var(--ink); border-color:var(--line-strong); transform:translateY(-1px); }

/* ---------- Stationsleiste ---------- */
.rail{ padding:0 clamp(14px,4vw,34px); }
.rail-inner{
  max-width:940px; margin:0 auto; padding:14px 0 4px;
  display:flex; align-items:center; gap:6px;
}
.rail-step{
  flex:1; display:flex; flex-direction:column; gap:7px; align-items:center;
  background:none; border:0; padding:4px 2px; cursor:pointer; font-family:var(--sans);
  color:var(--ink-3); font-size:11px; letter-spacing:.02em; transition:.25s var(--ease);
}
.rail-step .bar{ height:3px; width:100%; border-radius:3px; background:rgba(255,255,255,.10); overflow:hidden; }
.rail-step .bar i{ display:block; height:100%; width:0; border-radius:3px; background:linear-gradient(90deg,var(--a1),var(--a2)); transition:width .6s var(--ease); }
.rail-step[data-state="done"] .bar i{ width:100%; }
.rail-step[data-state="active"] .bar i{ width:100%; animation:pulseBar 2.4s ease-in-out infinite; }
.rail-step[data-state="active"]{ color:var(--ink); }
.rail-step[data-state="done"]{ color:var(--ink-2); }
.rail-step:hover:not(:disabled){ color:var(--ink); }
.rail-step:disabled{ cursor:default; opacity:.55; }
@keyframes pulseBar{ 0%,100%{ opacity:1 } 50%{ opacity:.55 } }

/* ---------- Layout ---------- */
main{ flex:1; padding:clamp(18px,4vw,40px) clamp(14px,4vw,34px) 120px; }
.wrap{ max-width:780px; margin:0 auto; }
.wrap.wide{ max-width:1020px; }

.view{ animation:rise .55s var(--ease) both; }
@keyframes rise{ from{ opacity:0; transform:translateY(14px) } to{ opacity:1; transform:none } }

h1,h2,h3{ margin:0; letter-spacing:-.022em; line-height:1.15; }
h1{ font-family:var(--serif); font-size:clamp(30px,5.2vw,46px); font-weight:600; }
h2{ font-family:var(--serif); font-size:clamp(22px,3.4vw,30px); font-weight:600; }
h3{ font-size:16px; font-weight:650; letter-spacing:-.01em; }
p{ line-height:1.65; color:var(--ink-2); margin:0; }

.eyebrow{
  display:inline-flex; align-items:center; gap:8px;
  font-size:11.5px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--a1); font-weight:700; margin-bottom:14px;
}
.eyebrow::before{ content:""; width:22px; height:1.5px; background:linear-gradient(90deg,var(--a1),transparent); }

.lead{ font-size:17px; line-height:1.62; color:var(--ink-2); }
.prose p{ margin:0 0 .85em; }
.prose p:last-child{ margin-bottom:0; }
.muted{ color:var(--ink-3); font-size:13.5px; }

.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r-l);
  padding:clamp(18px,3vw,26px);
}
.card + .card{ margin-top:14px; }
.stack{ display:flex; flex-direction:column; gap:14px; }
.stack-lg{ display:flex; flex-direction:column; gap:26px; }
.row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:9px;
  padding:13px 22px; border-radius:14px; border:1px solid transparent;
  font-family:var(--sans); font-size:14.5px; font-weight:600; letter-spacing:-.01em;
  cursor:pointer; transition:.22s var(--ease); white-space:nowrap;
  background:var(--surface); color:var(--ink); border-color:var(--line);
}
.btn:hover{ background:var(--surface-2); border-color:var(--line-strong); transform:translateY(-1px); }
.btn:active{ transform:translateY(0) scale(.985); }
.btn:disabled{ opacity:.4; cursor:not-allowed; transform:none; }
.btn-primary{
  background:linear-gradient(135deg,var(--a1),var(--a2)); color:#0b0d12; border-color:transparent;
  box-shadow:0 8px 26px -8px var(--glow);
}
.btn-primary:hover{ box-shadow:0 14px 34px -10px var(--glow); filter:brightness(1.06); }
.btn-ghost{ background:transparent; border-color:var(--line); color:var(--ink-2); }
.btn-sm{ padding:8px 14px; font-size:13px; border-radius:11px; }
.btn-block{ width:100%; }

/* ---------- Startseite: Sprachwahl ---------- */
.home-head{ text-align:center; margin-bottom:clamp(26px,5vw,44px); }
.home-head h1 .grad{ background:linear-gradient(120deg,var(--a1),var(--a2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
.picker{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
@media(max-width:680px){ .picker{ grid-template-columns:1fr; } }

.lang-card{
  position:relative; overflow:hidden; text-align:left; cursor:pointer;
  border:1px solid var(--line); border-radius:var(--r-xl);
  background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
  padding:26px 24px 22px; color:var(--ink); font-family:var(--sans);
  transition:.4s var(--ease); isolation:isolate;
}
.lang-card::after{
  content:""; position:absolute; inset:0; z-index:-1; opacity:0; transition:opacity .45s var(--ease);
  background:radial-gradient(120% 90% at 20% 0%, var(--c1), transparent 62%);
}
.lang-card:hover{ transform:translateY(-5px); border-color:var(--line-strong); box-shadow:0 24px 60px -30px var(--c1); }
.lang-card:hover::after{ opacity:.5; }
.lang-card[data-l="es"]{ --c1:rgba(255,164,61,.45); --a1:#ffa43d; --a2:#e5484d; --glow:rgba(255,164,61,.30); }
.lang-card[data-l="fr"]{ --c1:rgba(91,140,255,.45); --a1:#5b8cff; --a2:#f0637a; --glow:rgba(91,140,255,.30); }
.flag{ width:64px; height:44px; border-radius:9px; overflow:hidden; box-shadow:0 8px 22px -8px rgba(0,0,0,.7); display:block; }
.lang-card h2{ margin-top:18px; }
.lang-card .native{ font-family:var(--serif); font-style:italic; color:var(--ink-3); font-size:15px; margin-top:2px; }
.lang-card .meta{ display:flex; gap:8px; flex-wrap:wrap; margin-top:18px; }
.tag{
  font-size:11.5px; padding:5px 11px; border-radius:999px;
  background:rgba(255,255,255,.07); border:1px solid var(--line); color:var(--ink-2);
  letter-spacing:.01em; white-space:nowrap;
}
.tag.hot{ background:linear-gradient(135deg,var(--a1),var(--a2)); color:#0b0d12; border-color:transparent; font-weight:650; }
.tag.ghost{ background:transparent; border-style:dashed; color:var(--ink-3); }
.lang-card .cta{ margin-top:20px; display:flex; align-items:center; gap:8px; font-size:14px; font-weight:600; color:var(--ink); }
.lang-card .cta .arrow{ transition:transform .35s var(--ease-back); }
.lang-card:hover .cta .arrow{ transform:translateX(5px); }

/* ---------- Wortkarten ---------- */
.vocab-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:11px; }
.vcard{
  position:relative; border:1px solid var(--line); border-radius:var(--r-m);
  background:var(--surface); padding:15px 16px; cursor:pointer; text-align:left;
  font-family:var(--sans); color:var(--ink); transition:.28s var(--ease); overflow:hidden;
}
.vcard:hover{ background:var(--surface-2); transform:translateY(-2px); border-color:var(--line-strong); }
.vcard .term{ font-size:16px; font-weight:640; letter-spacing:-.01em; }
.vcard .pos{ font-size:10.5px; color:var(--a1); text-transform:uppercase; letter-spacing:.1em; font-weight:700; margin-top:3px; }
.vcard .de{
  font-size:13.5px; color:var(--ink-2); margin-top:9px;
  filter:blur(5px); opacity:.55; transition:.3s var(--ease); user-select:none;
}
.vcard.open .de{ filter:none; opacity:1; user-select:text; }
.vcard .ex{ font-size:12.5px; color:var(--ink-3); font-style:italic; margin-top:8px; line-height:1.5; display:none; }
.vcard.open .ex{ display:block; animation:rise .35s var(--ease) both; }
.vcard .hint{ position:absolute; top:13px; right:13px; font-size:10px; color:var(--ink-3); opacity:.7; }
.vcard.open .hint{ opacity:0; }

/* ---------- Grammatik ---------- */
.gbox{ border:1px solid var(--line); border-radius:var(--r-l); overflow:hidden; background:var(--surface); }
.gbox-head{ padding:18px 22px; background:linear-gradient(135deg,rgba(255,255,255,.05),transparent); border-bottom:1px solid var(--line); }
.gbox-head .why{ font-size:13px; color:var(--ink-3); margin-top:5px; }
.gbox-body{ padding:20px 22px; display:flex; flex-direction:column; gap:18px; }
.gtable{ width:100%; border-collapse:collapse; font-size:14px; }
.gtable th{ text-align:left; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); font-weight:700; padding:0 12px 9px 0; }
.gtable td{ padding:8px 12px 8px 0; border-top:1px solid var(--line); color:var(--ink-2); }
.gtable td:first-child{ color:var(--ink); font-weight:560; }
.gtable .hl{ color:var(--a1); font-weight:700; }
.scroll-x{ overflow-x:auto; }

.ex-line{ display:flex; flex-direction:column; gap:3px; padding:11px 14px; border-radius:var(--r-s); background:rgba(255,255,255,.035); border-left:2px solid var(--a1); }
.ex-line .src{ font-size:15px; color:var(--ink); line-height:1.5; }
.ex-line .trg{ font-size:13px; color:var(--ink-3); }
.ex-line .note{ font-size:12px; color:var(--a1); margin-top:3px; }
mark, .hl-word{ background:linear-gradient(transparent 58%, var(--glow) 58%); color:inherit; border-radius:2px; padding:0 1px; font-weight:600; }

.pitfall{ display:flex; gap:11px; padding:13px 15px; border-radius:var(--r-m); background:rgba(255,200,87,.07); border:1px solid rgba(255,200,87,.2); }
.pitfall .ic{ flex:none; font-size:15px; line-height:1.4; }
.pitfall div p{ font-size:13.5px; color:var(--ink-2); }
.pitfall b{ color:var(--warn); }

/* ---------- Lesetext: Papier ---------- */
.paper{
  background:var(--paper); color:var(--paper-ink); border-radius:var(--r-l);
  padding:clamp(24px,4.5vw,44px); box-shadow:0 30px 70px -34px rgba(0,0,0,.85);
  position:relative;
}
.paper h2{ color:var(--paper-ink); font-size:clamp(23px,3.6vw,31px); }
.paper .byline{ font-size:12.5px; color:var(--paper-ink-2); margin-top:9px; padding-bottom:18px; border-bottom:1px solid rgba(0,0,0,.10); }
.paper p{ color:var(--paper-ink); font-family:var(--serif); font-size:var(--read-size,18px); line-height:1.78; margin-top:17px; }
.paper p:first-of-type::first-letter{
  float:left; font-size:3.05em; line-height:.82; padding:.05em .10em 0 0; font-weight:600; color:var(--a2);
}
.gl{
  border-bottom:1.5px dotted rgba(0,0,0,.34); cursor:help; position:relative;
  transition:background .2s var(--ease);
}
.gl:hover, .gl.on{ background:rgba(255,200,87,.38); border-radius:3px; }
.gl .tip{
  position:absolute; left:50%; bottom:calc(100% + 9px); transform:translateX(-50%) translateY(5px);
  background:#15181f; color:#eef1f7; font-family:var(--sans); font-size:12.5px; font-style:normal; font-weight:500;
  padding:8px 12px; border-radius:9px; white-space:nowrap; max-width:74vw;
  opacity:0; pointer-events:none; transition:.22s var(--ease); z-index:20;
  box-shadow:0 10px 30px -10px rgba(0,0,0,.8); line-height:1.4;
}
.gl:hover .tip, .gl.on .tip{ opacity:1; transform:translateX(-50%) translateY(0); }
.paper-tools{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:16px; }
.chip{
  font-size:12px; padding:6px 12px; border-radius:999px; cursor:pointer;
  background:rgba(0,0,0,.05); border:1px solid rgba(0,0,0,.12); color:var(--paper-ink-2);
  font-family:var(--sans); transition:.2s var(--ease);
}
.chip:hover{ background:rgba(0,0,0,.09); color:var(--paper-ink); }
.chip[aria-pressed="true"]{ background:var(--paper-ink); color:var(--paper); border-color:var(--paper-ink); }
.trans{
  display:none; font-family:var(--sans); font-size:14px; color:var(--paper-ink-2);
  padding:10px 14px; margin-top:9px; border-left:2px solid rgba(0,0,0,.16); line-height:1.6;
}
.paper.show-trans .trans{ display:block; animation:rise .3s var(--ease) both; }

/* ---------- Aufgaben ---------- */
.task-shell{ display:flex; flex-direction:column; gap:18px; }
.task-head{ display:flex; align-items:flex-start; gap:14px; }
.task-num{
  flex:none; width:36px; height:36px; border-radius:12px; display:grid; place-items:center;
  background:linear-gradient(135deg,var(--a1),var(--a2)); color:#0b0d12; font-weight:800; font-size:14px;
  box-shadow:0 6px 18px -6px var(--glow);
}
.task-kind{ font-size:11px; letter-spacing:.13em; text-transform:uppercase; color:var(--a1); font-weight:700; }
.task-q{ font-size:17px; line-height:1.5; margin-top:4px; color:var(--ink); font-weight:500; }

.opts{ display:flex; flex-direction:column; gap:9px; }
.opt{
  display:flex; align-items:center; gap:13px; width:100%; text-align:left;
  padding:14px 17px; border-radius:var(--r-m); cursor:pointer;
  background:var(--surface); border:1px solid var(--line); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.45; transition:.2s var(--ease);
}
.opt:hover:not(:disabled){ background:var(--surface-2); border-color:var(--line-strong); transform:translateX(3px); }
.opt .key{
  flex:none; width:25px; height:25px; border-radius:8px; display:grid; place-items:center;
  border:1px solid var(--line-strong); font-size:11.5px; color:var(--ink-3); font-weight:700;
}
.opt:disabled{ cursor:default; }
.opt.right{ background:var(--ok-dim); border-color:rgba(61,220,151,.5); }
.opt.right .key{ background:var(--ok); color:#08120d; border-color:transparent; }
.opt.wrong{ background:var(--no-dim); border-color:rgba(255,107,107,.5); }
.opt.wrong .key{ background:var(--no); color:#1a0808; border-color:transparent; }
.opt.faded{ opacity:.4; }

.verdict{
  display:flex; gap:12px; padding:15px 17px; border-radius:var(--r-m);
  border:1px solid var(--line); background:var(--surface);
  animation:rise .35s var(--ease) both;
}
.verdict.good{ background:var(--ok-dim); border-color:rgba(61,220,151,.35); }
.verdict.bad{ background:var(--no-dim); border-color:rgba(255,107,107,.35); }
.verdict .ic{ flex:none; font-size:17px; }
.verdict .t{ font-weight:650; font-size:14.5px; margin-bottom:4px; }
.verdict.good .t{ color:var(--ok); }
.verdict.bad .t{ color:var(--no); }
.verdict p{ font-size:13.5px; line-height:1.6; }
.verdict code{ font-family:var(--mono); font-size:12.5px; background:rgba(255,255,255,.08); padding:2px 6px; border-radius:5px; color:var(--ink); }

/* Beweis-Klick im Text (Textdetektiv) */
.evidence{ background:var(--paper); color:var(--paper-ink); border-radius:var(--r-m); padding:18px 20px; }
.evidence .sent{
  cursor:pointer; padding:3px 4px; margin:0 -2px; border-radius:5px; font-family:var(--serif);
  font-size:16px; line-height:1.75; transition:.18s var(--ease); display:inline;
}
.evidence .sent:hover{ background:rgba(0,0,0,.07); }
.evidence .sent.picked-right{ background:rgba(61,180,120,.32); box-shadow:inset 0 0 0 1px rgba(30,120,80,.5); }
.evidence .sent.picked-wrong{ background:rgba(229,72,77,.26); }

/* Satzschmiede */
.forge{ display:flex; flex-direction:column; gap:14px; }
.slot{
  min-height:60px; display:flex; flex-wrap:wrap; gap:8px; align-content:flex-start;
  padding:13px; border-radius:var(--r-m); border:1.5px dashed var(--line-strong);
  background:rgba(255,255,255,.025); transition:.25s var(--ease);
}
.slot.filled{ border-style:solid; background:rgba(255,255,255,.05); }
.slot.ok{ border-color:rgba(61,220,151,.6); background:var(--ok-dim); }
.slot.no{ border-color:rgba(255,107,107,.55); background:var(--no-dim); }
.bank{ display:flex; flex-wrap:wrap; gap:8px; }
.word{
  padding:9px 15px; border-radius:11px; cursor:pointer; font-size:15px; font-family:var(--sans);
  background:var(--surface-2); border:1px solid var(--line-strong); color:var(--ink);
  transition:.18s var(--ease-back); user-select:none;
}
.word:hover{ background:rgba(255,255,255,.13); transform:translateY(-2px); }
.word:active{ transform:scale(.94); }
.word.used{
  color:transparent; background:rgba(255,255,255,.02);
  border-color:rgba(255,255,255,.07); border-style:dashed;
  pointer-events:none; transform:none;
}
.word.in-slot{ background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.07)); }

/* Verwandler (Texteingabe) */
.type-row{ display:flex; gap:10px; align-items:stretch; flex-wrap:wrap; }
.field{
  flex:1; min-width:220px; padding:14px 17px; border-radius:var(--r-m);
  background:rgba(255,255,255,.05); border:1px solid var(--line-strong); color:var(--ink);
  font-family:var(--sans); font-size:16px; outline:none; transition:.2s var(--ease);
}
.field:focus{ border-color:var(--a1); box-shadow:0 0 0 3px var(--glow); background:rgba(255,255,255,.07); }
.field::placeholder{ color:var(--ink-3); }
textarea.field{ width:100%; resize:vertical; min-height:120px; line-height:1.6; font-size:15px; }
.accents{ display:flex; gap:5px; flex-wrap:wrap; margin-top:9px; }
.acc{
  width:34px; height:34px; border-radius:9px; cursor:pointer; font-size:15px;
  background:var(--surface); border:1px solid var(--line); color:var(--ink-2); font-family:var(--serif);
  transition:.16s var(--ease-back);
}
.acc:hover{ background:var(--surface-2); color:var(--ink); transform:translateY(-2px); }
.diff{ font-family:var(--mono); font-size:15px; letter-spacing:.01em; }
.diff .keep{ color:var(--ink-2); }
.diff .add{ background:var(--ok-dim); color:var(--ok); border-radius:3px; padding:1px 2px; }
.diff .del{ background:var(--no-dim); color:var(--no); border-radius:3px; padding:1px 2px; text-decoration:line-through; }

/* Paarjagd */
.pairs{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
@media(max-width:560px){ .pairs{ gap:7px; } }
.pcol{ display:flex; flex-direction:column; gap:9px; }
.pitem{
  padding:13px 15px; border-radius:var(--r-m); cursor:pointer; text-align:left;
  background:var(--surface); border:1px solid var(--line); color:var(--ink);
  font-family:var(--sans); font-size:14.5px; transition:.22s var(--ease); line-height:1.35;
}
.pitem:hover:not(:disabled){ background:var(--surface-2); transform:translateY(-1px); }
.pitem.sel{ border-color:var(--a1); background:rgba(255,255,255,.10); box-shadow:0 0 0 2px var(--glow); }
.pitem.matched{ opacity:.34; pointer-events:none; border-style:dashed; }
.pitem.shake{ animation:shake .4s; }
@keyframes shake{ 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }

/* Fortschritt innerhalb der Aufgaben */
.task-progress{ display:flex; gap:5px; margin-bottom:4px; }
.task-progress i{ flex:1; height:4px; border-radius:3px; background:rgba(255,255,255,.10); transition:.4s var(--ease); }
.task-progress i.done{ background:linear-gradient(90deg,var(--a1),var(--a2)); }
.task-progress i.miss{ background:var(--no); opacity:.7; }
.task-progress i.now{ background:rgba(255,255,255,.32); }

/* Streak-Feedback */
.combo{
  position:fixed; left:50%; top:22%; transform:translate(-50%,-10px) scale(.9);
  font-family:var(--serif); font-size:44px; font-weight:700; pointer-events:none; z-index:90;
  background:linear-gradient(120deg,var(--a1),var(--a2)); -webkit-background-clip:text; background-clip:text; color:transparent;
  opacity:0;
}
.combo.go{ animation:combo 1.15s var(--ease) both; }
@keyframes combo{
  0%{ opacity:0; transform:translate(-50%,10px) scale(.7) }
  22%{ opacity:1; transform:translate(-50%,-8px) scale(1.1) }
  72%{ opacity:1; transform:translate(-50%,-14px) scale(1) }
  100%{ opacity:0; transform:translate(-50%,-42px) scale(.95) }
}
.spark{ position:fixed; width:7px; height:7px; border-radius:50%; pointer-events:none; z-index:89; }

/* ---------- Hörstation ---------- */
.source-card{
  border:1px solid var(--line); border-radius:var(--r-l); overflow:hidden;
  background:linear-gradient(150deg,rgba(255,255,255,.075),rgba(255,255,255,.02));
}
.source-card .sc-head{ padding:20px 22px 18px; display:flex; gap:16px; align-items:flex-start; }
.sc-icon{
  flex:none; width:50px; height:50px; border-radius:15px; display:grid; place-items:center; font-size:21px;
  background:linear-gradient(135deg,var(--a1),var(--a2)); box-shadow:0 10px 26px -10px var(--glow);
}
.sc-meta{ display:flex; gap:7px; flex-wrap:wrap; margin-top:10px; }
.sc-actions{ padding:0 22px 20px; display:flex; gap:9px; flex-wrap:wrap; }
.alts{ padding:15px 22px; border-top:1px solid var(--line); background:rgba(0,0,0,.18); }
.alt-link{
  display:flex; align-items:center; gap:10px; padding:9px 0; color:var(--ink-2);
  font-size:13.5px; text-decoration:none; transition:.2s var(--ease); border-bottom:1px solid transparent;
}
.alt-link:hover{ color:var(--ink); }
.alt-link .why{ color:var(--ink-3); font-size:12.5px; }
.alt-link .go{ margin-left:auto; color:var(--a1); font-size:12px; }

.pass{
  border:1px solid var(--line); border-radius:var(--r-m); background:var(--surface);
  overflow:hidden; transition:.3s var(--ease);
}
.pass.active{ border-color:var(--line-strong); background:var(--surface-2); }
.pass-head{
  display:flex; align-items:center; gap:13px; padding:15px 18px; cursor:pointer;
  background:none; border:0; width:100%; text-align:left; font-family:var(--sans); color:var(--ink);
}
.pass-n{
  flex:none; width:29px; height:29px; border-radius:10px; display:grid; place-items:center;
  border:1px solid var(--line-strong); font-size:12.5px; font-weight:700; color:var(--ink-3);
}
.pass.done .pass-n{ background:var(--ok); color:#08120d; border-color:transparent; }
.pass-head .t{ font-size:15px; font-weight:600; }
.pass-head .s{ font-size:12.5px; color:var(--ink-3); margin-top:2px; }
.pass-body{ padding:0 18px 18px; display:none; flex-direction:column; gap:12px; }
.pass.active .pass-body{ display:flex; animation:rise .3s var(--ease) both; }

/* ---------- Umfrage ---------- */
.q-block{ border-top:1px solid var(--line); padding-top:20px; margin-top:20px; }
.q-block:first-child{ border-top:0; padding-top:0; margin-top:0; }
.q-title{ font-size:15.5px; font-weight:600; margin-bottom:12px; line-height:1.45; }
.scale{ display:flex; gap:7px; }
.scale button{
  flex:1; padding:13px 4px; border-radius:12px; cursor:pointer; font-family:var(--sans);
  background:var(--surface); border:1px solid var(--line); color:var(--ink-2);
  font-size:19px; transition:.22s var(--ease-back);
}
.scale button:hover{ transform:translateY(-3px); background:var(--surface-2); }
.scale button[aria-pressed="true"]{ background:linear-gradient(135deg,var(--a1),var(--a2)); border-color:transparent; transform:translateY(-3px) scale(1.04); box-shadow:0 10px 24px -8px var(--glow); }
.scale-legend{ display:flex; justify-content:space-between; font-size:11.5px; color:var(--ink-3); margin-top:7px; }
.choices{ display:flex; gap:8px; flex-wrap:wrap; }
.choice{
  padding:10px 16px; border-radius:12px; cursor:pointer; font-family:var(--sans); font-size:14px;
  background:var(--surface); border:1px solid var(--line); color:var(--ink-2); transition:.2s var(--ease);
}
.choice:hover{ background:var(--surface-2); color:var(--ink); }
.choice[aria-pressed="true"]{ background:linear-gradient(135deg,var(--a1),var(--a2)); color:#0b0d12; border-color:transparent; font-weight:620; }

/* ---------- Abschluss / Report ---------- */
.score-ring{ display:grid; place-items:center; margin:0 auto 6px; position:relative; width:138px; height:138px; }
.score-ring svg{ transform:rotate(-90deg); }
.score-ring .val{ position:absolute; font-family:var(--serif); font-size:38px; font-weight:600; }
.score-ring .val small{ font-size:15px; color:var(--ink-3); }

.stat-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(115px,1fr)); gap:10px; }
.stat{ padding:15px; border-radius:var(--r-m); background:var(--surface); border:1px solid var(--line); text-align:center; }
.stat .n{ font-family:var(--serif); font-size:25px; font-weight:600; }
.stat .l{ font-size:11.5px; color:var(--ink-3); margin-top:3px; letter-spacing:.02em; }

.mistake{
  padding:15px 17px; border-radius:var(--r-m); background:rgba(255,107,107,.06);
  border:1px solid rgba(255,107,107,.2); display:flex; flex-direction:column; gap:7px;
}
.mistake .q{ font-size:14px; color:var(--ink); font-weight:560; line-height:1.45; }
.mistake .line{ font-size:13.5px; display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; }
.mistake .lbl{ font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); min-width:52px; }
.mistake .yours{ color:var(--no); text-decoration:line-through; text-decoration-color:rgba(255,107,107,.5); }
.mistake .right{ color:var(--ok); font-weight:600; }
.mistake .exp{ font-size:13px; color:var(--ink-2); line-height:1.6; border-top:1px solid rgba(255,255,255,.07); padding-top:9px; }

.report-box{
  font-family:var(--mono); font-size:11.5px; line-height:1.55; color:var(--ink-2);
  background:#080a0e; border:1px solid var(--line); border-radius:var(--r-m);
  padding:15px; max-height:200px; overflow:auto; white-space:pre-wrap; word-break:break-all;
}

/* ---------- Menü / Dialog ---------- */
.sheet{
  position:fixed; inset:0; z-index:100; display:none;
  background:rgba(5,6,9,.72); backdrop-filter:blur(7px);
  align-items:center; justify-content:center; padding:20px;
}
.sheet.open{ display:flex; animation:fade .25s var(--ease) both; }
@keyframes fade{ from{opacity:0} to{opacity:1} }
.sheet-inner{
  width:100%; max-width:420px; background:var(--bg-2); border:1px solid var(--line-strong);
  border-radius:var(--r-l); padding:24px; animation:pop .35s var(--ease-back) both;
  box-shadow:0 40px 90px -30px rgba(0,0,0,.9);
}
@keyframes pop{ from{ opacity:0; transform:translateY(18px) scale(.96) } to{ opacity:1; transform:none } }
.menu-item{
  display:flex; align-items:center; gap:13px; width:100%; padding:13px 15px; border-radius:13px;
  background:none; border:1px solid transparent; color:var(--ink-2); cursor:pointer;
  font-family:var(--sans); font-size:14.5px; text-align:left; transition:.18s var(--ease);
}
.menu-item:hover{ background:var(--surface); color:var(--ink); border-color:var(--line); }
.menu-item .ic{ width:20px; text-align:center; font-size:15px; }
.menu-item.danger:hover{ background:var(--no-dim); color:var(--no); border-color:rgba(255,107,107,.3); }
.menu-sep{ height:1px; background:var(--line); margin:9px 0; }

/* ---------- Fußleiste ---------- */
.footbar{
  position:fixed; left:0; right:0; bottom:0; z-index:50;
  padding:13px clamp(14px,4vw,34px) calc(13px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,rgba(11,13,18,.97) 62%,rgba(11,13,18,0));
  display:flex; justify-content:center;
}
.footbar-inner{ width:100%; max-width:780px; display:flex; gap:11px; align-items:center; }
.footbar .hint{ font-size:12.5px; color:var(--ink-3); flex:1; line-height:1.4; }

.toast{
  position:fixed; bottom:88px; left:50%; transform:translateX(-50%) translateY(14px);
  background:var(--bg-2); border:1px solid var(--line-strong); color:var(--ink);
  padding:11px 19px; border-radius:13px; font-size:13.5px; z-index:120;
  opacity:0; pointer-events:none; transition:.3s var(--ease); box-shadow:0 16px 40px -14px rgba(0,0,0,.9);
}
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

.empty{ text-align:center; padding:60px 20px; }
.empty .big{ font-size:44px; margin-bottom:14px; opacity:.5; }

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
}
@media print{ .topbar,.footbar,.rail{ display:none } body{ background:#fff } }

</style>

<script>/* assets/js/core.js */
/* Sprachen - Kern: Registry, Zustand, Klang, Kleinkram.
   Bewusst ohne ES-Module, damit die App auch über file:// startet. */
(function (global) {
  'use strict';

  var LEKTION = global.LEKTION || {};
  global.LEKTION = LEKTION;

  /* ---------- Registry ---------- */
  LEKTION.lessons = {};          // id -> Lektionsobjekt
  LEKTION.catalog = [];          // Kurzeinträge aus manifest.js
  LEKTION.manifest = function (entries) { LEKTION.catalog = entries || []; };
  LEKTION.register = function (lesson) {
    LEKTION.lessons[lesson.id] = lesson;
    document.dispatchEvent(new CustomEvent('lesson:ready', { detail: lesson.id }));
  };
  LEKTION.load = function (entry) {
    return new Promise(function (resolve, reject) {
      if (LEKTION.lessons[entry.id]) return resolve(LEKTION.lessons[entry.id]);
      var s = document.createElement('script');
      s.src = entry.file;
      s.onload = function () {
        LEKTION.lessons[entry.id]
          ? resolve(LEKTION.lessons[entry.id])
          : reject(new Error('Lektion ' + entry.id + ' hat sich nicht registriert.'));
      };
      s.onerror = function () { reject(new Error('Datei nicht ladbar: ' + entry.file)); };
      document.head.appendChild(s);
    });
  };

  /* ---------- Zustand (localStorage) ---------- */
  var KEY = 'sprachen.v1';
  var blank = {
    xp: 0,
    streakDays: 0,
    lastDay: null,
    done: {},        // lessonId -> {at, score, total, minutes}
    progress: {},    // lessonId -> laufender Zwischenstand
    settings: { readSize: 18, sound: true }
  };

  function read() {
    try {
      var raw = global.localStorage && localStorage.getItem(KEY);
      if (!raw) return JSON.parse(JSON.stringify(blank));
      var d = JSON.parse(raw);
      for (var k in blank) if (!(k in d)) d[k] = blank[k];
      for (var s in blank.settings) if (!(s in d.settings)) d.settings[s] = blank.settings[s];
      return d;
    } catch (e) { return JSON.parse(JSON.stringify(blank)); }
  }

  var S = read();
  LEKTION.state = S;
  LEKTION.save = function () {
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  };
  LEKTION.resetAll = function () {
    S = JSON.parse(JSON.stringify(blank));
    LEKTION.state = S;
    LEKTION.save();
  };

  LEKTION.addXp = function (n) {
    S.xp += n;
    var today = new Date().toISOString().slice(0, 10);
    if (S.lastDay !== today) {
      var y = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
      S.streakDays = (S.lastDay === y) ? S.streakDays + 1 : 1;
      S.lastDay = today;
    }
    LEKTION.save();
    document.dispatchEvent(new CustomEvent('xp:changed'));
  };

  /* ---------- Klang: synthetisiert, also offline ---------- */
  var ctx = null;
  function audio() {
    if (!S.settings.sound) return null;
    if (!ctx) {
      var AC = global.AudioContext || global.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tone(freq, dur, type, vol, delay) {
    var c = audio(); if (!c) return;
    var t0 = c.currentTime + (delay || 0);
    var o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol || 0.09, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  LEKTION.fx = {
    tap:   function () { tone(520, 0.07, 'sine', 0.05); },
    right: function (streak) {
      var base = 523.25, step = Math.min(streak || 0, 6);
      tone(base * Math.pow(1.0595, step * 2), 0.13, 'sine', 0.085);
      tone(base * Math.pow(1.0595, step * 2 + 4), 0.17, 'sine', 0.06, 0.07);
    },
    wrong: function () { tone(196, 0.16, 'triangle', 0.07); tone(146, 0.22, 'triangle', 0.05, 0.06); },
    done:  function () { [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) { tone(f, 0.3, 'sine', 0.07, i * 0.09); }); },
    flip:  function () { tone(740, 0.05, 'sine', 0.035); }
  };

  /* ---------- Partikel & Toast ---------- */
  LEKTION.sparks = function (el, n) {
    if (!el || global.matchMedia('(prefers-reduced-motion:reduce)').matches) return;
    var r = el.getBoundingClientRect();
    var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    var cs = getComputedStyle(document.body);
    var colors = [cs.getPropertyValue('--a1').trim() || '#7c8cff', cs.getPropertyValue('--a2').trim() || '#c084fc', '#3ddc97'];
    for (var i = 0; i < (n || 14); i++) {
      (function (i) {
        var p = document.createElement('i');
        p.className = 'spark';
        p.style.background = colors[i % colors.length];
        p.style.left = cx + 'px'; p.style.top = cy + 'px';
        document.body.appendChild(p);
        var a = (Math.PI * 2 * i) / (n || 14) + Math.random() * 0.6;
        var d = 55 + Math.random() * 85;
        p.animate([
          { transform: 'translate(-50%,-50%) scale(1)', opacity: 1 },
          { transform: 'translate(' + (Math.cos(a) * d - 50) + '%,' + (Math.sin(a) * d + 60 - 50) + '%) scale(0)', opacity: 0 }
        ], { duration: 620 + Math.random() * 340, easing: 'cubic-bezier(.2,.8,.3,1)' })
         .onfinish = function () { p.remove(); };
      })(i);
    }
  };

  LEKTION.combo = function (text) {
    var el = document.getElementById('combo');
    if (!el) return;
    el.textContent = text;
    el.classList.remove('go');
    void el.offsetWidth;
    el.classList.add('go');
  };

  var toastTimer;
  LEKTION.toast = function (msg, ms) {
    var t = document.getElementById('toast');
    if (!t) return;
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, ms || 2400);
  };

  /* ---------- Helfer ---------- */
  LEKTION.h = function (tag, attrs, kids) {
    var el = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (k === 'class') el.className = attrs[k];
      else if (k === 'html') el.innerHTML = attrs[k];
      else if (k === 'text') el.textContent = attrs[k];
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2).toLowerCase(), attrs[k]);
      else if (attrs[k] !== null && attrs[k] !== undefined && attrs[k] !== false) el.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach(function (c) {
      if (c === null || c === undefined || c === false) return;
      el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return el;
  };

  LEKTION.esc = function (s) {
    return String(s === undefined || s === null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  };

  /* Autoren-Auszeichnung: *fett* und _hervorgehoben_. Wird überall verwendet,
     wo Lektionstexte gerendert werden – Erklärungen, Notizen, Rückmeldungen. */
  LEKTION.markup = function (s) {
    return LEKTION.esc(s)
      .replace(/\*([^*]+)\*/g, '<b style="color:var(--ink)">$1</b>')
      .replace(/_([^_]+)_/g, '<span class="hl-word">$1</span>');
  };

  /* Mehrere Absätze mit Auszeichnung. */
  LEKTION.rich = function (s, size) {
    return LEKTION.markup(s).split(/\n{2,}/).map(function (para) {
      return '<p style="line-height:1.72;font-size:' + (size || 15) + 'px">' +
        para.replace(/\n/g, '<br>') + '</p>';
    }).join('');
  };

  LEKTION.shuffle = function (arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  };

  /* Vergleich von Freitext: Akzente, Groß-/Kleinschreibung und Zeichensetzung
     werden verziehen - der Inhalt zählt. Akzentfehler werden separat gemeldet. */
  LEKTION.norm = function (s, keepAccents) {
    var t = String(s || '').trim().toLowerCase().replace(/[¿¡]/g, '')
      .replace(/[.,;:!?"'«»]/g, '').replace(/\s+/g, ' ');
    if (!keepAccents && t.normalize) t = t.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    return t;
  };
  LEKTION.matches = function (input, accepted) {
    var list = Array.isArray(accepted) ? accepted : [accepted];
    var loose = LEKTION.norm(input), strict = LEKTION.norm(input, true);
    for (var i = 0; i < list.length; i++) {
      if (strict === LEKTION.norm(list[i], true)) return { ok: true, exact: true, target: list[i] };
    }
    for (var j = 0; j < list.length; j++) {
      if (loose === LEKTION.norm(list[j])) return { ok: true, exact: false, target: list[j] };
    }
    return { ok: false, exact: false, target: list[0] };
  };

  /* Wortweiser Vergleich für die Korrekturanzeige */
  LEKTION.diff = function (a, b) {
    var A = String(a).split(/(\s+)/), B = String(b).split(/(\s+)/);
    var n = A.length, m = B.length, i, j;
    var dp = [];
    for (i = 0; i <= n; i++) { dp[i] = []; for (j = 0; j <= m; j++) dp[i][j] = 0; }
    for (i = n - 1; i >= 0; i--) for (j = m - 1; j >= 0; j--) {
      dp[i][j] = LEKTION.norm(A[i]) === LEKTION.norm(B[j])
        ? dp[i + 1][j + 1] + 1
        : Math.max(dp[i + 1][j], dp[i][j + 1]);
    }
    var out = []; i = 0; j = 0;
    while (i < n && j < m) {
      if (LEKTION.norm(A[i]) === LEKTION.norm(B[j])) { out.push(['keep', B[j]]); i++; j++; }
      else if (dp[i + 1][j] >= dp[i][j + 1]) { out.push(['del', A[i]]); i++; }
      else { out.push(['add', B[j]]); j++; }
    }
    while (i < n) out.push(['del', A[i++]]);
    while (j < m) out.push(['add', B[j++]]);
    return out;
  };

  LEKTION.fmtDate = function (iso) {
    try {
      return new Date(iso + 'T12:00:00').toLocaleDateString('de-CH',
        { weekday: 'long', day: 'numeric', month: 'long' });
    } catch (e) { return iso; }
  };

})(window);
</script>
<script>/* assets/js/tasks.js */
/* Sprachen - Aufgabentypen.
   Jede Engine bekommt (task, ctx) und liefert ein Element.
   ctx.answered({correct, yours, right, explain, skipped}) meldet das Ergebnis zurück. */
(function (L) {
  'use strict';
  var h = L.h, esc = L.esc, markup = function (s) { return L.markup(s); };
  L.engines = {};

  function verdict(good, title, bodyHtml) {
    return h('div', { class: 'verdict ' + (good ? 'good' : 'bad') }, [
      h('div', { class: 'ic', text: good ? '✓' : '✕' }),
      h('div', {}, [
        h('div', { class: 't', text: title }),
        h('p', { html: bodyHtml || '' })
      ])
    ]);
  }
  L.verdictBox = verdict;

  function lockButtons(root) {
    root.querySelectorAll('button').forEach(function (b) { b.disabled = true; });
  }

  /* Akzent-Schnelltasten unter Eingabefeldern */
  function accentBar(lang, field) {
    var sets = {
      es: ['á', 'é', 'í', 'ó', 'ú', 'ñ', 'ü', '¿', '¡'],
      fr: ['é', 'è', 'ê', 'à', 'â', 'ç', 'î', 'ô', 'û', 'ë']
    };
    var bar = h('div', { class: 'accents' });
    (sets[lang] || []).forEach(function (ch) {
      bar.appendChild(h('button', {
        class: 'acc', type: 'button', text: ch, tabindex: '-1',
        onclick: function (e) {
          e.preventDefault();
          var s = field.selectionStart, en = field.selectionEnd;
          field.value = field.value.slice(0, s) + ch + field.value.slice(en);
          field.focus();
          field.selectionStart = field.selectionEnd = s + ch.length;
          L.fx.tap();
        }
      }));
    });
    return bar;
  }

  /* =============== 1. Blitz: Auswahl mit Begründung =============== */
  L.engines.choice = function (task, ctx) {
    var root = h('div', { class: 'stack' });
    var opts = h('div', { class: 'opts' });
    var keys = 'ABCD';
    var order = task.keepOrder ? task.options.map(function (_, i) { return i; })
                               : L.shuffle(task.options.map(function (_, i) { return i; }));

    order.forEach(function (idx, pos) {
      var o = task.options[idx];
      var label = typeof o === 'string' ? o : o.text;
      var btn = h('button', { class: 'opt', type: 'button' }, [
        h('span', { class: 'key', text: keys[pos] || '·' }),
        h('span', { html: esc(label) })
      ]);
      btn.addEventListener('click', function () {
        var right = (idx === task.answer);
        lockButtons(root);
        opts.querySelectorAll('.opt').forEach(function (b, i) {
          var oi = order[i];
          if (oi === task.answer) b.classList.add('right');
          else if (b === btn) b.classList.add('wrong');
          else b.classList.add('faded');
        });
        var chosen = task.options[idx];
        var why = (typeof chosen === 'object' && chosen.why) ? chosen.why : '';
        var body = (right ? '' : '<b>Richtig wäre:</b> ' + esc(labelOf(task.options[task.answer])) + '<br>')
          + markup(why || task.explain || '');
        if (why && task.explain) body += '<br><span class="muted">' + markup(task.explain) + '</span>';
        root.appendChild(verdict(right, right ? (task.praise || 'Sitzt.') : 'Knapp daneben', body));
        ctx.answered({
          correct: right,
          yours: labelOf(chosen),
          right: labelOf(task.options[task.answer]),
          explain: why || task.explain || ''
        });
      });
      opts.appendChild(btn);
    });
    function labelOf(o) { return typeof o === 'string' ? o : o.text; }
    root.appendChild(opts);
    return root;
  };

  /* =============== 2. Textdetektiv: Aussage prüfen + Beleg klicken =============== */
  L.engines.evidence = function (task, ctx) {
    var root = h('div', { class: 'stack' });
    var choices = [
      { id: 'richtig', label: 'Stimmt' },
      { id: 'falsch', label: 'Stimmt nicht' },
      { id: 'unklar', label: 'Steht nicht im Text' }
    ];
    var opts = h('div', { class: 'opts' });
    choices.forEach(function (c, i) {
      var b = h('button', { class: 'opt', type: 'button' }, [
        h('span', { class: 'key', text: ['✓', '✕', '?'][i] }),
        h('span', { text: c.label })
      ]);
      b.addEventListener('click', function () { pick(c.id, b); });
      opts.appendChild(b);
    });
    root.appendChild(opts);

    function pick(id, btn) {
      var right = (id === task.verdict);
      lockButtons(root);
      opts.querySelectorAll('.opt').forEach(function (b, i) {
        if (choices[i].id === task.verdict) b.classList.add('right');
        else if (b === btn) b.classList.add('wrong');
        else b.classList.add('faded');
      });
      if (task.verdict !== 'unklar' && task.evidence && ctx.sentences) {
        root.appendChild(evidenceStep(right));
      } else {
        root.appendChild(verdict(right, right ? 'Gutes Auge.' : 'Nicht ganz', markup(task.explain || '')));
        ctx.answered({ correct: right, yours: labelFor(id), right: labelFor(task.verdict), explain: task.explain || '' });
      }
    }
    function labelFor(id) {
      for (var i = 0; i < choices.length; i++) if (choices[i].id === id) return choices[i].label;
      return id;
    }

    function evidenceStep(verdictWasRight) {
      var box = h('div', { class: 'stack' });
      box.appendChild(h('p', { class: 'muted', text: 'Und jetzt der Beweis: Klick den Satz an, der das belegt.' }));
      var ev = h('div', { class: 'evidence' });
      var found = false;
      ctx.sentences.forEach(function (s) {
        var isIt = !found && task.evidence && s.text.indexOf(task.evidence) !== -1;
        if (isIt) found = true;
        var span = h('span', { class: 'sent', text: s.text + ' ' });
        span.addEventListener('click', function () {
          if (ev.dataset.locked) return;
          ev.dataset.locked = '1';
          span.classList.add(isIt ? 'picked-right' : 'picked-wrong');
          if (!isIt) {
            ev.querySelectorAll('.sent').forEach(function (o, i) {
              if (ctx.sentences[i].text.indexOf(task.evidence) !== -1) o.classList.add('picked-right');
            });
          }
          isIt ? L.fx.right(0) : L.fx.wrong();
          var all = verdictWasRight && isIt;
          box.appendChild(verdict(all,
            all ? 'Urteil und Beleg - beides sauber.' : (verdictWasRight ? 'Urteil ja, Beleg nein.' : 'Nicht ganz'),
            markup(task.explain || '')));
          ctx.answered({
            correct: all,
            yours: labelFor(task.verdict === 'unklar' ? 'unklar' : (verdictWasRight ? task.verdict : 'x')) + (isIt ? ' + richtiger Beleg' : ' + falscher Beleg'),
            right: labelFor(task.verdict) + ' (Beleg: "' + task.evidence + '")',
            explain: task.explain || ''
          });
        });
        ev.appendChild(span);
      });
      box.appendChild(ev);
      return box;
    }
    return root;
  };

  /* =============== 3. Satzschmiede: Wortfolge bauen =============== */
  L.engines.forge = function (task, ctx) {
    var root = h('div', { class: 'forge' });
    var target = task.solution.split(/\s+/);
    var bankWords = L.shuffle(target.concat(task.distractors || []));
    var slot = h('div', { class: 'slot' });
    var bank = h('div', { class: 'bank' });
    var picked = [];

    function refresh() {
      slot.innerHTML = '';
      slot.classList.toggle('filled', picked.length > 0);
      picked.forEach(function (p, i) {
        var w = h('button', { class: 'word in-slot', type: 'button', text: p.word });
        w.addEventListener('click', function () {
          if (root.dataset.locked) return;
          picked.splice(i, 1);
          p.el.classList.remove('used');
          L.fx.tap(); refresh();
        });
        slot.appendChild(w);
      });
      check.disabled = picked.length === 0 || !!root.dataset.locked;
    }

    bankWords.forEach(function (w) {
      var el = h('button', { class: 'word', type: 'button', text: w });
      el.addEventListener('click', function () {
        if (root.dataset.locked || el.classList.contains('used')) return;
        el.classList.add('used');
        picked.push({ word: w, el: el });
        L.fx.tap(); refresh();
      });
      bank.appendChild(el);
    });

    var check = h('button', { class: 'btn btn-primary', type: 'button', text: 'Prüfen', disabled: true });
    check.addEventListener('click', function () {
      var mine = picked.map(function (p) { return p.word; }).join(' ');
      var res = L.matches(mine, [task.solution].concat(task.alsoAccept || []));
      root.dataset.locked = '1';
      slot.classList.add(res.ok ? 'ok' : 'no');
      bank.querySelectorAll('.word').forEach(function (b) { b.disabled = true; });
      check.remove();
      var body = res.ok
        ? markup(task.explain || '')
        : '<b>Richtig:</b> ' + esc(task.solution) + '<br>' + markup(task.explain || '');
      root.appendChild(verdict(res.ok, res.ok ? 'Perfekt gebaut.' : 'Fast - schau die Reihenfolge an', body));
      ctx.answered({ correct: res.ok, yours: mine, right: task.solution, explain: task.explain || '' });
    });

    root.appendChild(h('p', { class: 'muted', text: 'Tippe die Wörter in der richtigen Reihenfolge an. Ein paar passen nicht.' }));
    root.appendChild(slot);
    root.appendChild(bank);
    root.appendChild(h('div', { class: 'row' }, [check]));
    refresh();
    return root;
  };

  /* =============== 4. Verwandler: umformen und tippen =============== */
  L.engines.transform = function (task, ctx) {
    var root = h('div', { class: 'stack' });
    if (task.source) {
      root.appendChild(h('div', { class: 'ex-line' }, [h('div', { class: 'src', html: esc(task.source) })]));
    }
    var field = h('input', { class: 'field', type: 'text', placeholder: task.placeholder || 'Deine Lösung …', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false' });
    var check = h('button', { class: 'btn btn-primary', type: 'button', text: 'Prüfen' });
    var row = h('div', { class: 'type-row' }, [field, check]);
    root.appendChild(row);
    root.appendChild(accentBar(ctx.lang, field));

    var hintBtn = null;
    if (task.hint) {
      hintBtn = h('button', { class: 'btn btn-ghost btn-sm', type: 'button', text: 'Kleiner Schubs' });
      hintBtn.addEventListener('click', function () {
        hintBtn.replaceWith(h('p', { class: 'muted', html: '💡 ' + esc(task.hint) }));
      });
      root.appendChild(h('div', { class: 'row' }, [hintBtn]));
    }

    function submit() {
      var mine = field.value.trim();
      if (!mine) { field.focus(); return; }
      var accepted = [].concat(task.answer);
      var res = L.matches(mine, accepted);
      field.disabled = true; check.disabled = true;
      if (hintBtn && hintBtn.parentNode) hintBtn.disabled = true;

      var body = '';
      if (res.ok && !res.exact) {
        body = 'Inhaltlich richtig - nur die Akzente fehlen: <b>' + esc(res.target) + '</b><br>';
      } else if (!res.ok) {
        var d = L.diff(mine, accepted[0]);
        var html = d.map(function (p) {
          return '<span class="' + p[0] + '">' + esc(p[1]) + '</span>';
        }).join('');
        body = '<div class="diff" style="margin-bottom:8px">' + html + '</div>';
      }
      body += markup(task.explain || '');
      if (accepted.length > 1 && res.ok) {
        body += '<br><span class="muted">Auch möglich: ' + esc(accepted.slice(1).join(' · ')) + '</span>';
      }
      root.appendChild(verdict(res.ok, res.ok ? (res.exact ? 'Genau so.' : 'Richtig - fast perfekt') : 'Schau mal genau hin', body));
      ctx.answered({
        correct: res.ok,
        exact: res.exact,
        yours: mine,
        right: accepted[0],
        explain: task.explain || ''
      });
    }
    check.addEventListener('click', submit);
    field.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
    setTimeout(function () { field.focus(); }, 120);
    return root;
  };

  /* =============== 5. Paarjagd: zusammenbringen =============== */
  L.engines.pairs = function (task, ctx) {
    var root = h('div', { class: 'stack' });
    var left = L.shuffle(task.pairs.map(function (p, i) { return { i: i, t: p[0] }; }));
    var right = L.shuffle(task.pairs.map(function (p, i) { return { i: i, t: p[1] }; }));
    var sel = null, hits = 0, misses = 0;
    var colA = h('div', { class: 'pcol' }), colB = h('div', { class: 'pcol' });

    function make(item, side, col) {
      var b = h('button', { class: 'pitem', type: 'button', text: item.t });
      b.addEventListener('click', function () {
        if (b.classList.contains('matched')) return;
        if (!sel) {
          sel = { item: item, side: side, el: b };
          b.classList.add('sel'); L.fx.tap();
          return;
        }
        if (sel.el === b) { b.classList.remove('sel'); sel = null; return; }
        if (sel.side === side) { sel.el.classList.remove('sel'); sel = { item: item, side: side, el: b }; b.classList.add('sel'); return; }
        if (sel.item.i === item.i) {
          sel.el.classList.remove('sel');
          sel.el.classList.add('matched'); b.classList.add('matched');
          hits++; L.fx.right(hits); L.sparks(b, 8);
          sel = null;
          if (hits === task.pairs.length) finish();
        } else {
          var a = sel.el;
          a.classList.remove('sel'); a.classList.add('shake'); b.classList.add('shake');
          misses++; L.fx.wrong();
          setTimeout(function () { a.classList.remove('shake'); b.classList.remove('shake'); }, 420);
          sel = null;
        }
      });
      col.appendChild(b);
    }
    left.forEach(function (it) { make(it, 'a', colA); });
    right.forEach(function (it) { make(it, 'b', colB); });

    function finish() {
      var clean = misses === 0;
      var body = clean ? markup(task.explain || '')
        : 'Du hast <b>' + misses + '</b> Fehlversuch' + (misses === 1 ? '' : 'e') + ' gebraucht. ' + markup(task.explain || '');
      root.appendChild(verdict(clean, clean ? 'Alles auf Anhieb.' : 'Geschafft.', body));
      ctx.answered({
        correct: clean,
        partial: Math.max(0, 1 - misses / (task.pairs.length * 1.5)),
        yours: misses + ' Fehlversuche',
        right: task.pairs.length + ' Paare',
        explain: task.explain || ''
      });
    }

    root.appendChild(h('p', { class: 'muted', text: 'Immer zwei antippen, die zusammengehören.' }));
    root.appendChild(h('div', { class: 'pairs' }, [colA, colB]));
    return root;
  };

  /* =============== 6. Freischreiben: produzieren, dann vergleichen =============== */
  L.engines.write = function (task, ctx) {
    var root = h('div', { class: 'stack' });
    var field = h('textarea', { class: 'field', placeholder: task.placeholder || 'Schreib los - Fehler sind hier ausdrücklich erlaubt.' });
    root.appendChild(field);
    root.appendChild(accentBar(ctx.lang, field));

    if (task.mustUse && task.mustUse.length) {
      var chips = h('div', { class: 'row', style: 'margin-top:4px' });
      chips.appendChild(h('span', { class: 'muted', text: 'Bau ein:' }));
      task.mustUse.forEach(function (w) { chips.appendChild(h('span', { class: 'tag ghost', text: w, 'data-w': w })); });
      root.appendChild(chips);
      field.addEventListener('input', function () {
        var v = L.norm(field.value);
        chips.querySelectorAll('.tag').forEach(function (t) {
          var got = v.indexOf(L.norm(t.getAttribute('data-w'))) !== -1;
          t.classList.toggle('ghost', !got);
          t.classList.toggle('hot', got);
        });
      });
    }

    var go = h('button', { class: 'btn btn-primary', type: 'button', text: 'Fertig - Musterlösung zeigen' });
    root.appendChild(h('div', { class: 'row' }, [go]));

    go.addEventListener('click', function () {
      var mine = field.value.trim();
      var words = mine ? mine.split(/\s+/).length : 0;
      field.disabled = true; go.remove();
      var used = (task.mustUse || []).filter(function (w) { return L.norm(mine).indexOf(L.norm(w)) !== -1; });
      var enough = words >= (task.minWords || 15);

      var panel = h('div', { class: 'stack' });
      panel.appendChild(h('div', { class: 'card' }, [
        h('div', { class: 'task-kind', text: 'So könnte es klingen' }),
        h('p', { style: 'margin-top:8px;color:var(--ink);font-size:15.5px;line-height:1.7', html: markup(task.model).replace(/\n/g, '<br>') })
      ]));

      if (task.checklist && task.checklist.length) {
        var list = h('div', { class: 'stack', style: 'gap:8px' });
        list.appendChild(h('h3', { text: 'Vergleich deinen Text damit:' }));
        var ticked = 0;
        task.checklist.forEach(function (c) {
          var b = h('button', { class: 'opt', type: 'button' }, [
            h('span', { class: 'key', text: '○' }),
            h('span', { text: c })
          ]);
          b.addEventListener('click', function () {
            var on = b.classList.toggle('right');
            b.querySelector('.key').textContent = on ? '✓' : '○';
            ticked += on ? 1 : -1;
            L.fx.tap();
          });
          list.appendChild(b);
        });
        panel.appendChild(h('div', { class: 'card' }, [list]));
      }
      root.appendChild(panel);

      var note = [];
      note.push(words + ' Wörter geschrieben');
      if ((task.mustUse || []).length) note.push(used.length + '/' + task.mustUse.length + ' Zielwörter benutzt');
      L.fx.done();
      ctx.answered({
        correct: enough && used.length >= Math.ceil(((task.mustUse || []).length) * 0.6),
        freeform: true,
        yours: mine,
        right: task.model,
        explain: note.join(' · ')
      });
    });
    return root;
  };

})(window.LEKTION);
</script>
<script>/* assets/js/stations.js */
/* Sprachen - die sechs Stationen einer Lerneinheit. */
(function (L) {
  'use strict';
  var h = L.h, esc = L.esc;

  L.STATIONS = [
    { id: 'intro',  label: 'Einstieg' },
    { id: 'vocab',  label: 'Wörter' },
    { id: 'read',   label: 'Lesen' },
    { id: 'train',  label: 'Training' },
    { id: 'listen', label: 'Hören' },
    { id: 'wrap',   label: 'Feedback' }
  ];

  L.views = {};

  /* ---------------- Startseite: zwei Flaggen ---------------- */
  function flagSvg(code) {
    if (code === 'fr') {
      return '<svg class="flag" viewBox="0 0 90 60" aria-hidden="true">' +
        '<rect width="30" height="60" fill="#0d2c8c"/><rect x="30" width="30" height="60" fill="#fff"/>' +
        '<rect x="60" width="30" height="60" fill="#d8283c"/></svg>';
    }

        g.appendChild(c);
      });

    /* Drei Durchgänge */
    var protocol = li.protocol || defaultProtocol(lesson.lang);
    var block = h('div', { class: 'stack' });
    block.appendChild(h('h3', { text: 'Drei Durchgänge - mehr braucht es nicht' }));
    protocol.forEach(function (p, idx) {
      var pane = h('div', { class: 'pass' + (idx === 0 ? ' active' : '') + (S.listening.passes[idx] ? ' done' : '') });

        h('div', { class: 'pass-n', text: S.listening.passes[idx] ? '✓' : String(idx + 1) }),
        h('div', { style: 'flex:1' }, [
          h('div', { class: 't', text: p.title }),
          h('div', { class: 's', text: p.how })
        ])
      ]);
      head.addEventListener('click', function () {
        block.querySelectorAll('.pass').forEach(function (o) { if (o !== pane) o.classList.remove('active'); });

      });
      var body = h('div', { class: 'pass-body' });
      body.appendChild(h('p', { style: 'font-size:14px', text: p.task }));
      var ta = h('textarea', { class: 'field', placeholder: p.placeholder || 'Notiere in Stichworten …', style: 'min-height:90px' });
      ta.value = S.listening.notes[idx] || '';
      ta.addEventListener('input', function () { S.listening.notes[idx] = ta.value; L.persistProgress(); });
      body.appendChild(ta);
      var ok = h('button', { class: 'btn btn-sm', type: 'button', text: 'Durchgang erledigt' });
      ok.addEventListener('click', function () {
        S.listening.passes[idx] = true;
        pane.classList.add('done');
        pane.querySelector('.pass-n').textContent = '✓';
        L.addXp(15); L.sparks(ok, 12); L.fx.right(idx + 1);
        L.persistProgress();
        var nxt = block.querySelectorAll('.pass')[idx + 1];
        if (nxt) { pane.classList.remove('active'); nxt.classList.add('active'); }

      body.appendChild(h('div', { class: 'row' }, [ok]));
      pane.appendChild(head); pane.appendChild(body);
      block.appendChild(pane);
    });

    /* Selbsteinschätzung */
    var self = h('div', { class: 'card' }, [
      h('h3', { text: 'Wie viel ist hängen geblieben?' }),
      h('p', { class: 'muted', style: 'margin-top:6px', text: 'Ehrlich sein lohnt sich - danach richte ich das nächste Hörmaterial aus.' })
    ]);
    var scale = h('div', { class: 'scale', style: 'margin-top:14px' });
    ['😵', '🙁', '🙂', '😄', '🤩'].forEach(function (e, i) {

      b.addEventListener('click', function () {
        scale.querySelectorAll('button').forEach(function (o) { o.setAttribute('aria-pressed', 'false'); });
        b.setAttribute('aria-pressed', 'true');

      h('span', { text: 'kaum was verstanden' }), h('span', { text: 'fast alles' })

  };

  function defaultProtocol(lang) {
    var L1 = lang === 'fr' ? 'Französisch' : 'Spanisch';
    return [
      { title: 'Einmal ganz durch, ohne Pause',

        task: 'Sammle Zahlen, Namen, Orte und fünf Wörter, die du wiedererkannt hast. Auch Bruchstücke zählen.',
        placeholder: 'Zahlen / Namen / Wörter …' },
      { title: 'Eine Minute laut nachsprechen',
        how: 'Irgendeine Stelle, die du magst',

        placeholder: 'Welche Stelle? Was war schwierig auszusprechen?' }

  }

  /* ---------------- Station 6: Umfrage + Abschluss ---------------- */
  var DEFAULT_SURVEY = [
    { id: 'difficulty', type: 'scale', q: 'War die Einheit vom Niveau her passend?',
      low: 'viel zu leicht', high: 'viel zu schwer', emojis: ['🥱', '🙂', '👌', '😅', '🥵'] },
    { id: 'fun', type: 'scale', q: 'Und - hat es Spass gemacht?',
      low: 'zäh', high: 'mehr davon', emojis: ['😐', '🙂', '😊', '😃', '🔥'] },
    { id: 'more', type: 'choice', q: 'Willst du beim nächsten Mal am gleichen Thema dranbleiben?',
      options: ['Ja, gleiches Grammatikthema vertiefen', 'Gleiches Thema, aber anderer Inhalt', 'Nein, etwas Neues'] },
    { id: 'weakest', type: 'choice', q: 'Was hat sich am wackligsten angefühlt?',
      options: ['Die Grammatik', 'Der Wortschatz', 'Der Lesetext', 'Das Hörverstehen', 'Nichts davon'] },
    { id: 'length', type: 'choice', q: 'Zur Länge:',
      options: ['Zu kurz, ich hätte weitergemacht', 'Genau richtig', 'Zu lang'] },
    { id: 'wish', type: 'text', q: 'Wunsch an die nächste Einheit?',
      placeholder: 'z.B. mehr Subjuntivo, Thema Reisen, längerer Hörtext …' }
  ];

  L.views.wrap = function (lesson) {
    var v = h('div', { class: 'view wrap stack-lg' });
    var S = L.session;
    S.survey = S.survey || {};
    var questions = (lesson.survey && lesson.survey.length ? lesson.survey : DEFAULT_SURVEY);

    var scored = S.results.filter(function (r) { return r && !r.freeform; });
    var right = scored.filter(function (r) { return r.correct; }).length;
    var pct = scored.length ? Math.round(right / scored.length * 100) : 0;

    v.appendChild(h('div', { style: 'text-align:center' }, [
      h('div', { class: 'eyebrow', style: 'justify-content:center', text: 'Geschafft' }),
      L.ring(pct),
      h('h1', { style: 'margin-top:12px', text: praise(pct) }),
      h('p', { class: 'lead', style: 'margin-top:10px', text: lesson.outro || 'Noch drei Fragen - damit die nächste Einheit besser auf dich passt als diese.' })
    ]));

    v.appendChild(h('div', { class: 'stat-grid' }, [
      stat(right + '/' + scored.length, 'richtig'),
      stat(String(L.state.xp), 'XP gesamt'),
      stat(String(Object.keys(S.listening && S.listening.passes || {}).length) + '/3', 'Hördurchgänge'),
      stat(minutes(), 'Minuten')
    ]));

    /* Umfrage */
    var form = h('div', { class: 'card' });
    questions.forEach(function (q) {
      var blk = h('div', { class: 'q-block' }, [h('div', { class: 'q-title', text: q.q })]);
      if (q.type === 'scale') {
        var sc = h('div', { class: 'scale' });
        (q.emojis || ['1', '2', '3', '4', '5']).forEach(function (e, i) {
          var b = h('button', { type: 'button', text: e, 'aria-pressed': S.survey[q.id] === i + 1 ? 'true' : 'false' });
          b.addEventListener('click', function () {
            sc.querySelectorAll('button').forEach(function (o) { o.setAttribute('aria-pressed', 'false'); });
            b.setAttribute('aria-pressed', 'true');
            S.survey[q.id] = i + 1; L.fx.tap(); L.persistProgress(); refreshDone();
          });
          sc.appendChild(b);
        });
        blk.appendChild(sc);
        blk.appendChild(h('div', { class: 'scale-legend' }, [
          h('span', { text: q.low || '' }), h('span', { text: q.high || '' })
        ]));
      } else if (q.type === 'choice') {
        var ch = h('div', { class: 'choices' });
        q.options.forEach(function (o) {
          var b = h('button', { class: 'choice', type: 'button', text: o, 'aria-pressed': S.survey[q.id] === o ? 'true' : 'false' });
          b.addEventListener('click', function () {
            ch.querySelectorAll('.choice').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
            b.setAttribute('aria-pressed', 'true');
            S.survey[q.id] = o; L.fx.tap(); L.persistProgress(); refreshDone();
          });
          ch.appendChild(b);
        });
        blk.appendChild(ch);
      } else {
        var ta = h('textarea', { class: 'field', placeholder: q.placeholder || '', style: 'min-height:80px' });
        ta.value = S.survey[q.id] || '';
        ta.addEventListener('input', function () {
          S.survey[q.id] = ta.value; L.persistProgress(); refreshDone();
        });
        blk.appendChild(ta);
      }
      form.appendChild(blk);
    });
    v.appendChild(form);

    /* Fehlerrückblick */
    var wrong = S.results.filter(function (r) { return r && !r.correct && !r.freeform; });
    if (wrong.length) {
      v.appendChild(h('div', { class: 'stack' }, [
        h('h3', { text: 'Dein Fehlerprotokoll - das nimmst du mit' })
      ].concat(wrong.map(L.mistakeCard))));
    }

    /* Bericht für Claude */
    var reportCard = h('div', { class: 'card' });
    reportCard.appendChild(h('h3', { text: 'Und jetzt das Wichtigste' }));
    reportCard.appendChild(h('p', { style: 'margin-top:8px;font-size:14.5px',
      text: 'Kopier den Bericht und wirf ihn Claude in den Chat. Damit weiss er beim nächsten Mal, was sitzt, was wackelt und worauf du Lust hast.' }));
    var pre = h('div', { class: 'report-box' });
    reportCard.appendChild(h('div', { style: 'margin-top:14px' }, [pre]));

    var copyBtn = h('button', { class: 'btn btn-primary', type: 'button', text: '📋 Bericht kopieren' });

    reportCard.appendChild(h('div', { class: 'row', style: 'margin-top:12px' }, [copyBtn, dlBtn]));
    v.appendChild(reportCard);

    function refreshDone() { pre.textContent = L.buildReport(lesson); }

    copyBtn.addEventListener('click', function () {
      var txt = L.buildReport(lesson);

        navigator.clipboard.writeText(txt).then(done, function () { fallbackCopy(txt, done); });
      } else fallbackCopy(txt, done);
      finishLesson(lesson);
    });
    dlBtn.addEventListener('click', function () {
      var blob = new Blob([L.buildReport(lesson)], { type: 'application/json' });

      a.download = 'bericht-' + lesson.id + '.json';
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
      finishLesson(lesson);
    });

    var home = h('button', { class: 'btn btn-ghost btn-block', type: 'button', text: 'Zurück zur Übersicht' });

    return v;
  };

  function fallbackCopy(txt, done) {
    var ta = document.createElement('textarea');
    ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); }
    catch (e) { L.toast('Kopieren klappt hier nicht - nimm den Knopf «Als Datei».', 3600); }
    ta.remove();
  }

  function finishLesson(lesson) {
    var S = L.session;
    if (L.state.done[lesson.id]) return;
    var scored = S.results.filter(function (r) { return r && !r.freeform; });
    L.state.done[lesson.id] = {
      at: new Date().toISOString(),
      right: scored.filter(function (r) { return r.correct; }).length,
      total: scored.length,
      minutes: minutes()
    };
    L.addXp(40);
    L.save();
  }

  function minutes() {
    var S = L.session;
    return Math.max(1, Math.round((Date.now() - (S.startedAt || Date.now())) / 60000));
  }
  function stat(n, l) { return h('div', { class: 'stat' }, [h('div', { class: 'n', text: n }), h('div', { class: 'l', text: l })]); }
  function praise(p) {
    if (p >= 90) return 'Das war stark.';
    if (p >= 70) return 'Gut gemacht.';
    if (p >= 45) return 'Durchgezogen - zählt.';
    return 'Angefangen ist die halbe Miete.';
  }

  /* ---------------- Bericht ---------------- */
  L.buildReport = function (lesson) {
    var S = L.session;
    var scored = S.results.filter(function (r) { return r && !r.freeform; });
    var byGrammar = {};
    S.results.forEach(function (r) {
      if (!r || !r.grammar || r.freeform) return;
      var g = byGrammar[r.grammar] || (byGrammar[r.grammar] = { right: 0, total: 0 });
      g.total++; if (r.correct) g.right++;
    });
    var report = {
      bericht: 'lerneinheit',
      version: 1,
      lektion: lesson.id,
      sprache: lesson.lang,
      niveau: lesson.level,
      datum: new Date().toISOString().slice(0, 10),
      minuten: minutes(),
      ergebnis: { richtig: scored.filter(function (r) { return r.correct; }).length, gesamt: scored.length },
      grammatik: byGrammar,
      fehler: S.results.filter(function (r) { return r && !r.correct && !r.freeform; })
        .map(function (r) { return { typ: r.type, thema: r.grammar, meins: r.yours, richtig: r.right }; }),
      freitext: S.results.filter(function (r) { return r && r.freeform; })
        .map(function (r) { return r.yours; }),
      hoeren: {
        quelle: (lesson.listening && lesson.listening.source && lesson.listening.source.name) || null,
        durchgaenge: Object.keys((S.listening && S.listening.passes) || {}).length,
        selbsteinschaetzung: (S.listening && S.listening.selfRating) || null,
        notizen: (S.listening && S.listening.notes) || {}
      },
      umfrage: S.survey || {}
    };
    return 'LERNBERICHT ' + lesson.id + '\n' + JSON.stringify(report, null, 1);
  };

})(window.LEKTION);
</script>
