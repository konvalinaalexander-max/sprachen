<script>/* assets/js/audio.js */
/* Sprachen - Folgen finden und abspielen.
   Statt auf eine Website zu verlinken, holt die App über die öffentliche
   iTunes-Lookup-Schnittstelle die Folgenliste eines Podcasts und spielt die
   Audiodatei direkt ab. Kein Abo, kein Login, keine Suche nach der Folge.

   Zwei Wege, weil einer immer klemmt:
     1. fetch()  - itunes.apple.com liefert CORS-Freigabe
     2. JSONP    - <script>-Tag, funktioniert auch über file:// ohne CORS
   Klappt beides nicht, gibt es einen ehrlichen Hinweis plus Direktlink. */
(function (L) {
  'use strict';
  var h = L.h;

  var cache = {};

  function endpoint(id, country) {
    return 'https://itunes.apple.com/lookup?id=' + encodeURIComponent(id) +
      '&country=' + encodeURIComponent(country || 'us') +
      '&media=podcast&entity=podcastEpisode&limit=40';
  }

  function viaFetch(url) {
    if (typeof fetch !== 'function') return Promise.reject(new Error('kein fetch'));
    return fetch(url, { mode: 'cors', credentials: 'omit' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  }

  function viaJsonp(url) {
    return new Promise(function (resolve, reject) {
      var name = '__lek_cb_' + Math.random().toString(36).slice(2);
      var s = document.createElement('script');
      var timer = setTimeout(function () { cleanup(); reject(new Error('Zeitüberschreitung')); }, 12000);
      function cleanup() {
        clearTimeout(timer);
        try { delete window[name]; } catch (e) { window[name] = undefined; }
        if (s.parentNode) s.parentNode.removeChild(s);
      }
      window[name] = function (data) { cleanup(); resolve(data); };
      s.onerror = function () { cleanup(); reject(new Error('Skript blockiert')); };
      s.src = url + '&callback=' + name;
      document.head.appendChild(s);
    });
  }

  /* Liefert { show, episodes:[{title, date, ms, url, page, desc}] } */
  L.podcast = function (id, country) {
    var key = id + '|' + (country || 'us');
    if (cache[key]) return cache[key];
    var url = endpoint(id, country);
    var pr = viaFetch(url)
      .catch(function () { return viaJsonp(url); })
      .then(function (data) {
        var res = (data && data.results) || [];
        var show = res.filter(function (r) { return r.wrapperType !== 'podcastEpisode'; })[0] || {};
        var eps = res.filter(function (r) { return r.wrapperType === 'podcastEpisode' && r.episodeUrl; })
          .map(function (r) {
            return {
              title: r.trackName || '',
              date: (r.releaseDate || '').slice(0, 10),
              ms: r.trackTimeMillis || 0,
              url: r.episodeUrl,
              page: r.trackViewUrl || '',
              desc: (r.shortDescription || r.description || '').replace(/<[^>]*>/g, '').trim()
            };
          })
          .sort(function (a, b) { return a.date < b.date ? 1 : -1; });
        if (!eps.length) throw new Error('keine Folgen gefunden');
        return { show: { name: show.collectionName || '', art: show.artworkUrl100 || '', page: show.collectionViewUrl || '' }, episodes: eps };
      });
    cache[key] = pr;
    pr.catch(function () { delete cache[key]; });
    return pr;
  };

  L.fmtLen = function (ms) {
    if (!ms) return '';
    var m = Math.round(ms / 60000);
    return m + ' min';
  };
  L.fmtDay = function (iso, lang) {
    if (!iso) return '';
    var loc = { es: 'es-ES', fr: 'fr-FR' }[lang] || 'de-CH';
    try {
      return new Date(iso + 'T12:00:00').toLocaleDateString(loc, { day: 'numeric', month: 'long' });
    } catch (e) { return iso; }
  };

  /* ---------------------------------------------------------------
     Spieler: sucht die passende Folge, zeigt Titel und Datum an,
     spielt direkt ab. Mit Umschalter auf ältere Folgen.
     --------------------------------------------------------------- */
  L.player = function (src, lang, onEpisode) {
    var box = h('div', { class: 'player' });
    var status = h('div', { class: 'player-status' }, [
      h('span', { class: 'spinner', 'aria-hidden': 'true' }),
      h('span', { text: L.t('a.searching') })
    ]);
    box.appendChild(status);

    var minM = src.minMinutes || 0;
    var maxM = src.maxMinutes || 9999;

    L.podcast(src.itunesId, src.country).then(function (data) {
      var fit = data.episodes.filter(function (e) {
        var m = e.ms / 60000;
        return !e.ms || (m >= minM && m <= maxM);
      });
      var list = (fit.length ? fit : data.episodes).slice(0, 12);
      render(list, data);
    }).catch(function (err) {
      status.remove();
      box.appendChild(fallback(src, err));
    });

    function render(list, data) {
      status.remove();
      var idx = 0;
      var audio = h('audio', { controls: 'controls', preload: 'none', class: 'player-audio' });
      var title = h('div', { class: 'ep-title' });
      var meta = h('div', { class: 'ep-meta' });

      function pick(i) {
        idx = i;
        var e = list[i];
        audio.src = e.url;
        title.textContent = e.title;
        meta.innerHTML = '';
        meta.appendChild(h('span', { class: 'tag', text: L.fmtDay(e.date, lang) }));
        if (e.ms) meta.appendChild(h('span', { class: 'tag', text: L.fmtLen(e.ms) }));
        meta.appendChild(h('a', { class: 'tag link', href: e.url, target: '_blank', rel: 'noopener',
          text: L.t('a.file') }));
        if (onEpisode) onEpisode(e);
      }

      box.appendChild(h('div', { class: 'ep-head' }, [
        h('div', { class: 'ep-live', text: L.t('a.found') }),
        title, meta
      ]));
      box.appendChild(audio);

      if (list.length > 1) {
        var more = h('details', { class: 'ep-more' });
        more.appendChild(h('summary', { text: L.t('a.other', { n: list.length - 1 }) }));
        var ul = h('div', { class: 'ep-list' });
        list.forEach(function (e, i) {
          var b = h('button', { class: 'ep-item', type: 'button' }, [
            h('span', { class: 'ep-item-t', text: e.title }),
            h('span', { class: 'ep-item-m', text: L.fmtDay(e.date, lang) + (e.ms ? ' · ' + L.fmtLen(e.ms) : '') })
          ]);
          b.addEventListener('click', function () {
            ul.querySelectorAll('.ep-item').forEach(function (o) { o.classList.remove('on'); });
            b.classList.add('on');
            pick(i);
            audio.play().catch(function () {});
            L.fx.tap();
          });
          ul.appendChild(b);
        });
        more.appendChild(ul);
        box.appendChild(more);
        ul.querySelectorAll('.ep-item')[0].classList.add('on');
      }
      pick(0);
    }

    function fallback(src, err) {
      var wrap = h('div', { class: 'player-fail' });
      wrap.appendChild(h('div', { class: 'pf-head' }, [
        h('span', { text: '⚠' }),
        h('span', { text: L.t('a.failTitle') })
      ]));
      wrap.appendChild(h('p', { class: 'muted', text: L.t('a.failText') }));
      var row = h('div', { class: 'row', style: 'margin-top:10px' });
      if (src.homepage) {
        row.appendChild(h('a', { class: 'btn btn-sm', href: src.homepage, target: '_blank', rel: 'noopener',
          text: L.t('a.website') + ' ↗' }));
      }
      row.appendChild(h('a', {
        class: 'btn btn-sm', target: '_blank', rel: 'noopener',
        href: 'https://podcasts.apple.com/podcast/id' + src.itunesId,
        text: 'Apple Podcasts ↗'
      }));
      wrap.appendChild(row);
      wrap.appendChild(h('p', { class: 'muted', style: 'margin-top:8px;font-size:11.5px',
        text: '(' + (err && err.message ? err.message : 'unbekannter Fehler') + ')' }));
      return wrap;
    }

    return box;
  };

})(window.LEKTION);
</script>
<script>/* assets/js/tasks.js */
/* Sprachen - Aufgabentypen.
   Jede Engine bekommt (task, ctx) und liefert ein Element.
   ctx.answered({correct, yours, right, explain, skipped}) meldet das Ergebnis zurück. */
(function (L) {
  'use strict';
  var h = L.h, esc = L.esc;
  var markup = function (s) { return L.markup(s); };
  var T = function (k, v) { return L.t(k, v); };
  L.engines = {};

  function verdict(good, title, bodyHtml) {
    return h('div', { class: 'verdict ' + (good ? 'good' : 'bad') }, [
      h('div', { class: 'ic', text: good ? '✓' : '✕' }),
      h('div', {}, [
        h('div', { class: 't', text: title }),
        h('p', { html: bodyHtml || '' })
      ])
    ]);
  }
  L.verdictBox = verdict;

  function lockButtons(root) {
    root.querySelectorAll('button').forEach(function (b) { b.disabled = true; });
  }

  /* Akzent-Schnelltasten unter Eingabefeldern */
  function accentBar(lang, field) {
    var sets = {
      es: ['á', 'é', 'í', 'ó', 'ú', 'ñ', 'ü', '¿', '¡'],
      fr: ['é', 'è', 'ê', 'à', 'â', 'ç', 'î', 'ô', 'û', 'ë']
    };
    var bar = h('div', { class: 'accents' });
    (sets[lang] || []).forEach(function (ch) {
      bar.appendChild(h('button', {
        class: 'acc', type: 'button', text: ch, tabindex: '-1',
        onclick: function (e) {
          e.preventDefault();
          var s = field.selectionStart, en = field.selectionEnd;
          field.value = field.value.slice(0, s) + ch + field.value.slice(en);
          field.focus();
          field.selectionStart = field.selectionEnd = s + ch.length;
          L.fx.tap();
        }
      }));
    });
    return bar;
  }

  /* =============== 1. Blitz: Auswahl mit Begründung =============== */
  L.engines.choice = function (task, ctx) {
    var root = h('div', { class: 'stack' });
    var opts = h('div', { class: 'opts' });
    var keys = 'ABCD';
    var order = task.keepOrder ? task.options.map(function (_, i) { return i; })
                               : L.shuffle(task.options.map(function (_, i) { return i; }));

    order.forEach(function (idx, pos) {
      var o = task.options[idx];
      var label = typeof o === 'string' ? o : o.text;
      var btn = h('button', { class: 'opt', type: 'button' }, [
        h('span', { class: 'key', text: keys[pos] || '·' }),
        h('span', { html: esc(label) })
      ]);
      btn.addEventListener('click', function () {
        var right = (idx === task.answer);
        lockButtons(root);
        opts.querySelectorAll('.opt').forEach(function (b, i) {
          var oi = order[i];
          if (oi === task.answer) b.classList.add('right');
          else if (b === btn) b.classList.add('wrong');
          else b.classList.add('faded');
        });
        var chosen = task.options[idx];
        var why = (typeof chosen === 'object' && chosen.why) ? chosen.why : '';
        var body = (right ? '' : '<b>' + T('v.shouldBe') + '</b> ' + esc(labelOf(task.options[task.answer])) + '<br>')
          + markup(why || task.explain || '');
        if (why && task.explain) body += '<br><span class="muted">' + markup(task.explain) + '</span>';
        root.appendChild(verdict(right, right ? (task.praise || T('v.hit')) : T('v.miss'), body));
        ctx.answered({
          correct: right,
          yours: labelOf(chosen),
          right: labelOf(task.options[task.answer]),
          explain: why || task.explain || ''
        });
      });
      opts.appendChild(btn);
    });
    function labelOf(o) { return typeof o === 'string' ? o : o.text; }
    root.appendChild(opts);
    return root;
  };

  /* =============== 2. Textdetektiv: Aussage prüfen + Beleg klicken =============== */
  L.engines.evidence = function (task, ctx) {
    var root = h('div', { class: 'stack' });
    var choices = [
      { id: 'richtig', label: T('v.yes') },
      { id: 'falsch', label: T('v.no') },
      { id: 'unklar', label: T('v.unclear') }
    ];
    var opts = h('div', { class: 'opts' });
    choices.forEach(function (c, i) {
      var b = h('button', { class: 'opt', type: 'button' }, [
        h('span', { class: 'key', text: ['✓', '✕', '?'][i] }),
        h('span', { text: c.label })
      ]);
      b.addEventListener('click', function () { pick(c.id, b); });
      opts.appendChild(b);
    });
    root.appendChild(opts);

    function pick(id, btn) {
      var right = (id === task.verdict);
      lockButtons(root);
      opts.querySelectorAll('.opt').forEach(function (b, i) {
        if (choices[i].id === task.verdict) b.classList.add('right');
        else if (b === btn) b.classList.add('wrong');
        else b.classList.add('faded');
      });
      if (task.verdict !== 'unklar' && task.evidence && ctx.sentences) {
        root.appendChild(evidenceStep(right));
      } else {
        root.appendChild(verdict(right, right ? T('v.sharpEye') : T('v.notQuite'), markup(task.explain || '')));
        ctx.answered({ correct: right, yours: labelFor(id), right: labelFor(task.verdict), explain: task.explain || '' });
      }
    }
    function labelFor(id) {
      for (var i = 0; i < choices.length; i++) if (choices[i].id === id) return choices[i].label;
      return id;
    }

    function evidenceStep(verdictWasRight) {
      var box = h('div', { class: 'stack' });
      box.appendChild(h('p', { class: 'muted', text: T('v.proveIt') }));
      var ev = h('div', { class: 'evidence' });
      var found = false;
      ctx.sentences.forEach(function (s) {
        var isIt = !found && task.evidence && s.text.indexOf(task.evidence) !== -1;
        if (isIt) found = true;
        var span = h('span', { class: 'sent', text: s.text + ' ' });
        span.addEventListener('click', function () {
          if (ev.dataset.locked) return;
          ev.dataset.locked = '1';
          span.classList.add(isIt ? 'picked-right' : 'picked-wrong');
          if (!isIt) {
            ev.querySelectorAll('.sent').forEach(function (o, i) {
              if (ctx.sentences[i].text.indexOf(task.evidence) !== -1) o.classList.add('picked-right');
            });
          }
          isIt ? L.fx.right(0) : L.fx.wrong();
          var all = verdictWasRight && isIt;
          box.appendChild(verdict(all,
            all ? T('v.bothRight') : (verdictWasRight ? T('v.halfRight') : T('v.notQuite')),
            markup(task.explain || '')));
          ctx.answered({
            correct: all,
            yours: labelFor(task.verdict === 'unklar' ? 'unklar' : (verdictWasRight ? task.verdict : 'x')) + (isIt ? ' + richtiger Beleg' : ' + falscher Beleg'),
            right: labelFor(task.verdict) + ' (Beleg: "' + task.evidence + '")',
            explain: task.explain || ''
          });
        });
        ev.appendChild(span);
      });
      box.appendChild(ev);
      return box;
    }
    return root;
  };

  /* =============== 3. Satzschmiede: Wortfolge bauen =============== */
  L.engines.forge = function (task, ctx) {
    var root = h('div', { class: 'forge' });
    var target = task.solution.split(/\s+/);
    var bankWords = L.shuffle(target.concat(task.distractors || []));
    var slot = h('div', { class: 'slot' });
    var bank = h('div', { class: 'bank' });
    var picked = [];

    function refresh() {
      slot.innerHTML = '';
      slot.classList.toggle('filled', picked.length > 0);
      picked.forEach(function (p, i) {
        var w = h('button', { class: 'word in-slot', type: 'button', text: p.word });
        w.addEventListener('click', function () {
          if (root.dataset.locked) return;
          picked.splice(i, 1);
          p.el.classList.remove('used');
          L.fx.tap(); refresh();
        });
        slot.appendChild(w);
      });
      check.disabled = picked.length === 0 || !!root.dataset.locked;
    }

    bankWords.forEach(function (w) {
      var el = h('button', { class: 'word', type: 'button', text: w });
      el.addEventListener('click', function () {
        if (root.dataset.locked || el.classList.contains('used')) return;
        el.classList.add('used');
        picked.push({ word: w, el: el });
        L.fx.tap(); refresh();
      });
      bank.appendChild(el);
    });

    var check = h('button', { class: 'btn btn-primary', type: 'button', text: T('f.check'), disabled: true });
    check.addEventListener('click', function () {
      var mine = picked.map(function (p) { return p.word; }).join(' ');
      var res = L.matches(mine, [task.solution].concat(task.alsoAccept || []));
      root.dataset.locked = '1';
      slot.classList.add(res.ok ? 'ok' : 'no');
      bank.querySelectorAll('.word').forEach(function (b) { b.disabled = true; });
      check.remove();
      var body = res.ok
        ? markup(task.explain || '')
        : '<b>' + T('f.correct') + '</b> ' + esc(task.solution) + '<br>' + markup(task.explain || '');
      root.appendChild(verdict(res.ok, res.ok ? T('f.built') : T('f.order'), body));
      ctx.answered({ correct: res.ok, yours: mine, right: task.solution, explain: task.explain || '' });
    });

    root.appendChild(h('p', { class: 'muted', text: T('f.hint') }));
    root.appendChild(slot);
    root.appendChild(bank);
    root.appendChild(h('div', { class: 'row' }, [check]));
    refresh();
    return root;
  };

  /* =============== 4. Verwandler: umformen und tippen =============== */
  L.engines.transform = function (task, ctx) {
    var root = h('div', { class: 'stack' });
    if (task.source) {
      root.appendChild(h('div', { class: 'ex-line' }, [h('div', { class: 'src', html: esc(task.source) })]));
    }
    var field = h('input', { class: 'field', type: 'text', placeholder: task.placeholder || T('t.placeholder'), autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false' });
    var check = h('button', { class: 'btn btn-primary', type: 'button', text: T('f.check') });
    var row = h('div', { class: 'type-row' }, [field, check]);
    root.appendChild(row);
    root.appendChild(accentBar(ctx.lang, field));

    var hintBtn = null;
    if (task.hint) {
      hintBtn = h('button', { class: 'btn btn-ghost btn-sm', type: 'button', text: T('t.nudge') });
      hintBtn.addEventListener('click', function () {
        hintBtn.replaceWith(h('p', { class: 'muted', html: '💡 ' + esc(task.hint) }));
      });
      root.appendChild(h('div', { class: 'row' }, [hintBtn]));
    }

    function submit() {
      var mine = field.value.trim();
      if (!mine) { field.focus(); return; }
      var accepted = [].concat(task.answer);
      var res = L.matches(mine, accepted);
      field.disabled = true; check.disabled = true;
      if (hintBtn && hintBtn.parentNode) hintBtn.disabled = true;

      var body = '';
      if (res.ok && !res.exact) {
        body = T('t.accents') + ' <b>' + esc(res.target) + '</b><br>';
      } else if (!res.ok) {
        var d = L.diff(mine, accepted[0]);
        var html = d.map(function (p) {
          return '<span class="' + p[0] + '">' + esc(p[1]) + '</span>';
        }).join('');
        body = '<div class="diff" style="margin-bottom:8px">' + html + '</div>';
      }
      body += markup(task.explain || '');
      if (accepted.length > 1 && res.ok) {
        body += '<br><span class="muted">' + T('t.also') + ' ' + esc(accepted.slice(1).join(' · ')) + '</span>';
      }
      root.appendChild(verdict(res.ok, res.ok ? (res.exact ? T('t.exact') : T('t.almost')) : T('t.look'), body));
      ctx.answered({
        correct: res.ok,
        exact: res.exact,
        yours: mine,
        right: accepted[0],
        explain: task.explain || ''
      });
    }
    check.addEventListener('click', submit);
    field.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
    setTimeout(function () { field.focus(); }, 120);
    return root;
  };

  /* =============== 5. Paarjagd: zusammenbringen =============== */
  L.engines.pairs = function (task, ctx) {
    var root = h('div', { class: 'stack' });
    var left = L.shuffle(task.pairs.map(function (p, i) { return { i: i, t: p[0] }; }));
    var right = L.shuffle(task.pairs.map(function (p, i) { return { i: i, t: p[1] }; }));
    var sel = null, hits = 0, misses = 0;
    var colA = h('div', { class: 'pcol' }), colB = h('div', { class: 'pcol' });

    function make(item, side, col) {
      var b = h('button', { class: 'pitem', type: 'button', text: item.t });
      b.addEventListener('click', function () {
        if (b.classList.contains('matched')) return;
        if (!sel) {
          sel = { item: item, side: side, el: b };
          b.classList.add('sel'); L.fx.tap();
          return;
        }
        if (sel.el === b) { b.classList.remove('sel'); sel = null; return; }
        if (sel.side === side) { sel.el.classList.remove('sel'); sel = { item: item, side: side, el: b }; b.classList.add('sel'); return; }
        if (sel.item.i === item.i) {
          sel.el.classList.remove('sel');
          sel.el.classList.add('matched'); b.classList.add('matched');
          hits++; L.fx.right(hits); L.sparks(b, 8);
          sel = null;
          if (hits === task.pairs.length) finish();
        } else {
          var a = sel.el;
          a.classList.remove('sel'); a.classList.add('shake'); b.classList.add('shake');
          misses++; L.fx.wrong();
          setTimeout(function () { a.classList.remove('shake'); b.classList.remove('shake'); }, 420);
          sel = null;
        }
      });
      col.appendChild(b);
    }
    left.forEach(function (it) { make(it, 'a', colA); });
    right.forEach(function (it) { make(it, 'b', colB); });

    function finish() {
      var clean = misses === 0;
      var body = clean ? markup(task.explain || '')
        : T('p.tries', { n: misses }) + ' ' + markup(task.explain || '');
      root.appendChild(verdict(clean, clean ? T('p.clean') : T('p.done'), body));
      ctx.answered({
        correct: clean,
        partial: Math.max(0, 1 - misses / (task.pairs.length * 1.5)),
        yours: misses + ' Fehlversuche',
        right: task.pairs.length + ' Paare',
        explain: task.explain || ''
      });
    }

    root.appendChild(h('p', { class: 'muted', text: T('p.hint') }));
    root.appendChild(h('div', { class: 'pairs' }, [colA, colB]));
    return root;
  };

  /* =============== 6. Freischreiben: produzieren, dann vergleichen =============== */
  L.engines.write = function (task, ctx) {
    var root = h('div', { class: 'stack' });
    var field = h('textarea', { class: 'field', placeholder: task.placeholder || T('w.placeholder') });
    root.appendChild(field);
    root.appendChild(accentBar(ctx.lang, field));

    if (task.mustUse && task.mustUse.length) {
      var chips = h('div', { class: 'row', style: 'margin-top:4px' });
      chips.appendChild(h('span', { class: 'muted', text: T('w.use') }));
      task.mustUse.forEach(function (w) { chips.appendChild(h('span', { class: 'tag ghost', text: w, 'data-w': w })); });
      root.appendChild(chips);
      field.addEventListener('input', function () {
        var v = L.norm(field.value);
        chips.querySelectorAll('.tag').forEach(function (t) {
          var got = v.indexOf(L.norm(t.getAttribute('data-w'))) !== -1;
          t.classList.toggle('ghost', !got);
          t.classList.toggle('hot', got);
        });
      });
    }

    var go = h('button', { class: 'btn btn-primary', type: 'button', text: T('w.go') });
    root.appendChild(h('div', { class: 'row' }, [go]));

    go.addEventListener('click', function () {
      var mine = field.value.trim();
      var words = mine ? mine.split(/\s+/).length : 0;
      field.disabled = true; go.remove();
      var used = (task.mustUse || []).filter(function (w) { return L.norm(mine).indexOf(L.norm(w)) !== -1; });
      var enough = words >= (task.minWords || 15);

      var panel = h('div', { class: 'stack' });
      panel.appendChild(h('div', { class: 'card' }, [
        h('div', { class: 'task-kind', text: T('w.model') }),
        h('p', { style: 'margin-top:8px;color:var(--ink);font-size:15.5px;line-height:1.7', html: markup(task.model).replace(/\n/g, '<br>') })
      ]));

      if (task.checklist && task.checklist.length) {
        var list = h('div', { class: 'stack', style: 'gap:8px' });
        list.appendChild(h('h3', { text: T('w.compare') }));
        var ticked = 0;
        task.checklist.forEach(function (c) {
          var b = h('button', { class: 'opt', type: 'button' }, [
            h('span', { class: 'key', text: '○' }),
            h('span', { text: c })
          ]);
          b.addEventListener('click', function () {
            var on = b.classList.toggle('right');
            b.querySelector('.key').textContent = on ? '✓' : '○';
            ticked += on ? 1 : -1;
            L.fx.tap();
          });
          list.appendChild(b);
        });
        panel.appendChild(h('div', { class: 'card' }, [list]));
      }
      root.appendChild(panel);

      var note = [];
      note.push(T('w.words', { n: words }));
      if ((task.mustUse || []).length) note.push(T('w.hit', { a: used.length, b: task.mustUse.length }));
      L.fx.done();
      ctx.answered({
        correct: enough && used.length >= Math.ceil(((task.mustUse || []).length) * 0.6),
        freeform: true,
        yours: mine,
        right: task.model,
        explain: note.join(' · ')
      });
    });
    return root;
  };

  /* =============== 7. Zeitstrahl: Reihenfolge herstellen =============== */
  L.engines.order = function (task, ctx) {
    var root = h('div', { class: 'stack' });
    root.appendChild(h('p', { class: 'muted', text: T('o.hint') }));
    var linie = h('div', { class: 'ord-linie' });
    var vorrat = h('div', { class: 'ord-vorrat' });
    root.appendChild(linie); root.appendChild(vorrat);

    var pos = 0, fehler = 0, n = task.items.length;
    L.shuffle(task.items.map(function (t, i) { return { t: t, i: i }; })).forEach(function (it) {
      var b = h('button', { class: 'ord-karte', type: 'button' }, [
        h('span', { class: 'ord-t', html: markup(it.t) })
      ]);
      b.addEventListener('click', function () {
        if (b.disabled) return;
        if (it.i === pos) {
          b.disabled = true; b.classList.add('weg');
          var gesetzt = h('div', { class: 'ord-platz' }, [
            h('span', { class: 'ord-n', text: String(pos + 1) }),
            h('span', { class: 'ord-t', html: markup(it.t) })
          ]);
          linie.appendChild(gesetzt);
          pos++; L.fx.right(pos);
          if (pos === n) fertig();
        } else {
          fehler++; L.fx.wrong();
          b.classList.add('wackel');
          setTimeout(function () { b.classList.remove('wackel'); }, 420);
        }
      });
      vorrat.appendChild(b);
    });

    function fertig() {
      var sauber = fehler === 0;
      var body = sauber ? markup(task.explain || '')
        : T('p.tries', { n: fehler }) + ' ' + markup(task.explain || '');
      root.appendChild(verdict(sauber, sauber ? T('o.clean') : T('o.done'), body));
      ctx.answered({
        correct: sauber, partial: Math.max(0, 1 - fehler / (n * 1.5)),
        yours: fehler + ' ✗', right: n + ' ✓', explain: task.explain || ''
      });
    }
    return root;
  };

  /* =============== 8. Fehlersuche: das eine falsche Wort =============== */
  L.engines.spot = function (task, ctx) {
    var root = h('div', { class: 'stack' });
    root.appendChild(h('p', { class: 'muted', text: T('s.hint') }));
    var satz = h('div', { class: 'spot-satz' });
    var teile = task.sentence.split(/(\s+)/);
    var treffer = false;
    teile.forEach(function (w) {
      if (/^\s+$/.test(w)) { satz.appendChild(document.createTextNode(w)); return; }
      var blank = L.norm(w) === L.norm(task.wrong);
      var ist = blank && !treffer;
      if (ist) treffer = true;
      var b = h('button', { class: 'spot-w', type: 'button', text: w });
      b.addEventListener('click', function () {
        if (satz.dataset.zu) return;
        satz.dataset.zu = '1';
        satz.querySelectorAll('.spot-w').forEach(function (x) { x.disabled = true; });
        b.classList.add(ist ? 'richtig' : 'falsch');
        if (!ist) {
          satz.querySelectorAll('.spot-w').forEach(function (x, k) { if (x.__ist) x.classList.add('richtig'); });
        }
        ist ? L.fx.right(1) : L.fx.wrong();
        var body = '<b>' + T('s.should') + '</b> ' + esc(task.right) + '<br>' + markup(task.explain || '');
        root.appendChild(verdict(ist, ist ? T('s.found') : T('s.missed'), body));
        ctx.answered({
          correct: ist, yours: w, right: task.wrong + ' → ' + task.right,
          explain: task.explain || ''
        });
      });
      b.__ist = ist;
      satz.appendChild(b);
    });
    root.appendChild(satz);
    return root;
  };

  /* =============== 9. Gespräch: Repliken wählen =============== */
  L.engines.dialog = function (task, ctx) {
    var root = h('div', { class: 'stack' });
    root.appendChild(h('p', { class: 'muted', text: T('dl.hint') }));
    var chat = h('div', { class: 'dlg' });
    root.appendChild(chat);

    var luecken = task.lines.filter(function (l) { return l.options; });
    var offen = 0, fehler = 0;

    function zeichne() {
      chat.innerHTML = '';
      var gezeigt = 0;
      for (var i = 0; i < task.lines.length; i++) {
        var l = task.lines[i];
        if (l.options) {
          if (gezeigt < offen) {
            var gew = l.__gewaehlt;
            chat.appendChild(h('div', { class: 'dlg-z mein' }, [
              h('div', { class: 'dlg-von', text: l.von || T('dl.turn') }),
              h('div', { class: 'dlg-blase ' + (l.__ok ? 'gut' : 'schlecht'), html: markup(gew) })
            ]));
            gezeigt++;
            continue;
          }
          chat.appendChild(auswahl(l));
          return;
        }
        chat.appendChild(h('div', { class: 'dlg-z' }, [
          h('div', { class: 'dlg-von', text: l.von || '' }),
          h('div', { class: 'dlg-blase', html: markup(l.text) })
        ]));
      }
      fertig();
    }

    function auswahl(l) {
      var box = h('div', { class: 'dlg-wahl' });
      box.appendChild(h('div', { class: 'dlg-von', text: l.von || T('dl.turn') }));
      var opts = h('div', { class: 'opts' });
      L.shuffle(l.options.map(function (_, k) { return k; })).forEach(function (k) {
        var o = l.options[k];
        var b = h('button', { class: 'opt', type: 'button' }, [
          h('span', { class: 'key', text: '»' }),
          h('span', { html: markup(o.t) })
        ]);
        b.addEventListener('click', function () {
          opts.querySelectorAll('.opt').forEach(function (x) { x.disabled = true; });
          l.__gewaehlt = o.t; l.__ok = !!o.ok;
          if (!o.ok) fehler++;
          o.ok ? L.fx.right(offen + 1) : L.fx.wrong();
          if (o.why) box.appendChild(h('p', { class: 'porque muted', html: markup(o.why) }));
          setTimeout(function () { offen++; zeichne(); }, o.why ? 1500 : 550);
        });
        opts.appendChild(b);
      });
      box.appendChild(opts);
      return box;
    }

    function fertig() {
      var sauber = fehler === 0;
      root.appendChild(verdict(sauber, sauber ? T('p.clean') : T('p.done'),
        (sauber ? '' : T('p.tries', { n: fehler }) + ' ') + markup(task.explain || '')));
      ctx.answered({
        correct: sauber, partial: 1 - fehler / Math.max(1, luecken.length),
        yours: (luecken.length - fehler) + '/' + luecken.length,
        right: luecken.length + '/' + luecken.length, explain: task.explain || ''
      });
    }
    zeichne();
    return root;
  };

})(window.LEKTION);
</script>
<script>/* assets/js/stations.js */
/* Sprachen - die sechs Stationen einer Lerneinheit.
   Sobald eine Lektion offen ist, steht hier alles in der Zielsprache. */
(function (L) {
  'use strict';
  var h = L.h, esc = L.esc;
  var markup = function (s) { return L.markup(s); };
  var rich = function (s, n) { return L.rich(s, n); };
  var T = function (k, v) { return L.t(k, v); };

  L.STATIONS = [
    { id: 'intro' }, { id: 'vocab' }, { id: 'read' },
    { id: 'train' }, { id: 'listen' }, { id: 'wrap' }
  ];
  L.stationLabel = function (id) { return T('st.' + id); };

  L.views = {};

  /* ---------------- Startseite (bleibt deutsch: hier wird erst gewählt) ---------------- */
  function flagSvg(code) {
    if (code === 'fr') {
      return '<svg class="flag" viewBox="0 0 90 60" aria-hidden="true">' +
        '<rect width="30" height="60" fill="#0d2c8c"/><rect x="30" width="30" height="60" fill="#fff"/>' +
        '<rect x="60" width="30" height="60" fill="#d8283c"/></svg>';
    }
    return '<svg class="flag" viewBox="0 0 90 60" aria-hidden="true">' +
      '<rect width="90" height="60" fill="#c60b1e"/>' +
      '<rect y="15" width="90" height="30" fill="#ffc400"/></svg>';
  }

  L.views.home = function () {
    var prof = L.profile || { languages: {} };
    var wrap = h('div', { class: 'view wrap' });

    wrap.appendChild(h('div', { class: 'home-head' }, [
      h('div', { class: 'eyebrow', text: 'Heute ' + new Date().toLocaleDateString('de-CH', { day: 'numeric', month: 'long' }) }),
      h('h1', { html: 'Womit willst du <span class="grad">Zeit verlieren</span>?' }),
      h('p', {
        class: 'lead', style: 'margin-top:14px;max-width:52ch;margin-left:auto;margin-right:auto',
        text: 'Ab hier gilt nur noch die andere Sprache. Erklärungen, Aufgaben, Knöpfe – alles. Kein deutsches Wort mehr.'
      })
    ]));

    var picker = h('div', { class: 'picker' });
    ['es', 'fr'].forEach(function (lang) {
      var meta = prof.languages[lang] || {};
      var mine = L.catalog.filter(function (e) { return e.lang === lang; })
        .sort(function (a, b) { return a.date < b.date ? 1 : -1; });
      var latest = mine[0];
      var doneCount = mine.filter(function (e) { return L.state.done[e.id]; }).length;
      var isFresh = latest && !L.state.done[latest.id];

      var card = h('button', { class: 'lang-card', 'data-l': lang, type: 'button' }, [
        h('span', { html: flagSvg(lang) }),
        h('h2', { text: meta.nativeName || (lang === 'es' ? 'Español' : 'Français') }),
        h('div', { class: 'native', text: meta.name || '' }),
        h('div', { class: 'meta' }, [
          h('span', { class: 'tag', text: (meta.level || '?') }),
          isFresh ? h('span', { class: 'tag hot', text: 'Neue Einheit' })
                  : h('span', { class: 'tag ghost', text: latest ? 'Nochmal machen' : 'Noch nichts da' }),
          doneCount ? h('span', { class: 'tag', text: doneCount + '× erledigt' }) : null
        ]),
        h('div', { class: 'cta' }, [
          h('span', { text: latest ? (latest.title || 'Loslegen') : 'Warten auf Claude' }),
          h('span', { class: 'arrow', text: '→' })
        ])
      ]);
      card.addEventListener('mouseenter', function () { document.body.dataset.lang = lang; });
      card.addEventListener('click', function () {
        if (!latest) { L.toast('Für diese Sprache liegt noch keine Einheit bereit.'); return; }
        L.fx.tap();
        L.go('#/lektion/' + latest.id);
      });
      picker.appendChild(card);
    });
    wrap.appendChild(picker);

    var older = L.catalog.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    if (older.length > 2) {
      wrap.appendChild(h('div', { class: 'card', style: 'margin-top:26px' }, [
        h('h3', { text: 'Frühere Einheiten' }),
        h('div', { class: 'stack', style: 'gap:2px;margin-top:10px' },
          older.slice(2).map(function (e) {
            return h('button', { class: 'menu-item', type: 'button', onclick: function () { L.go('#/lektion/' + e.id); } }, [
              h('span', { class: 'ic', text: e.lang === 'es' ? '🇪🇸' : '🇫🇷' }),
              h('span', {}, [
                h('div', { text: e.title }),
                h('div', { class: 'muted', style: 'font-size:12px', text: L.fmtDate(e.date, 'de') + (L.state.done[e.id] ? ' · erledigt' : '') })
              ])
            ]);
          }))
      ]));
    }

    var xp = L.state.xp;
    wrap.appendChild(h('p', {
      class: 'muted', style: 'text-align:center;margin-top:30px',
      text: xp ? ('Bisher ' + xp + ' XP' + (L.state.streakDays > 1 ? ' · ' + L.state.streakDays + ' Tage in Folge' : ''))
               : 'Noch keine XP. Das ändern wir gleich.'
    }));
    return wrap;
  };

  /* ---------------- Station 1: Einstieg ---------------- */
  L.views.intro = function (lesson) {
    var v = h('div', { class: 'view wrap stack-lg' });
    v.appendChild(h('div', {}, [
      h('div', { class: 'eyebrow', text: lesson.level + ' · ' + L.fmtDate(lesson.date, lesson.lang) }),
      h('h1', { text: lesson.title }),
      h('p', { class: 'lead', style: 'margin-top:14px', html: markup(lesson.subtitle || '') })
    ]));

    if (lesson.intro && lesson.intro.hook) {
      v.appendChild(h('div', { class: 'card' }, [
        h('div', { class: 'task-kind', text: T('intro.hook') }),
        h('div', { class: 'prose', style: 'margin-top:9px', html: rich(lesson.intro.hook, 15.5) })
      ]));
    }

    (lesson.intro.grammar || []).forEach(function (g) {
      var body = h('div', { class: 'gbox-body' });
      if (g.explain) body.appendChild(h('div', { class: 'prose', html: rich(g.explain) }));

      if (g.table && g.table.rows) {
        var t = h('table', { class: 'gtable' });
        if (g.table.head) {
          var tr = h('tr');
          g.table.head.forEach(function (c) { tr.appendChild(h('th', { text: c })); });
          t.appendChild(h('thead', {}, [tr]));
        }
        var tb = h('tbody');
        g.table.rows.forEach(function (r) {
          var tr2 = h('tr');
          r.forEach(function (c) { tr2.appendChild(h('td', { html: markup(c) })); });
          tb.appendChild(tr2);
        });
        t.appendChild(tb);
        body.appendChild(h('div', { class: 'scroll-x' }, [t]));
      }

      (g.examples || []).forEach(function (ex) {
        body.appendChild(h('div', { class: 'ex-line' }, [
          h('div', { class: 'src', html: markup(ex.src) }),
          ex.note ? h('div', { class: 'note', html: '→ ' + markup(ex.note) }) : null
        ]));
      });

      (g.pitfalls || []).forEach(function (p) {
        body.appendChild(h('div', { class: 'pitfall' }, [
          h('div', { class: 'ic', text: '⚠' }),
          h('div', {}, [h('p', { html: markup(p) })])
        ]));
      });

      v.appendChild(h('div', { class: 'gbox' }, [
        h('div', { class: 'gbox-head' }, [
          h('h3', { text: g.name }),
          g.why ? h('div', { class: 'why', html: markup(g.why) }) : null
        ]),
        body
      ]));
    });
    return v;
  };

  /* ---------------- Station 2: Wörter ----------------
     Drei Arten, dieselben Wörter zu zeigen. Welche, sagt die Lektion
     über intro.vocabMode – so fühlt sich nicht jede Einheit gleich an. */
  L.views.vocab = function (lesson) {
    var v = h('div', { class: 'view wrap stack-lg' });
    var words = (lesson.intro && lesson.intro.vocab) || [];
    var modus = (lesson.intro && lesson.intro.vocabMode) || 'raten';
    var opened = 0;

    v.appendChild(h('div', {}, [
      h('div', { class: 'eyebrow', text: T('vocab.eyebrow', { n: words.length }) }),
      h('h2', { text: T('vocab.title') }),
      h('p', { class: 'lead', style: 'margin-top:12px',
        text: T(modus === 'definicion' ? 'v.mode.def' : modus === 'campos' ? 'v.mode.feld' : 'v.mode.raten') })
    ]));

    function karte(w) {
      var umgedreht = modus === 'definicion';
      var vorn = umgedreht ? w.def : w.term;
      var hinten = umgedreht ? w.term : w.def;
      var card = h('button', { class: 'vcard' + (umgedreht ? ' rueck' : ''), type: 'button' }, [
        h('span', { class: 'hint', text: T('vocab.tap') }),
        h('div', { class: umgedreht ? 'term klein' : 'term', html: markup(vorn) }),
        (!umgedreht && w.pos) ? h('div', { class: 'pos', text: w.pos }) : null,
        h('div', { class: 'de' + (umgedreht ? ' gross' : ''), html: markup(hinten) }),
        w.example ? h('div', { class: 'ex', html: markup(w.example) }) : null
      ]);
      card.addEventListener('click', function () {
        var on = card.classList.toggle('open');
        if (on) {
          opened++; L.fx.flip();
          if (opened === words.length) { L.combo(T('vocab.all')); L.sparks(card, 16); }
        }
      });
      return card;
    }

    if (modus === 'campos') {
      var felder = {};
      words.forEach(function (w) { (felder[w.campo || '·'] = felder[w.campo || '·'] || []).push(w); });
      Object.keys(felder).forEach(function (name) {
        var grid = h('div', { class: 'vocab-grid' });
        felder[name].forEach(function (w) { grid.appendChild(karte(w)); });
        v.appendChild(h('div', { class: 'campo' }, [
          h('div', { class: 'campo-t', text: name }),
          grid
        ]));
      });
    } else {
      var grid2 = h('div', { class: 'vocab-grid' });
      words.forEach(function (w) { grid2.appendChild(karte(w)); });
      v.appendChild(grid2);
    }
    return v;
  };

  /* ---------------- Station 3: Lesen ---------------- */
  function splitSentences(text) {
    var parts = text.match(/[^.!?…]+[.!?…]+["»]?|[^.!?…]+$/g) || [text];
    return parts.map(function (s) { return s.trim(); }).filter(Boolean);
  }

  L.sentencesOf = function (lesson) {
    var out = [];
    (lesson.reading.paragraphs || []).forEach(function (p, pi) {

    var svg = '<svg width="138" height="138" viewBox="0 0 138 138">' +
      '<circle cx="69" cy="69" r="' + R + '" fill="none" stroke="rgba(255,255,255,.09)" stroke-width="9"/>' +

      if (q.type === 'scale') {

        q.emojis.forEach(function (e, i) {
          var b = h('button', { type: 'button', text: e, 'aria-pressed': S.survey[q.id] === i + 1 ? 'true' : 'false' });
          b.addEventListener('click', function () {
            sc.querySelectorAll('button').forEach(function (o) { o.setAttribute('aria-pressed', 'false'); });
            b.setAttribute('aria-pressed', 'true');
            S.survey[q.id] = i + 1; L.fx.tap(); L.persistProgress(); refresh();
          });
          sc.appendChild(b);
        });
        blk.appendChild(sc);
        blk.appendChild(h('div', { class: 'scale-legend' }, [h('span', { text: q.low }), h('span', { text: q.high })]));
      } else if (q.type === 'choice') {
        var ch = h('div', { class: 'choices' });
        q.options.forEach(function (o) {
          var b = h('button', { class: 'choice', type: 'button', text: o.label,
            'aria-pressed': S.survey[q.id] === o.id ? 'true' : 'false' });
          b.addEventListener('click', function () {
            ch.querySelectorAll('.choice').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
            b.setAttribute('aria-pressed', 'true');
            S.survey[q.id] = o.id; L.fx.tap(); L.persistProgress(); refresh();
          });
          ch.appendChild(b);
        });
        blk.appendChild(ch);
      } else {
        var ta = h('textarea', { class: 'field', placeholder: q.placeholder || '', style: 'min-height:80px' });
        ta.value = S.survey[q.id] || '';
        ta.addEventListener('input', function () { S.survey[q.id] = ta.value; L.persistProgress(); refresh(); });
        blk.appendChild(ta);
      }
      form.appendChild(blk);
    });
    v.appendChild(form);

    v.appendChild(diagnose(lesson));

    var wrong = S.results.filter(function (r) { return r && !r.correct && !r.freeform; });
    if (wrong.length) {
      v.appendChild(h('div', { class: 'stack' }, [h('h3', { text: T('e.mistakes') })].concat(wrong.map(L.mistakeCard))));
    }

    var reportCard = h('div', { class: 'card' });
    reportCard.appendChild(h('h3', { text: T('e.reportT') }));
    reportCard.appendChild(h('p', { style: 'margin-top:8px;font-size:14.5px', text: T('e.reportX') }));
    var pre = h('div', { class: 'report-box' });
    reportCard.appendChild(h('div', { style: 'margin-top:14px' }, [pre]));
    var copyBtn = h('button', { class: 'btn btn-primary', type: 'button', text: T('e.copy') });
    var dlBtn = h('button', { class: 'btn', type: 'button', text: T('e.dl') });
    reportCard.appendChild(h('div', { class: 'row', style: 'margin-top:12px' }, [githubButton(lesson), copyBtn, dlBtn]));
    v.appendChild(reportCard);

    function refresh() { pre.textContent = L.buildReport(lesson); }
    refresh();

    copyBtn.addEventListener('click', function () {
      var txt = L.buildReport(lesson);
      var done = function () { L.toast(T('e.copied')); L.sparks(copyBtn, 14); L.fx.done(); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(done, function () { fallbackCopy(txt, done); });
      } else fallbackCopy(txt, done);
      finishLesson(lesson);
    });
    dlBtn.addEventListener('click', function () {
      var blob = new Blob([L.buildReport(lesson)], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'bericht-' + lesson.id + '.json';
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
      finishLesson(lesson);
    });

    var home = h('button', { class: 'btn btn-ghost btn-block', type: 'button', text: T('e.home') });
    home.addEventListener('click', function () { finishLesson(lesson); L.go('#/'); });
    v.appendChild(home);
    return v;
  };

  /* ---------------- Niveau-Diagnose ----------------
     Nicht die Punktzahl, sondern: was kann er, was noch nicht.
     Wird auch in den Bericht geschrieben und landet so im Lernstand. */
  var SKILLS = ['verstehen', 'erkennen', 'produzieren', 'wortschatz'];
  function skillOf(task, res) {
    if (res && res.skill) return res.skill;
    if (task && task.skill) return task.skill;
    return { evidence: 'verstehen', choice: 'erkennen', pairs: 'wortschatz',
             transform: 'produzieren', forge: 'produzieren', write: 'produzieren' }[res.type] || 'erkennen';
  }

  L.skillScores = function (lesson) {
    var S = L.session, out = {};
    S.results.forEach(function (r, i) {
      if (!r) return;
      var sk = skillOf((lesson.tasks || [])[i], r);
      var b = out[sk] || (out[sk] = { right: 0, total: 0 });
      b.total++;
      if (r.correct) b.right++;
      else if (r.freeform) b.total--;     // Freitext wird nicht gegen ihn gezählt
    });
    return out;
  };

  function verdictFor(q) {
    return q >= 0.8 ? { t: T('d.solid'), c: 'ok' } : q >= 0.5 ? { t: T('d.mixed'), c: 'mid' } : { t: T('d.weak'), c: 'no' };
  }

  function diagnose(lesson) {
    var S = L.session;
    var scores = L.skillScores(lesson);
    var box = h('div', { class: 'card diag' });
    box.appendChild(h('h3', { text: T('d.title') }));
    box.appendChild(h('p', { class: 'muted', style: 'margin-top:6px', text: T('d.lead') }));

    var rows = h('div', { class: 'diag-rows' });
    SKILLS.forEach(function (sk) {
      var b = scores[sk];
      var q = b && b.total ? b.right / b.total : null;
      var vd = q === null ? { t: T('d.none'), c: 'na' } : verdictFor(q);
      rows.appendChild(h('div', { class: 'diag-row ' + vd.c }, [
        h('div', { class: 'dr-name', text: T('d.' + sk) }),
        h('div', { class: 'dr-bar' }, [h('i', { style: 'width:' + (q === null ? 0 : Math.round(q * 100)) + '%' })]),
        h('div', { class: 'dr-v', text: vd.t + (q === null ? '' : '  ' + b.right + '/' + b.total) })
      ]));
    });

    var lr = S.listening && S.listening.selfRating;
    if (lr) {
      rows.appendChild(h('div', { class: 'diag-row ' + (lr >= 4 ? 'ok' : lr >= 3 ? 'mid' : 'no') }, [
        h('div', { class: 'dr-name', text: T('st.listen') }),
        h('div', { class: 'dr-bar' }, [h('i', { style: 'width:' + (lr / 5 * 100) + '%' })]),
        h('div', { class: 'dr-v', text: lr + '/5' })
      ]));
    }
    box.appendChild(rows);

    /* Pro Grammatikthema, mit Namen aus der Lektion */
    var byG = {};
    S.results.forEach(function (r) {
      if (!r || !r.grammar || r.freeform) return;
      var g = byG[r.grammar] || (byG[r.grammar] = { right: 0, total: 0 });
      g.total++; if (r.correct) g.right++;
    });
    var names = {};
    (lesson.intro.grammar || []).forEach(function (g) { names[g.id] = g.name; });
    var keys = Object.keys(byG);
    if (keys.length) {
      var list = h('div', { class: 'stack', style: 'gap:8px;margin-top:18px' });
      list.appendChild(h('div', { class: 'task-kind', text: T('d.next') }));
      keys.forEach(function (id) {
        var g = byG[id], q = g.right / g.total, vd = verdictFor(q);
        list.appendChild(h('div', { class: 'diag-item ' + vd.c }, [
          h('span', { class: 'di-n', text: names[id] || id }),
          h('span', { class: 'di-v', text: vd.t }),
          h('span', { class: 'di-q', text: g.right + '/' + g.total })
        ]));
      });
      box.appendChild(list);
    }
    return box;
  }

  /* ---------------- Bericht nach GitHub ---------------- */
  function githubButton(lesson) {
    var repo = (L.profile && L.profile.github) || '';
    var btn = h('button', { class: 'btn', type: 'button', text: T('g.save') });
    btn.addEventListener('click', function () {
      if (!repo) { L.toast(T('g.no'), 3600); return; }
      var body = '```json\n' + L.buildReport(lesson) + '\n```';
      var url = 'https://github.com/' + repo + '/issues/new' +
        '?title=' + encodeURIComponent('Lernbericht ' + lesson.id) +
        '&body=' + encodeURIComponent(body);
      if (url.length > 7500) {
        url = 'https://github.com/' + repo + '/issues/new' +
          '?title=' + encodeURIComponent('Lernbericht ' + lesson.id) +
          '&body=' + encodeURIComponent('```json\n' + L.buildReport(lesson, true) + '\n```');
      }
      window.open(url, '_blank', 'noopener');
      L.toast(T('g.saved'), 4200);
      finishLesson(lesson);
    });
    return btn;
  }

  function fallbackCopy(txt, done) {
    var ta = document.createElement('textarea');
    ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); }
    catch (e) { L.toast(T('e.copyFail'), 3600); }
    ta.remove();
  }

  function finishLesson(lesson) {
    var S = L.session;
    if (L.state.done[lesson.id]) return;
    var scored = S.results.filter(function (r) { return r && !r.freeform; });
    L.state.done[lesson.id] = {
      at: new Date().toISOString(),
      right: scored.filter(function (r) { return r.correct; }).length,
      total: scored.length, minutes: minutes()
    };
    L.addXp(40); L.save();
  }

  function minutes() {
    var S = L.session;
    return Math.max(1, Math.round((Date.now() - (S.startedAt || Date.now())) / 60000));
  }
  function stat(n, l) { return h('div', { class: 'stat' }, [h('div', { class: 'n', text: n }), h('div', { class: 'l', text: l })]); }
  function praise(p) { return p >= 90 ? T('e.p90') : p >= 70 ? T('e.p70') : p >= 45 ? T('e.p45') : T('e.p0'); }

  /* ---------------- Bericht ---------------- */
  L.buildReport = function (lesson, kurz) {
    var S = L.session;
    var scored = S.results.filter(function (r) { return r && !r.freeform; });
    var byGrammar = {};
    S.results.forEach(function (r) {
      if (!r || !r.grammar || r.freeform) return;
      var g = byGrammar[r.grammar] || (byGrammar[r.grammar] = { right: 0, total: 0 });
      g.total++; if (r.correct) g.right++;
    });
    var report = {
      bericht: 'lerneinheit', version: 2,
      lektion: lesson.id, sprache: lesson.lang, niveau: lesson.level,
      datum: new Date().toISOString().slice(0, 10), minuten: minutes(),
      ergebnis: { richtig: scored.filter(function (r) { return r.correct; }).length, gesamt: scored.length },
      grammatik: byGrammar,
      fehler: S.results.filter(function (r) { return r && !r.correct && !r.freeform; })
        .map(function (r) { return { typ: r.type, thema: r.grammar, meins: r.yours, richtig: r.right }; }),
      freitext: S.results.filter(function (r) { return r && r.freeform; }).map(function (r) { return r.yours; }),
      hoeren: {
        folge: (S.listening && S.listening.episode) || null,
        durchgaenge: Object.keys((S.listening && S.listening.passes) || {}).length,
        selbsteinschaetzung: (S.listening && S.listening.selfRating) || null,
        notizen: (S.listening && S.listening.notes) || {}
      },
      umfrage: S.survey || {},
      koennen: L.skillScores(lesson)
    };
    if (kurz) { delete report.freitext; report.hoeren.notizen = {}; }
    return 'LERNBERICHT ' + lesson.id + '\n' + JSON.stringify(report, null, 1);
  };

})(window.LEKTION);
</script>

<script>/* assets/js/app.js */
/* Sprachen - Router, Rahmen, Menü. */
(function (L) {
  'use strict';
  var h = L.h;
  var root, railEl, footEl, current = { id: null, station: null };

  L.go = function (hash) {
    if (location.hash === hash) route();
    else location.hash = hash;
  };

  /* ---------------- Sitzung ---------------- */
  function newSession(lesson, entry) {
    return { lessonId: lesson.id, rev: entry && entry.rev, startedAt: Date.now(), results: [], taskIndex: 0, streak: 0,
             listening: { notes: {}, passes: {}, selfRating: null }, survey: {}, station: 'intro' };
  }
  L.persistProgress = function () {
    if (!L.session) return;
    L.state.progress[L.session.lessonId] = L.session;
    L.save();
  };

  /* ---------------- Router ---------------- */
  function route() {
    var hash = location.hash || '#/';
    var m = hash.match(/^#\/lektion\/([^/]+)(?:\/([^/]+))?/);
    if (!m) {
      current = { id: null, station: null };
      L.session = null;
      L.uiLang = 'de';
      document.body.dataset.view = 'home';
      document.body.dataset.lang = 'es';
      draw(L.views.home());
      return;
    }
    var id = decodeURIComponent(m[1]);
    var entry = L.catalog.filter(function (e) { return e.id === id; })[0];
    if (!entry) { draw(missing(id)); return; }

    document.body.dataset.view = 'lesson';
    document.body.dataset.lang = entry.lang;
    L.uiLang = entry.lang;          // ab hier keine deutsche Silbe mehr

    L.load(entry).then(function (lesson) {
      if (!L.session || L.session.lessonId !== lesson.id) {
        var saved = L.state.progress[lesson.id];
        var brauchbar = saved && saved.results
          && (!entry.rev || saved.rev === entry.rev)          // Spielstand aus einer anderen Fassung? weg damit
          && !(!m[2] && (saved.station === 'wrap' || L.state.done[lesson.id]));  // fertig und neu geöffnet? von vorn
        L.session = brauchbar ? saved : newSession(lesson, entry);
        L.session.startedAt = L.session.startedAt || Date.now();
      }
      var station = m[2] || L.session.station || 'intro';
      if (!L.views[station]) station = 'intro';
      L.session.station = station;
      current = { id: id, station: station };
      L.persistProgress();
      draw(L.views[station](lesson), lesson, station);
    }).catch(function (err) {
      draw(missing(id, err.message));
    });
  }
  L.render = function () {
    var entry = L.catalog.filter(function (e) { return e.id === current.id; })[0];
    if (!entry) return route();
    var lesson = L.lessons[entry.id];
    draw(L.views[current.station](lesson), lesson, current.station);
  };

  function missing(id, why) {
    return h('div', { class: 'view wrap empty' }, [
      h('div', { class: 'big', text: '🗺️' }),
      h('h2', { text: L.t('err.title') }),
      h('p', { class: 'lead', style: 'margin-top:10px', text: why || id }),
      h('div', { class: 'row', style: 'justify-content:center;margin-top:22px' }, [
        h('button', { class: 'btn btn-primary', type: 'button', text: L.t('err.home'), onclick: function () { L.go('#/'); } })
      ])
    ]);
  }

  /* ---------------- Zeichnen ---------------- */
  function draw(view, lesson, station) {
    root.innerHTML = '';
    root.appendChild(view);
    drawRail(lesson, station);
    drawFoot(lesson, station);
    updateBadges();
    if (!window.__noscroll) window.scrollTo(0, 0);
  }

  function drawRail(lesson, station) {
    railEl.innerHTML = '';
    if (!lesson) { railEl.style.display = 'none'; return; }
    railEl.style.display = '';
    var inner = h('div', { class: 'rail-inner' });
    var cur = L.STATIONS.map(function (s) { return s.id; }).indexOf(station);
    L.STATIONS.forEach(function (s, i) {
      var state = i < cur ? 'done' : i === cur ? 'active' : 'todo';
      var b = h('button', { class: 'rail-step', 'data-state': state, type: 'button',
        disabled: i > cur + 1 ? 'disabled' : null }, [
        h('span', { class: 'bar' }, [h('i')]),
        h('span', { text: L.stationLabel(s.id) })
      ]);
      b.addEventListener('click', function () { L.go('#/lektion/' + lesson.id + '/' + s.id); });
      inner.appendChild(b);
    });
    railEl.appendChild(inner);
  }

  function drawFoot(lesson, station) {
    footEl.innerHTML = '';
    if (!lesson) { footEl.style.display = 'none'; return; }
    var idx = L.STATIONS.map(function (s) { return s.id; }).indexOf(station);
    var next = L.STATIONS[idx + 1];

    // Im Training übernimmt die Aufgabe selbst das Weiterblättern
    if (station === 'train') {
      var tasks = lesson.tasks || [];
      if ((L.session.taskIndex || 0) < tasks.length) { footEl.style.display = 'none'; return; }
    }
    if (station === 'wrap') { footEl.style.display = 'none'; return; }

    footEl.style.display = '';
    var inner = h('div', { class: 'footbar-inner' });
    inner.appendChild(h('div', { class: 'hint', text: hintFor(station) }));
    var b = h('button', { class: 'btn btn-primary', type: 'button', text: labelFor(station) });
    b.addEventListener('click', function () {
      L.fx.tap();
      L.go('#/lektion/' + lesson.id + '/' + (next ? next.id : 'wrap'));
    });
    inner.appendChild(b);
    footEl.appendChild(inner);
  }

  function labelFor(station) {
    return L.t('foot.' + station) === 'foot.' + station ? L.t('foot.next') : L.t('foot.' + station);
  }
  function hintFor(station) {
    var k = 'hint.' + station;
    return L.t(k) === k ? '' : L.t(k);
  }

  /* ---------------- Kopfzeile ---------------- */
  function updateBadges() {
    var xp = document.getElementById('xp-badge');
    if (xp) xp.innerHTML = '<b>' + L.state.xp + '</b> XP';
    var st = document.getElementById('streak-badge');
    if (st) {
      if (L.state.streakDays > 1) { st.style.display = ''; st.innerHTML = '<span class="flame">🔥</span><b>' + L.state.streakDays + '</b>'; }
      else st.style.display = 'none';
    }
  }

  /* ---------------- Menü ---------------- */
  function openMenu() {
    var sheet = document.getElementById('sheet');
    var box = sheet.querySelector('.sheet-inner');
    box.innerHTML = '';
    box.appendChild(h('h3', { text: L.t('menu.title'), style: 'margin-bottom:14px' }));

    var items = [];
    if (L.session) {
      items.push(['🏠', L.t('menu.leave'), function () { close(); L.go('#/'); }]);
      items.push(['↺', L.t('menu.restart'), function () {
        delete L.state.progress[L.session.lessonId];
        L.session = null; L.save(); close();
        location.hash = '#/lektion/' + current.id;
        route();
      }, 'danger']);
    }
    items.push([L.state.settings.sound ? '🔊' : '🔇',
      L.state.settings.sound ? L.t('menu.soundOff') : L.t('menu.soundOn'), function () {
        L.state.settings.sound = !L.state.settings.sound; L.save(); close();
        L.toast(L.state.settings.sound ? L.t('toast.soundOn') : L.t('toast.soundOff'));
      }]);
    if (!L.standalone) {
      items.push(['📖', L.t('menu.docs'), function () { close(); window.open('docs/QUELLEN.md', '_blank'); }]);
    }
    items.push(['🧹', L.t('menu.reset'), function () {
      if (confirm(L.t('menu.confirm'))) {
        L.resetAll(); L.session = null; close(); L.go('#/'); L.toast(L.t('toast.reset'));
      }
    }, 'danger']);

    items.forEach(function (it, i) {
      if (i === items.length - 1) box.appendChild(h('div', { class: 'menu-sep' }));
      box.appendChild(h('button', { class: 'menu-item ' + (it[3] || ''), type: 'button', onclick: it[2] }, [
        h('span', { class: 'ic', text: it[0] }),
        h('span', { text: it[1] })
      ]));
    });
    box.appendChild(h('div', { class: 'menu-sep' }));
    box.appendChild(h('button', { class: 'btn btn-ghost btn-block', type: 'button', text: L.t('menu.close'), onclick: close }));
    sheet.classList.add('open');
    function close() { sheet.classList.remove('open'); }
  }

  /* ---------------- Start ---------------- */
  function boot() {
    root = document.getElementById('view');
    railEl = document.getElementById('rail');
    footEl = document.getElementById('footbar');

    document.getElementById('menu-btn').addEventListener('click', openMenu);
    document.getElementById('brand').addEventListener('click', function () { L.go('#/'); });
    document.getElementById('sheet').addEventListener('click', function (e) {
      if (e.target.id === 'sheet') e.target.classList.remove('open');
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') document.getElementById('sheet').classList.remove('open');
    });
    document.addEventListener('xp:changed', updateBadges);
    window.addEventListener('hashchange', route);
    route();

    if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

})(window.LEKTION);
</script>
</body>
</html>
